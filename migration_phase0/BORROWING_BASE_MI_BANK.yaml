    parity: [borrowing_base_headroom]
  - id: C05
    question: What is facility utilisation?
    family: current
    route: borrowing_base
    ok: true
    measures: [facility_utilisation]
    parity: [facility_utilisation]
  - id: C06
    question: What is borrowing-base utilisation?
    family: current
    route: borrowing_base
    ok: true
