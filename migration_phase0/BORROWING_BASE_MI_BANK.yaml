# =========================================================================
# BORROWING-BASE MI QUESTION BANK — small, focused, executed by
# mi_agent_api/tests/test_borrowing_base_query.py against a synthetic
# three-period book and a governed facility register.
#
# The target is not answer rate. It is:
#     wrong numbers .............. 0
#     silent substitutions ....... 0
#     incorrect population ....... 0
#     unreconciled reasons ....... 0
#     route collisions ........... 0
#
# `mode` selects the facility register the question runs against:
#     approved    approved eligibility rules, effective date 2026-01-31, drawing stated as at the latest
#                 snapshot, two approved eligibility rules
#     prototype   the prototype's situation: no approved eligibility rules,
#                 the disclosed prototype assumption — history is not a
#                 contractual fact, so it refuses
#     noeffective approved rules but no recorded facility effective date, so
#                 the contractual window the terms cover is unrecorded
#     nodrawn     no current_drawn_amount supplied
#     nofacility  no facility configured for the client
#
# `parity` names measures whose MI value must equal the governed envelope's
# `measures` — the same block the dashboard renders and /mi/borrowing-base
# returns. `not_calculable` names measures the answer must report as the
# governed NOT_CALCULABLE state, never a zero.
# =========================================================================
version: 1
portfolio: client_001/mi_2026_06
as_of: "2026-06-30"

questions:
  # ---- CURRENT FACILITY POSITION ------------------------------------------
  - id: C01
    question: What is the borrowing base?
    family: current
    route: borrowing_base
    ok: true
    intent: current_position
    measures: [borrowing_base]
    parity: [borrowing_base]
  - id: C02
    question: What is our current borrowing base?
    family: current
    route: borrowing_base
    ok: true
    measures: [borrowing_base]
    parity: [borrowing_base]
  - id: C03
