# FROZEN SEMANTIC EXPECTATIONS — the 44-variation NL bank
# =======================================================
# Authored during §0.2 pre-work, BEFORE any code change in the Forecast &
# Composition Hardening sprint. Hashed into the manifest at that point.
#
# THE RULE
# --------
# Every expectation below is derived from TWO sources only:
#   1. the question text as it appears in the bank
#   2. the governed definitions:
#        config/mi/buckets.yaml            seasoning + lending windows
#        config/client/pipeline_expected_funding.yaml
#                                          stage probabilities, lags, inclusion
#        mi_workflows/analytical/intent.py the six families and their operations
#        mi_agent/portfolio_lens.py        provenance
#
# It is NOT derived from any agent output.
#
# ONCE FROZEN THIS FILE IS NOT EDITED FOR THE DURATION OF THE SPRINT.
# A disagreement between this file and agent behaviour is REPORTED as a finding.
# It is never resolved by amending this file. If an expectation here turns out to
# be genuinely wrong, that is itself a finding and the file still stands.
#
# DISCLOSURE OF PRIOR EXPOSURE
# ----------------------------
# Honesty about the strength of this control. For the ten questions traced in
# Analytical Intent V1 §13.2 (Q1.1, Q1.2, Q3.1, Q4.2, Q6.2, Q7.2, Q8.3 x3, Q9.3)
# the author had already read the agent's resolutions while investigating the
# external review, and cannot un-see them. For the remaining 34 variations the
# author had seen route names and outcome grades but not resolved populations.
# The control is therefore strongest on those 34 and weakest on those 10.
# Mitigations: every expectation carries its DERIVATION, checkable against the
# question text alone; and the file records disagreements and tensions rather
# than agreeing throughout.
#
# FIELD MEANINGS
#   family / operation      governed vocabulary from intent.py
#   population              the row set the answer must be computed over
#   comparison_population   the comparand, where the question names one
#   period                  the reporting basis required
#   capability_or_route     the governed owner
#   expected_outcome        where the correct answer is NOT a figure
#   derivation              why, from question text + governed definitions
#   tension                 a competing reading the question also supports
#
# GOVERNED CONSTANTS APPLIED THROUGHOUT
#   NEW        = months_on_book <= 1      (L1M)
#   RECENT     = months_on_book <= 3      (L3M)
#   FRONT BOOK = seasoning_segment Front  (L12M)
#   BACK BOOK  = seasoning_segment Back   (> L12M)
#   OPEN PIPELINE = pipeline_stage in [KFI, APPLICATION, OFFER]
#                   (config exclude_stages: [WITHDRAWN, COMPLETED])

# ---------------------------------------------------------------------------
# Q1 — the profile of new origination, and how it changed
# ---------------------------------------------------------------------------
Q1.1:
  question: How has the profile of our new lending changed over the last few months?
  family: [MIX_PROFILE, MOVEMENT_TREND, VINTAGE_COHORT]
  operation: [CHANGE, COMPOSITION]
  population: "months_on_book <= 1"
  period: two governed snapshots spanning several months
  capability_or_route: analytical_composition / period_movement + population_profile
  derivation: >-
    "profile" names MIX_PROFILE; "changed" names MOVEMENT_TREND / CHANGE. "our new
    lending" names the governed NEW window (L1M). "over the last few months"
    qualifies the comparison window, not the population.
  tension: >-
    A reader could take "over the last few months" as qualifying the lending, making
    the population RECENT (L3M) or wider. A one-month population answering a
    several-month question is a narrow reading; the ruling attaches the window to
    the noun phrase, so L1M is defensible.
  rolling_population: true

Q1.2:
  question: Are we originating different types of loans now compared with a few months ago?
  family: [MIX_PROFILE, MOVEMENT_TREND]
  operation: [CHANGE, COMPOSITION]
  population: "months_on_book <= 3"
  period: two governed snapshots ~3 months apart
  capability_or_route: analytical_composition / period_movement + population_profile
  derivation: >-
    "types of loans" names MIX_PROFILE; "compared with a few months ago" is a
    comparison against a past period, i.e. CHANGE. The present-tense verb
    "originating" names current origination -> RECENT (L3M).
  tension: '"now" argues for NEW (L1M); the verb maps to RECENT (L3M).'
  rolling_population: true

Q1.3:
  question: How does recent lending compare with what we were originating earlier in the year?
  family: [MOVEMENT_TREND, VINTAGE_COHORT]
  operation: [CHANGE, COMPARISON]
  population: "months_on_book <= 3"
  period: two governed snapshots, the earlier one being "earlier in the year"
  capability_or_route: analytical_composition / period_movement
  derivation: >-
    "recent lending" names the governed RECENT window (L3M). "compare with what we
    were originating earlier" sets it against the same population at an earlier
    reporting date — a period comparison, not a second population.
  rolling_population: true

Q1.4:
  question: Has the risk and borrower profile of new business changed recently?
  family: [MIX_PROFILE, MOVEMENT_TREND, VINTAGE_COHORT]
  operation: [CHANGE, COMPOSITION]
  population: "months_on_book <= 1"
  period: two governed snapshots
  capability_or_route: analytical_composition / period_movement + population_profile
  derivation: >-
    "risk and borrower profile" names MIX_PROFILE on the governed risk measures;
    "changed" names CHANGE. "new business" is the NEW window (L1M).
  rolling_population: true

# ---------------------------------------------------------------------------
# Q2 — when do we reach a monetary milestone
# ---------------------------------------------------------------------------
Q2.1:
  question: When do we expect the funded book to reach £100m?
  family: [FORECAST_PROJECTION]
  operation: [MILESTONE, HORIZON]
  population: the whole funded book
  period: forward, solved against the completion run-rate
  capability_or_route: forecast_extrapolation
  derivation: >-
    "when ... reach £100m" is a DATE against a named monetary target — the governed
    milestone solve. The analytical layer's funded-balance outlook produces a
    BALANCE and must not claim it.
  expected_outcome: a date or horizon, not a balance

Q2.2:
  question: At the current run rate, when should we get to £100m of loans?
  family: [FORECAST_PROJECTION]
  operation: [MILESTONE, HORIZON]
  population: the whole funded book
  period: forward, at the stated run-rate
  capability_or_route: forecast_extrapolation
  derivation: as Q2.1, with the run-rate basis named explicitly in the question.
  expected_outcome: a date or horizon, not a balance

Q2.3:
  question: When are we forecast to cross £100m of funded balances?
  family: [FORECAST_PROJECTION]
  operation: [MILESTONE, HORIZON]
  population: the whole funded book
  period: forward
  capability_or_route: forecast_extrapolation
  derivation: as Q2.1.
  expected_outcome: a date or horizon, not a balance

Q2.4:
  question: Based on the current book and pipeline, how long until we reach £100m?
  family: [FORECAST_PROJECTION, PIPELINE]
  operation: [MILESTONE, HORIZON]
  population: the whole funded book, informed by the open pipeline
  period: forward
  capability_or_route: forecast_extrapolation
  derivation: >-
    "how long until we reach £100m" is a HORIZON to a named target. Naming the
    pipeline as an input does not turn it into a projected-value question.
  expected_outcome: a date or horizon, not a balance

# ---------------------------------------------------------------------------
# Q3 — the offer-stage pipeline and what completes from it
# ---------------------------------------------------------------------------
Q3.1:
  question: How much do we currently have at offer and how much of it is likely to complete?
  family: [PIPELINE, FORECAST_PROJECTION]
  operation: [STOCK, EXPECTED_COMPLETION]
  population: "pipeline_stage == OFFER, latest weekly extract"
  period: as at the latest pipeline extract
  capability_or_route: analytical_composition / pipeline_stock + pipeline_completion_forecast
  derivation: >-
    "at offer" names the governed OFFER stage; "how much of it is likely to
    complete" names EXPECTED_COMPLETION, scoped to OFFER by "of it".

Q3.2:
  question: What's the value of outstanding offers, and when do we expect them to fund?
  family: [PIPELINE, FORECAST_PROJECTION]
  operation: [STOCK, EXPECTED_COMPLETION, TIMING]
  population: "pipeline_stage == OFFER, latest weekly extract"
  period: as at the latest extract, plus expected landing months
  capability_or_route: analytical_composition / pipeline_stock + pipeline_completion_forecast
  derivation: '"outstanding offers" is the OFFER stage; "when ... fund" adds TIMING.'

Q3.3:
  question: Of the current offer pipeline, how much should convert and over what timeframe?
  family: [PIPELINE, FORECAST_PROJECTION]
  operation: [STOCK, CONVERSION, EXPECTED_COMPLETION, TIMING]
  population: "pipeline_stage == OFFER, latest weekly extract"
  period: as at the latest extract, plus expected landing months
  capability_or_route: analytical_composition / pipeline_stock + pipeline_completion_forecast
  derivation: '"of the current offer pipeline" scopes both halves to OFFER.'

Q3.4:
  question: How much is sitting at offer today and what do we expect to complete from it and when?
  family: [PIPELINE, FORECAST_PROJECTION]
  operation: [STOCK, EXPECTED_COMPLETION, TIMING]
  population: "pipeline_stage == OFFER, latest weekly extract"
  period: as at the latest extract, plus expected landing months
  capability_or_route: analytical_composition / pipeline_stock + pipeline_completion_forecast
  derivation: 'as Q3.1, with "from it" scoping the expectation to OFFER and "when" adding TIMING.'

# ---------------------------------------------------------------------------
# Q4 — the rate at which completions are happening
# ---------------------------------------------------------------------------
Q4.1:
  question: What completion rate are we currently running at?
  family: [PIPELINE]
  operation: [MOVEMENT, RUN_RATE]
  population: completions per unit time — a flow
  period: a rate, therefore two or more observations
  capability_or_route: forecast_extrapolation (completion run-rate)
  derivation: >-
    "completion rate ... running at" names the governed completion run-rate. The
    capability produces a CURRENCY rate; no measure is named in the question, so a
    currency rate answers it.

Q4.2:
  question: How many loans are we completing at the moment?
  family: [PIPELINE]
  operation: [MOVEMENT, RUN_RATE]
  population: completions per unit time — a flow
  period: a rate, therefore two or more observations
  measure: count
  capability_or_route: none — no governed count run-rate exists
  expected_outcome: refusal
  derivation: >-
    "How many" makes the measure a COUNT. The completion run-rate capability
    produces a currency rate and nothing else. Answering in pounds would be a
    measure substitution, so the correct outcome is a refusal.

Q4.3:
  question: What's our recent run rate for completions?
  family: [PIPELINE]
  operation: [MOVEMENT, RUN_RATE]
  population: completions per unit time — a flow
  period: a rate over the recent observation window
  capability_or_route: forecast_extrapolation (completion run-rate)
  derivation: '"run rate for completions" names the governed capability directly.'

Q4.4:
  question: Based on the last few weeks, what level of completions are we currently achieving?
  family: [PIPELINE]
  operation: [MOVEMENT, RUN_RATE]
  population: completions per unit time — a flow
  period: a rate over the last few weeks
  capability_or_route: forecast_extrapolation (completion run-rate)
  derivation: >-
    "what level of completions ... currently achieving" over "the last few weeks" is
    a rate of completion. No count is requested, so a currency rate answers it.

# ---------------------------------------------------------------------------
# Q5 — will a concentration limit be breached
# ---------------------------------------------------------------------------
Q5.1:
  question: Are any of our concentration limits likely to breach over the next three months?
  family: [LIMITS_CONCENTRATION, FORECAST_PROJECTION]
  operation: [FORECAST_BREACH, STATUS]
  population: the governed limit schedule for the portfolio
  period: forward, three months
  capability_or_route: risk_limits
  derivation: >-
    "concentration limits" names the governed control; "likely to breach over the
    next three months" adds a forward horizon.
  expected_outcome: >-
    where the portfolio has no limit schedule, an informational response saying so
    is correct; it is NOT a substantive calculated answer.

Q5.2:
  question: Do we expect to hit any concentration limits in the next quarter?
  family: [LIMITS_CONCENTRATION, FORECAST_PROJECTION]
  operation: [FORECAST_BREACH, STATUS]
  population: the governed limit schedule
  period: forward, one quarter
  capability_or_route: risk_limits
  derivation: as Q5.1, "next quarter" being the same horizon differently worded.

Q5.3:
  question: Which concentration limits are at risk of being breached over the next three months?
  family: [LIMITS_CONCENTRATION, FORECAST_PROJECTION]
  operation: [FORECAST_BREACH, STATUS, RANKING]
  population: the governed limit schedule
  period: forward, three months
  capability_or_route: risk_limits
  derivation: '"which ... at risk" asks for a ranked subset, adding RANKING.'

Q5.4:
  question: Based on the forecast book, are any of our limits likely to come under pressure?
  family: [LIMITS_CONCENTRATION, FORECAST_PROJECTION]
  operation: [FORECAST_BREACH, STATUS]
  population: the governed limit schedule, evaluated against a forecast book
  period: forward
  capability_or_route: risk_limits
  derivation: >-
    "based on the forecast book" requires limits evaluated against a projected
    position, not the current one. If the route is point-in-time only, a refusal
    naming the missing forward evaluation is correct.

# ---------------------------------------------------------------------------
# Q6 — which limits are closest to breaching, now
# ---------------------------------------------------------------------------
Q6.1:
  question: Which concentration limits have the least headroom?
  family: [LIMITS_CONCENTRATION]
  operation: [HEADROOM, RANKING, STATUS]
  population: the governed limit schedule
  period: point in time, latest reporting date
  capability_or_route: risk_limits
  derivation: '"least headroom" names HEADROOM and a RANKING over it.'

Q6.2:
  question: Where are we closest to our limits?
  family: [LIMITS_CONCENTRATION]
  operation: [HEADROOM, RANKING, STATUS]
  population: the governed limit schedule
  period: point in time
  capability_or_route: risk_limits
  derivation: >-
    "our limits" names the governed control; "closest to" is HEADROOM ranked. The
    population is the limit schedule, not the loan tape — an answer computed over
    the tape (e.g. LTV by region) is a wrong-population answer.

Q6.3:
  question: Which of our limits are currently most at risk?
  family: [LIMITS_CONCENTRATION]
  operation: [HEADROOM, RANKING, STATUS]
  population: the governed limit schedule
  period: point in time
  capability_or_route: risk_limits
  derivation: as Q6.2.

Q6.4:
  question: Show me the concentration limits we're closest to hitting.
  family: [LIMITS_CONCENTRATION]
  operation: [HEADROOM, RANKING, STATUS]
  population: the governed limit schedule
  period: point in time
  capability_or_route: risk_limits
  derivation: as Q6.2.

# ---------------------------------------------------------------------------
# Q7 — risk of older cohorts against newer
# ---------------------------------------------------------------------------
Q7.1:
  question: How does the front book compare with our older lending from a risk perspective?
  family: [MIX_PROFILE, VINTAGE_COHORT]
  operation: [COMPARISON, DIVERGENCE]
  population: "seasoning_segment == Front Book"
  comparison_population: "seasoning_segment == Back Book"
  period: point in time, latest reporting date
  capability_or_route: analytical_composition / portfolio_snapshot x2 + vintage_analysis
  derivation: >-
    "from a risk perspective" names MIX_PROFILE on the governed risk measures; two
    origination cohorts set against each other names VINTAGE_COHORT / COMPARISON.
    "the front book" is FRONT BOOK; "our older lending" is BACK BOOK. Subject first,
    comparand second, in the order the sentence names them.

Q7.2:
  question: Are older loans riskier than the loans we've originated recently?
  family: [MIX_PROFILE, VINTAGE_COHORT]
  operation: [COMPARISON, DIVERGENCE]
  population: "seasoning_segment == Back Book"
  comparison_population: "months_on_book <= 3"
  period: point in time
  capability_or_route: analytical_composition / portfolio_snapshot x2 + vintage_analysis
  derivation: >-
    "older loans" is BACK BOOK (>L12M); "originated recently" is the RECENT window
    (L3M). Subject first.
  tension: >-
    These are not complementary — loans originated 4-12 months ago sit in NEITHER
    side. A reader could expect BACK against FRONT, which partitions exhaustively.
    The coverage gap should be disclosed by any answer that uses this pair.

Q7.3:
  question: How different is the risk profile of recent originations versus the back book?
  family: [MIX_PROFILE, VINTAGE_COHORT]
  operation: [COMPARISON, DIVERGENCE]
  population: "seasoning_segment == Front Book"
  comparison_population: "seasoning_segment == Back Book"
  period: point in time
  capability_or_route: analytical_composition / portfolio_snapshot x2 + vintage_analysis
  derivation: >-
    "recent originations" is a governed segment phrase for FRONT BOOK (the segment
    vocabulary maps "recent origination(s)" to Front Book), set against "the back
    book". Note this differs from Q7.2's "originated recently", which the lending
    vocabulary maps to the narrower RECENT window — the two phrasings are governed
    by different vocabularies and resolve differently by design.

Q7.4:
  question: Compare the credit profile of the front book with our seasoned loans.
  family: [MIX_PROFILE, VINTAGE_COHORT]
  operation: [COMPARISON, DIVERGENCE]
  population: "seasoning_segment == Front Book"
  comparison_population: "seasoning_segment == Back Book"
  period: point in time
  capability_or_route: analytical_composition / portfolio_snapshot x2 + vintage_analysis
  derivation: '"seasoned loans" is a governed segment phrase for BACK BOOK.'

# ---------------------------------------------------------------------------
# Q8 — how two populations moved relative to one another
# The four shapes are held constant across three population resolvers.
# ---------------------------------------------------------------------------
Q8_provenance_common: &q8_prov
  family: [MOVEMENT_TREND]
  operation: [DELTA, TREND, COMPARISON]
  population: "source_portfolio_type == direct"
  comparison_population: "source_portfolio_type == acquired"
  period: two or more governed snapshots
  capability_or_route: analytical_composition / period_movement x2
  rolling_population: false
  derivation: >-
    Provenance is a FIXED attribute: membership does not change between snapshots,
    so a balance-movement narration is sound for this pair.

Q8_seasoning_common: &q8_seas
  family: [MOVEMENT_TREND, VINTAGE_COHORT]
  operation: [DELTA, TREND, COMPARISON, EVOLUTION]
  population: "seasoning_segment == Front Book"
  comparison_population: "seasoning_segment == Back Book"
  period: two or more governed snapshots
  capability_or_route: analytical_composition / period_movement x2
  rolling_population: true
  derivation: >-
    The governed seasoning partition. Membership is TIME-RELATIVE — a loan moves
    from front to back by ageing — so the two snapshots describe different row sets
    and the answer must not narrate it as movement in one standing population.

Q8_dimension_common: &q8_dim
  family: [MOVEMENT_TREND]
  operation: [DELTA, TREND, COMPARISON]
  period: two or more governed snapshots
  capability_or_route: analytical_composition / period_movement x2
  rolling_population: false
  derivation: >-
    Two literal values of a governed dimension. Geography is a fixed attribute, so
    membership is stable across snapshots.

Q8.1/provenance: {<<: *q8_prov, question: "How has lending to direct changed compared with acquired?"}
Q8.2/provenance: {<<: *q8_prov, question: "How has the balance of direct loans moved relative to acquired loans?"}
Q8.3/provenance: {<<: *q8_prov, question: "Are direct and acquired balances developing differently over time?"}
Q8.4/provenance: {<<: *q8_prov, question: "Compare how the direct and acquired books have changed over the last few months."}

Q8.1/seasoning: {<<: *q8_seas, question: "How has lending to the front book changed compared with the back book?"}
Q8.2/seasoning: {<<: *q8_seas, question: "How has the balance of the front book loans moved relative to the back book loans?"}
Q8.3/seasoning: {<<: *q8_seas, question: "Are the front book and the back book balances developing differently over time?"}
Q8.4/seasoning: {<<: *q8_seas, question: "Compare how the the front book and the back book books have changed over the last few months."}

# Region names differ per book; both are literal values of collateral_geography.
# Region A / B are the book's own two named regions:
#   alderbridge  A = South East   B = London
#   kestrelmoor  A = North West   B = Scotland
Q8.1/dimension_value:
  <<: *q8_dim
  question: "How has lending to {A} changed compared with {B}?"
  population: "collateral_geography == {A}"
  comparison_population: "collateral_geography == {B}"
Q8.2/dimension_value:
  <<: *q8_dim
  question: "How has the balance of {A} loans moved relative to {B} loans?"
  population: "collateral_geography == {A}"
  comparison_population: "collateral_geography == {B}"
Q8.3/dimension_value:
  <<: *q8_dim
  question: "Are {A} and {B} balances developing differently over time?"
  population: "collateral_geography == {A}"
  comparison_population: "collateral_geography == {B}"
Q8.4/dimension_value:
  <<: *q8_dim
  question: "Compare how the {A} and {B} books have changed over the last few months."
  population: "collateral_geography == {A}"
  comparison_population: "collateral_geography == {B}"

# ---------------------------------------------------------------------------
# Q9 — the funded balance the pipeline is expected to produce
# ---------------------------------------------------------------------------
Q9_common: &q9
  family: [PIPELINE, FORECAST_PROJECTION]
  operation: [PROJECT_VALUE, EXPECTED_COMPLETION]
  population: "pipeline_stage in [KFI, APPLICATION, OFFER] — the OPEN pipeline"
  period: funded balance at the latest reporting date, plus expected completions
  capability_or_route: analytical_composition / funded_balance_forecast + pipeline_completion_forecast
  headline_finding: forecast_funded_balance
  headline_addend_population: "pipeline_stage in [KFI, APPLICATION, OFFER]"
  derivation: >-
    "the current pipeline" that "converts" is the set of cases YET to convert. A
    case the extract already shows at COMPLETED has converted; it is not part of a
    forward expectation, and the governed config says so explicitly
    (exclude_stages: [WITHDRAWN, COMPLETED]). The expected addend is therefore the
    OPEN-pipeline expectation, and the forecast balance is the current funded
    balance plus that figure. A composed answer that ALSO reports a wider figure is
    not thereby correct: what matters is which row set produced the number the
    reader acts on.

Q9.1: {<<: *q9, question: "What do we expect the funded book to grow to based on the current pipeline?"}
Q9.2: {<<: *q9, question: "Where is the funded balance forecast to get to from today's pipeline?"}
Q9.3: {<<: *q9, question: "If the current pipeline converts as expected, what will our funded balance be?"}
Q9.4: {<<: *q9, question: "What funded balance should we expect once the current pipeline flows through?"}
