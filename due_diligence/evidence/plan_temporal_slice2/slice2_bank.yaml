  category: filtered_evolution
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: loan, statistic: count}]
    filters: [{concept: erm_product_type, comparator: eq, value: drawdown}]
    time: {form: series, grain: monthly, labels: ["each month"]}
  expect:
    disposition: EXECUTED
    shape: time_series
    basis: whole_series
    snapshots: ["2025-11-30", "2025-12-31", "2026-01-31", "2026-02-28", "2026-03-31", "2026-04-30", "2026-05-31", "2026-06-30"]
    oracle:
      how: count
      predicates: [[erm_product_type, eq, Drawdown]]

- id: S2-09
