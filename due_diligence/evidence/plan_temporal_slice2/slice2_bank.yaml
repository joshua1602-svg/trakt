    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    filters: [{concept: current_loan_to_value, comparator: gt, value: 50}]
    time: {form: series, grain: monthly, periods_back: 3, labels: ["the last three months"]}
  expect:
    disposition: EXECUTED
    shape: time_series
    basis: count
    snapshots: ["2026-04-30", "2026-05-31", "2026-06-30"]
    oracle:
      how: sum
      column: current_outstanding_balance
      predicates: [[current_loan_to_value, gt, 50]]

