# ==========================================================================  #
# NEGATIVE AND SAFETY CONTROLS — every one of these must fail closed.
# ==========================================================================  #

- id: S2-N1
  question: "How has funded balance changed over the last twelve months?"
  category: unavailable_period
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: monthly, periods_back: 12, labels: ["the last twelve months"]}
  expect: {disposition: CLARIFY, reason: PERIOD_NOT_AVAILABLE}

- id: S2-N2
  question: "How has funded balance moved recently?"
  category: ambiguous_period
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: monthly, labels: ["last few months"]}
  expect: {disposition: CLARIFY, reason: PERIOD_LABEL_UNRESOLVED}
  note: >
    A vague recency. The legacy path resolves this by governed convention
    (`period_request.governed_recent_months`, three months) and discloses the
    choice; slice 2 clarifies instead, because a window chosen for the reader is
    a period substitution however well it is disclosed.

# --- the two recorded model interpretations, verbatim ----------------------- #
#
# NOT paraphrased and not tidied: these are the `intent` blocks of NL1A and NL8C
# as Opus emitted them in run 8, which are the ONLY two generic-analysis
# temporal interpretations the recorded corpus contains. Both clarify at the
# compiler, before slice 2's perimeter is consulted. That is the finding, and it
# is why this bank exists: the 135-question corpus covers movement, bridge and
# forecast temporal questions and contains no funded-book temporal EVALUATION
# question at all.

- id: S2-R1
  question: "How has the profile of our new lending changed over the last few months?"
  category: recorded_interpretation
  source: recorded
  recorded_case: NL1A
  expect: {disposition: COMPILE_CLARIFY, reason: MODEL_FLAGGED_AMBIGUITY}

- id: S2-R2
  question: "Are direct and acquired balances developing differently over time?"
  category: recorded_interpretation
  source: recorded
  recorded_case: NL8C
  expect: {disposition: COMPILE_CLARIFY, reason: AMBIGUOUS_PERIOD}

- id: S2-N4
  question: "What will funded balance be over the next three months?"
  category: future_period
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: forward_looking, grain: monthly, labels: ["the next three months"]}
  expect: {disposition: COMPILE_REFUSE, reason: UNSUPPORTED_COMPOSITION}

- id: S2-N5
  question: "Show funded balance for each of the last four weeks."
  category: unsupported_cadence
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: weekly, periods_back: 4, labels: ["the last four weeks"]}
  expect: {disposition: CLARIFY, reason: UNSUPPORTED_CADENCE}

- id: S2-N6
  question: "How has the pipeline moved each month?"
  category: pipeline_temporal
  intent:
    capability: generic_analysis
    operation: series
    population: {base: pipeline, lens: all, seasoning: any}
    measures: [{concept: loan, statistic: count}]
    time: {form: series, grain: monthly, labels: ["each month"]}
  expect: {disposition: INELIGIBLE, reason: POPULATION_NOT_FUNDED}

- id: S2-N7
  question: "How much of the balance growth came from the acquired book each month?"
  category: acquisition_attribution
  intent:
    capability: generic_analysis
    operation: series
    population: {base: funded, lens: acquired, seasoning: any}
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: monthly, labels: ["each month"]}
  expect: {disposition: INELIGIBLE, reason: EXPLICIT_LENS}

- id: S2-N8
  question: "Why did funded balance increase last month?"
  category: movement_cause
  intent:
    capability: generic_analysis
    operation: movement
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: relative_pair, grain: monthly, periods_back: 1, labels: ["last month"]}
  expect: {disposition: INELIGIBLE, reason: OPERATION_NOT_TEMPORAL}

- id: S2-N9
  question: "Give balance, loan count and average LTV each month."
  category: multi_output_temporal
  intent:
    capability: generic_analysis
    operation: series
    measures:
      - {concept: current_outstanding_balance, statistic: sum}
      - {concept: loan, statistic: count}
      - {concept: current_loan_to_value, statistic: average}
    time: {form: series, grain: monthly, labels: ["each month"]}
  expect: {disposition: INELIGIBLE, reason: NOT_SINGLE_OUTPUT}

- id: S2-N10
  question: "How has the borrowing base moved each month?"
  category: specialist_measure
  intent:
    capability: borrowing_base
    operation: series
    measures: [{concept: borrowing_base}]
    time: {form: series, grain: monthly, labels: ["each month"]}
  expect: {disposition: INELIGIBLE, reason: CAPABILITY_NOT_GENERIC}

- id: S2-N11
  question: "What was funded balance in August?"
  category: absent_snapshot
  intent:
    capability: generic_analysis
    operation: point_in_time
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: explicit_period, grain: monthly, labels: ["August"]}
  expect: {disposition: CLARIFY, reason: PERIOD_NOT_AVAILABLE}

- id: S2-N12
  question: "Show funded balance by region over the last three months."
  category: geography_axis
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    geography: {requested: true, basis: collateral, level: reporting, group_by: true}
    time: {form: series, grain: monthly, periods_back: 3, labels: ["the last three months"]}
  expect: {disposition: INELIGIBLE, reason: GEOGRAPHY_REQUESTED}
  note: >
    IN the slice 2 contract as a shape and OUT of it as a binding. The geography
    axis is resolved by the geography basis owner, which the accepted slice 1
    adapter binds none of; slice 2 does not widen that, so a time x geography
    question is ineligible rather than answered on some other axis. Recorded
    here as a known boundary, not as a defect.
