# Slice 2 acceptance bank — funded-book temporal evaluation.
#
# THIRTY cases: EIGHTEEN questions that must execute and reconcile — the ten
# required categories with a paraphrase on five of them — and TWELVE negative
# and safety controls, which the slice 2 contract asks for as a separate set.
# Small on purpose; this is a capability slice, not a corpus.
#
# WHERE THE INTENTS COME FROM, STATED PLAINLY. Each case carries a
# `CandidateIntent` payload. Twenty of them are AUTHORED — written here, parsed
# by the production `parse_candidate_intent` and compiled by the production
# `DeterministicCompiler`, so what they exercise is the compiler, the perimeter,
# the temporal resolver and the executor. They are NOT model output, because
# this environment holds no ANTHROPIC_API_KEY and the slice was measured with
# zero live calls. They therefore prove nothing about whether Opus states
# temporal intent this way, and the report says so rather than implying model
# coverage the run did not buy.
#
# The two cases marked `source: recorded` DO come from the model: they are
# `NL1A` and `NL8C` of `run8_135_signoff_2b00172.json`, the only two
# generic-analysis series interpretations in the recorded corpus, replayed here
# byte-for-byte as Opus emitted them. What they show is worth having and is not
# flattering: real temporal questions arrive with a period the contract cannot
# settle, and slice 2 clarifies rather than choosing a window.
#
# `expect.snapshots` is written out by hand against the eight-month fixture
# (2025-11-30 … 2026-06-30). It is not read back from the product, so a wrongly
# selected snapshot fails here instead of agreeing with itself.

fixture:
  periods: 8
  first_reporting_date: "2025-11-30"
  last_reporting_date: "2026-06-30"
  cadence: monthly

cases:

# --- 1. funded balance over the last N months ------------------------------ #
- id: S2-01
  question: "How has funded balance changed over the last 6 months?"
  category: last_n_months
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: monthly, periods_back: 6, labels: ["the last six months"]}
  expect:
    disposition: EXECUTED
    shape: time_series
    basis: count
    snapshots: ["2026-01-31", "2026-02-28", "2026-03-31", "2026-04-30", "2026-05-31", "2026-06-30"]
    oracle: {how: sum, column: current_outstanding_balance}

- id: S2-02
  question: "Show me the funded book balance for each of the last three months."
  category: last_n_months
  paraphrase_of: S2-01
  intent:
    capability: generic_analysis
    operation: series
    measures: [{concept: current_outstanding_balance, statistic: sum}]
    time: {form: series, grain: monthly, periods_back: 3, labels: ["the last three months"]}
  expect:
    disposition: EXECUTED
    shape: time_series
    basis: count
    snapshots: ["2026-04-30", "2026-05-31", "2026-06-30"]
    oracle: {how: sum, column: current_outstanding_balance}

# --- 2. funded balance each month ------------------------------------------ #
- id: S2-03
  question: "What was funded balance each month?"
