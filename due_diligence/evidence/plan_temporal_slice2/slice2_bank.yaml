    time: {form: series, grain: monthly, labels: ["each month"]}
  expect:
    disposition: EXECUTED
    shape: time_series
    basis: whole_series
    snapshots: ["2025-11-30", "2025-12-31", "2026-01-31", "2026-02-28", "2026-03-31", "2026-04-30", "2026-05-31", "2026-06-30"]
