# =====================================================================
# SIMULATED PORTFOLIO — deterministic asset-class hardening framework
# =====================================================================
# Master client config for the simulated bridge-lending book generated by
# simulation/. Isolated from config/client/* so it can never be picked up by a
# real run. Layer 3 (master client config) — same shape as
# config/client/config_client_ERM_UK.yaml.

client:
  client_id: sim_bridge
  display_name: "Simulated Bridge Lending Book"
  environment: simulation
  synthetic: true
  synthetic_notice: "DETERMINISTIC SIMULATION DATA — NOT A REAL CUSTOMER"

portfolio:
  asset_class: cre
  country: GB
  base_currency: GBP
  # Deliberately NOT set. Every monthly file carries its own cut-off date; a
  # static override here would collapse the whole history onto one date and the
  # historical-integration assertions would be testing nothing.
  static_reporting_date: null

default_regime: ESMA_Annex3
supported_regimes:
  - ESMA_Annex3
regime: ESMA_Annex3

pipeline:
  loan_engine_enabled: false
  mi_enabled: true
  # The MI run stops at Gate 3b. Regime projection is a separate, explicit
  # invocation so a regime failure can never be mistaken for an MI failure.
  esma_enabled: false

pipeline_persistence:
  enabled: false

defaults:
  # Structurally shaped but deliberately unallocated identifiers.
  originator_legal_entity_identifier: "SIMULATIONBRG0000000"
  originator_name: "Simulated Bridge Finance Ltd"
  originator_establishment_country: "GB"

  # ESMA "no data" options, applied at REGIME PROJECTION ONLY. None of these
  # values ever enters canonical truth — that separation is one of the things
  # the framework asserts.
  nd_defaults:
    scheduled_principal_payment_frequency: ND5
    scheduled_interest_payment_frequency: ND5
    principal_grace_period_end_date: ND5
    current_interest_rate_index: ND5
    current_interest_rate_index_tenor: ND5
    current_interest_rate_margin: ND5
    interest_rate_reset_interval: ND5
    interest_rate_cap: ND5
    interest_rate_floor: ND5
    date_of_repurchase: ND5
    deposit_amount: ND5
    purchase_price: ND5
    employment_status: ND1
    customer_type: ND1

transformations:
  copy_if_missing:
    current_principal_balance: current_outstanding_balance

enrichment:
  enable:
    uk_nuts3: true
  uk_nuts3:
    nuts_csv_path: "uk_itl_master_lookup_v2.csv"
    postcode_columns: [postcode, property_postcode, property_post_code]
    target_field: geographic_region_collateral
    classification_year: 2021
    fill_only_if_blank: true

nuts_classification_year: 2021

# No regime_overrides: Annex 3 has no committed header-constant or geography
# override contract in this repository, and inventing one would be exactly the
# fabricated regulatory configuration the framework must not produce.

mi:
  branding:
    app_title: "Simulated Bridge MI"
