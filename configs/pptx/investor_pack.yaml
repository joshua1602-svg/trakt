# =========================================================================
# MI Agent — Investor / Funder PPTX pack (portfolio-aware deck definition).
# =========================================================================
#
# Every slide renders from an MI Agent API payload (see mi_agent_pptx/mi_api.py)
# — the same compute functions behind the dashboard's /mi/* endpoints — so every
# number and chart in the pack equals the dashboard for the same portfolio.
# Nothing is recomputed in the deck.
#
# COMPOSITION. A slide appears only when the portfolio justifies it. Two gates,
# both of which must pass (see mi_agent_pptx/composition.py):
#
#   when:  a condition over governed FACTS about this portfolio. Supported:
#            scope, is_total, portfolio_count, type_count, has_direct,
#            has_acquired, is_mixed, mixed_reporting_dates, has_funded,
#            has_stratifications, has_movement, has_funded_history, has_geo,
#            has_cohorts, has_multidim, has_pipeline, has_pipeline_history,
#            has_funnel, has_forecast, has_forecast_projection,
#            has_forecast_history, has_risk
#          Names, and/or/not, comparisons and `in` only — never arbitrary code.
#
#   guard: a data check on the payload the handler would draw from, so a slide
#          can never reach the deck and then discover it has nothing to show.
#
# Anything dropped is recorded with a reason and rendered in the appendix. The
# deck therefore contains NO placeholder pages.
#
# `slides[].type` maps to a handler in mi_agent_pptx/deck.py (_DISPATCH).

deck:
  name: "Investor & Funder MI Pack"
  theme: trakt_mi_agent_dark
  footer: "trakt MI Agent · Confidential — for institutional funders/investors"
  logo_path: null
  template_version: "2.3.0"

  # Funding / securitisation thresholds the Time to Scale slide reports against,
  # in the book's reporting currency. These are a REPORTING decision, not a
  # forecast one: they are added to the governed milestone ladder through the
  # `extra_thresholds` parameter that ladder already exposes, and the projection
  # itself is unchanged. The governed ladder already carries 25m/50m/75m/100m/150m;
  # 200m is named here because it is a target this pack reports against and the
  # ladder does not carry it.
  scale_targets: [200000000]

slides:
  # 1 --------------------------------------------------------------- Cover
  # States the reporting entity, the governed scope, every constituent book and
  # every reporting date. Always present — a deck must say what it is about.
  - id: cover
    type: cover
    title: "Investor & Funder MI Pack"
    question: "What is this report about?"

  # 2 ------------------------------------------------ Executive Dashboard
  # Where is the portfolio today, what is coming, and is anything approaching a
  # limit? Every tile is a governed figure a later slide also renders, so the
  # landing page cannot disagree with the pack behind it.
  - id: executive
    type: executive
    title: "Executive Position"
    question: "Where is the portfolio today, what is coming, and is anything approaching a limit?"

  # 3 --------------------------------------------------- Executive Summary
  # Deterministic governed observations. No LLM.
  - id: executive_summary
    type: exec_insights
    title: "Executive Summary"
    question: "What changed this period?"

  # 3 ------------------------------------------------ Portfolio Composition
  # The anchor slide: total, then each portfolio type on identical measures.
  - id: portfolio_composition
    type: portfolio_composition
    title: "Portfolio Composition"
    question: "What do I own today?"

  # NOTE: a separate "Direct vs Acquired" slide was removed in the close-out
  # pass. Its comparison table duplicated Portfolio Composition, and its
  # waterfall was identical to the one on Portfolio Movement and Drivers. The
  # unique measures (WA borrower age, loan movement) moved to Portfolio
  # Composition. The handler remains available for a future configuration.

  # 5 ------------------------------------------ Portfolio Movement and Drivers
  # Governed attribution: which portfolio types and which dimensions moved the
  # total. Every component reconciles exactly to the headline movement.
  - id: movement_drivers
    type: movement_drivers
    title: "Portfolio Movement and Drivers"
    question: "Why did funded AuM change during the period?"
    when: "has_attribution or has_movement"

  # 6 --------------------------------------------------------- Funded KPIs
  - id: funded_kpis
    type: kpi_summary
    title: "Funded Portfolio — Key Measures"
    question: "How large is the book and what are its characteristics?"

  # ------------------------------------------- Funded Stratifications
  # ONE 2 x 2 matrix of the four dimensions an investor asks first. The pack
  # used to spend three pages on six of them; four on one page is the executive
  # answer, and the rest are available as a deep dive below.
  - id: stratification_funded
    type: strat_barlists
    title: "Funded Stratifications"
    question: "How is exposure distributed by risk, size, borrower and geography?"
    lens: funded
    keys: [ltv, ticket, age, region]

  # OPTIONAL DEEP DIVE — the remaining governed funded dimensions. Included only
  # where the book is large enough for the second cut to earn a page.
  - id: stratification_funded_ii
    type: strat_barlists
    title: "Funded Stratifications — Secondary Dimensions"
    question: "What else characterises the book?"
    lens: funded
    keys: [rate, vintage, broker, borrower_type]
    when: "has_stratifications and funded_balance >= 25000000"

  # 9 -------------------------------------- Multi-Dimensional Risk Analytics
  - id: multidim
    type: multidim
    title: "Multi-Dimensional Risk Analytics"
    question: "Where do risk dimensions concentrate together?"

  # 10 -------------------------------------------------- Geographic Exposure
  - id: geography
    type: geo
    title: "Geographic Exposure"
    question: "Where is the collateral?"

  # 11 ------------------------------------------------------ Funded Evolution
  # A trend needs at least two reporting periods.
  - id: funded_evolution
    type: funded_evolution
    title: "Funded Balance Evolution"
    question: "How is the book changing over time?"
    when: "has_funded_history"

  # 12 ------------------------------------------------------ Vintage Cohorts
  # Vintage formation, from the governed cohort table the React Cohorts tab
  # reads (cohorts.cohort_analysis). Point-in-time by construction: it describes
  # what each vintage looks like TODAY.
  - id: cohorts
    type: cohorts
    title: "Vintage Formation"
    question: "How much of the book sits in each origination vintage?"
    when: "has_cohorts and funded_periods >= 2 and cohort_count >= 2"

  # Static-pool seasoning, from the governed progression service
  # (evolution.funded_cohort_progression) — one call per cohort, exactly as the
  # dashboard issues when a user selects a vintage. Omitted unless a cohort
  # holds loans in two or more reporting periods: a single period is a formation
  # snapshot, and joining one point into a line would be the misleading trend
  # the sufficiency rules exist to prevent.
  - id: cohort_progression
    type: cohort_progression
    title: "Cohort Progression"
    question: "How have the cohorts seasoned since they formed?"
    when: has_cohort_progression

  # 13 ---------------------------------------------------- Pipeline Overview
  # Pipeline is direct-origination only; an acquired book does not originate.
  # PIPELINE STRATIFICATIONS — the same four dimensions as the funded matrix, in
  # the same visual grammar, from the same bucket registry. The pipeline prep
  # already materialises these bands (config/mi/pipeline_field_contract.yaml
  # declares them `reused`); nothing had ever asked it for them.
  - id: stratification_pipeline
    type: strat_barlists
    title: "Pipeline Stratifications"
    question: "What is the shape of what is about to fund?"
    lens: pipeline
    keys: [ltv, ticket, age, region]
    when: "has_pipeline"

  - id: pipeline
    type: pipeline_summary
    title: "Pipeline Overview"
    question: "What is likely to fund next?"
    when: "has_pipeline"

  # 14 --------------------------------------------------- Pipeline Evolution
  - id: pipeline_evolution
    type: pipeline_evolution
    title: "Pipeline Evolution"
    question: "How is the pipeline trending?"
    when: "has_pipeline_history"

  # 15 -------------------------------------------------- Origination Funnel
  - id: funnel
    type: funnel
    title: "Origination Funnel"
    question: "How does the pipeline convert?"
    when: "has_pipeline"

  # 16 ---------------------------------- Origination Flow (KFIs & Completions)
  - id: origination_flow
    type: origination_flow
    title: "Origination Flow — KFIs & Completions"
    question: "What is the weekly origination run-rate?"
    when: "has_pipeline_history"

  # 17 ------------------------------------------------------ Forecast Bridge
  - id: forecast_bridge
    type: forecast_bridge
    title: "Forecast Bridge — Funded to Forecast"
    question: "Where is the portfolio heading on the current book?"
    when: "has_forecast"

  # 18 -------------------------------------------------- Forecast Projection
  - id: forecast_projection
    type: forecast_projection
    title: "Forecast Projection — Run-Rate Scale-Up"
    question: "What does the run-rate imply?"
    when: "has_forecast_projection"

  # ------------------------------------------ Forecast vs Actual
  # "Was the prior forecast right?" The handler has always existed; no slide was
  # ever configured for it. THREE forecast-carrying runs are required, not two:
  # two produce a single prior-forecast-versus-actual point, and one point is not
  # a track record. An immature book omits this rather than showing a line
  # through one observation.
  - id: forecast_evolution
    type: forecast_evolution
    title: "Forecast Evolution — Actual vs Prior Forecast"
    question: "Was the prior forecast right?"
    when: "has_forecast_history and forecast_periods >= 3"

  # 18b --------------------------------- Portfolio Health and Watch Items
  # At most five governed watch items and three observations. Always rendered:
  # "no material watch items" is a finding, not an empty slide.
  - id: watchlist
    type: watchlist
    title: "Portfolio Health and Watch Items"
    question: "What requires attention before the next reporting period?"

  # 19 ------------------------------------ Concentration Tests and Headroom
  # The governed, operator-approved concentration capability
  # (/mi/concentration-tests). Carries CURRENT funded, EXPECTED forecast and the
  # ALL-PIPELINE-CONVERTS stress as three distinct states — the stress is never
  # presented as the expected outcome.
  - id: concentration
    type: concentration
    title: "Concentration Tests and Headroom"
    question: "Am I operating within approved limits, and where could pressure emerge?"
    when: "has_concentration"

  # 20 ---------------------------------------------------------- Risk Limits
  # The legacy extracted monitor. Shown only when no approved concentration
  # configuration exists, so the two never appear together saying similar things.
  - id: risk
    type: risk
    title: "Risk Limits"
    question: "Am I operating within approved limits?"
    when: "has_risk and not has_concentration"

  # 21 ------------------------------------------- Data and Methodology
  # Investor-safe: scope, source dates, coverage, basis of preparation and the
  # omission ledger. Never storage locations, endpoints or module names.
  - id: methodology
    type: methodology
    title: "Data and Methodology"
    question: "What does this report cover, as at when, and how was it produced?"
