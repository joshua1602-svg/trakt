name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    env:
      # The API is reached SAME-ORIGIN through the Static Web App's linked
      # backend, not on its own hostname. That is what lets Static Web Apps
      # perform the Entra sign-in and forward the verified principal to the App
      # Service as X-MS-CLIENT-PRINCIPAL, which mi_agent_api/auth.py requires.
      #
      # An absolute cross-origin URL here (what this was) means the browser
      # sends no cookie and no token, so the API receives an anonymous request
      # and there is nothing for Easy Auth to validate.
      #
      # SWA forwards linked-backend traffic with the path intact, so the App
      # Service receives /api/mi/... — mi_agent_api/gateway.py strips the prefix.
      VITE_AGENT_API_URL: /api
      # Vite inlines VITE_* at BUILD time, so these have to be here. Setting
      # them on the API App Service afterwards cannot change a bundle that has
      # already been compiled — a build without them contains no path to the
      # feature at all. The API's own TRAKT_MI_ENHANCED_HOVERS /
      # TRAKT_MI_WEEKLY_BRIEF are separate and set on the App Service; the two
      # sides are deliberately independent, and a mismatch degrades to the
      # existing tooltip rather than erroring.
      VITE_MI_ENHANCED_HOVERS: "true"
      VITE_MI_WEEKLY_BRIEF: "true"

      # --- Phase 3: Entra bearer authentication (MSAL), OFF by default ---------
      #
      # Vite inlines VITE_* at BUILD time, so these live here and nowhere else:
      # setting them on the App Service or in the Static Web App's configuration
      # cannot change a bundle that has already been compiled.
      #
      # They are REPOSITORY VARIABLES, not secrets, and deliberately so — a client
      # id, an authority and an `api://…/MI.Access` scope are public identifiers
      # that ship inside every SPA bundle by design. This is a public client using
      # Authorization Code + PKCE; there is no secret to hold, and
      # `scripts/check-bundle-leaks.mjs` fails the build if one appears.
      #
      # With VITE_MI_BEARER_AUTH unset or false, MSAL is never constructed, no
      # token is requested, no Authorization header is attached, and the Static
      # Web Apps Easy Auth path below is exactly as it was. Set the variable to
      # `true` in repository settings to switch the new path on for the next
      # build; unset it to roll back.
      VITE_MI_BEARER_AUTH: ${{ vars.VITE_MI_BEARER_AUTH || 'false' }}
      VITE_AAD_CLIENT_ID: ${{ vars.VITE_AAD_CLIENT_ID }}
      VITE_MI_API_SCOPE: ${{ vars.VITE_MI_API_SCOPE }}
      # Optional; defaults to https://login.microsoftonline.com/organizations.
      VITE_AAD_AUTHORITY: ${{ vars.VITE_AAD_AUTHORITY }}
    
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Which hosting-layer configuration this build ships.
      #
      # Static Web Apps enforces its routes BEFORE any JavaScript runs, so the
      # default config's catch-all (`/*` → allowedRoles: ["authenticated"]) plus
      # its 401 override means an anonymous browser asking for `/` is redirected
      # to /.auth/login/aad and never receives index.html. MSAL cannot start a
      # sign-in from a page that was never served — which is why a bearer-mode
      # build was still landing on the Easy Auth authorize URL
      # (redirect_uri=…/.auth/login/aad/callback, scope=openid profile email)
      # instead of asking for api://…/MI.Access.
      #
      # So the bearer build ships a different config: the SHELL is anonymous,
      # and access control moves to MSAL + the bearer token + trakt-mi-api,
      # which stays fail-closed (react_auth.py) and is the only thing standing
      # in front of MI data either way. The default file is never edited in the
      # repository — rollback is unsetting VITE_MI_BEARER_AUTH.
      - name: Select the Static Web Apps configuration
        working-directory: frontend/mi-agent-ui
        run: |
          set -euo pipefail
          if [ "${VITE_MI_BEARER_AUTH}" = "true" ]; then
            cp staticwebapp.bearer.json staticwebapp.config.json
            echo "MODE: bearer — the SPA shell is served anonymously; MSAL and trakt-mi-api enforce access."
          else
            echo "MODE: Static Web Apps Easy Auth — unchanged."
          fi

          # Assert the shipped file matches the mode. A build that says bearer
          # and ships the gate would fail the same way this step exists to fix,
          # and would do it silently.
          python3 - "${VITE_MI_BEARER_AUTH}" <<'PY'
          import json, sys
          bearer = sys.argv[1] == "true"
          cfg = json.load(open("staticwebapp.config.json"))
          routes = {r.get("route"): r for r in cfg.get("routes", [])}
          catch_all = set(routes.get("/*", {}).get("allowedRoles") or [])
          override = (cfg.get("responseOverrides") or {}).get("401") or {}
          redirects_to_easy_auth = ".auth/login" in (override.get("redirect") or "")

          if bearer:
              assert "anonymous" in catch_all, f"catch-all is not anonymous: {catch_all}"
              assert not redirects_to_easy_auth, "a 401 still redirects to Easy Auth"
              assert not (set(routes.get("/api/*", {}).get("allowedRoles") or []) & {"client", "operator"}), \
                  "/api/* still requires a Static Web Apps role"
              print("OK: anonymous shell, no Easy Auth interception, no SWA role gate.")
          else:
              assert catch_all == {"authenticated"}, f"catch-all is not authenticated: {catch_all}"
              assert redirects_to_easy_auth, "the Easy Auth 401 redirect is missing"
              print("OK: Easy Auth behaviour preserved.")

          # True in BOTH modes, or a deep link 404s and the headers are lost.
          assert (cfg.get("navigationFallback") or {}).get("rewrite") == "/index.html"
          assert cfg.get("globalHeaders", {}).get("X-Content-Type-Options") == "nosniff"
          PY

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_SMOKE_067AC7603 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "frontend/mi-agent-ui" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_SMOKE_067AC7603 }}
          action: "close"
