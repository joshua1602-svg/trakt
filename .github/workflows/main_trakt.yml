name: Build and deploy Python project to Azure Function App - trakt

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create deployment package
        # The deployed entrypoint (root function_app.py) imports the whole
        # apps.blob_trigger_app package at module top, which in turn reaches into
        # engine/, mi_agent/, mi_agent_api/, mi_agent_pptx/ and analytics_lib/.
        # Every runtime package the trigger can import MUST ship, or the Function
        # host cannot register the trigger. Keep this list in sync with .funcignore
        # (which serves the same intent for `func azure functionapp publish`).
        #
        # operations_control/ is required by the OCC intake path:
        #   function_app.py:107        from apps.blob_trigger_app import occ_intake
        #   occ_intake.py:30-31        from operations_control.engine import OpsEngine
        # Both imports are INSIDE functions, so the host starts and the trigger
        # registers without them — the omission only surfaces on the first blob
        # arrival. .funcignore never excluded operations_control/, so a
        # `func azure functionapp publish` shipped it while this workflow did not:
        # the two deployment paths had drifted apart.
        run: |
          zip -r deploy.zip \
            function_app.py \
            host.json \
            requirements.txt \
            apps/ \
            engine/ \
            operations_control/ \
            mi_agent/ \
            mi_agent_api/ \
            mi_agent_pptx/ \
            analytics_lib/ \
            config/ \
            -x "*.pyc" "*/__pycache__/*" "*/tests/*" "*/test_*"

      - name: Show package size
        run: ls -lh deploy.zip

      - name: Sanity check package contents (fail loudly on an incomplete deploy)
        # py_compile only parses one file; it NEVER catches a missing runtime
        # package because it does not execute imports. The trigger's real failure
        # mode is `ModuleNotFoundError: No module named 'apps'` at host start,
        # which passes CI silently under py_compile. Instead: unpack the ACTUAL
        # artifact into a clean dir, install azure-functions, and import
        # function_app the way the Functions host does — so an incomplete package
        # fails the build here, not silently in production.
        # See deploy/trakt-function-app/verify_package.py for what is checked and
        # why. In short: the manifest must contain the packages reached by LAZY
        # imports inside the handler, requirements.txt must DECLARE every
        # third-party module that closure needs (the old check pip-installed a
        # hardcoded list, so a missing declaration was invisible), and the import
        # probe must walk the whole lazy chain rather than stopping at
        # `import function_app` — which succeeds even when operations_control is
        # absent.
        run: |
          set -euo pipefail
          # Manifest + declaration checks first: they need no dependencies, and
          # they emit the exact requirement lines to install for the import probe.
          python deploy/trakt-function-app/verify_package.py deploy.zip \
            --skip-imports --emit-requirements _check_reqs.txt
          python -m pip install --quiet -r _check_reqs.txt
          python deploy/trakt-function-app/verify_package.py deploy.zip

      - name: Test the deployment verification scripts
        # These scripts are the only thing standing between a silently-empty
        # remote build and production, so their own logic is tested. No Azure
        # access needed — fixtures are injected for the app settings, the Kudu
        # responses and the script that runs on the site.
        run: |
          set -euo pipefail
          bash deploy/trakt-function-app/tests/test_verify_remote_build.sh
          python3 deploy/trakt-function-app/tests/test_kudu_probe.py

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B782B4EF4C084DB68754745782B83A82 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EB5C7CA419CB478A891B392422373A3D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E4CB93E6899E4A55B8EA48212ABC8295 }}

      - name: Verify the Function App will actually run a remote build
        # `--build-remote true` asks Kudu to build, but whether Oryx installs
        # anything is decided by the app settings on the target. If the build
        # flags are off (or a read-only run-from-package mount is in the way) the
        # deployment still reports SUCCESS and installs nothing. Gate before
        # uploading, so a no-op deployment is never mistaken for a good one.
        run: bash deploy/trakt-function-app/verify_remote_build.sh prereqs trakt trakt-blob-trigger-v2

      - name: Deploy to Azure Functions with remote build
        run: |
          az functionapp deployment source config-zip \
            --resource-group trakt \
            --name trakt-blob-trigger-v2 \
            --src deploy.zip \
            --build-remote true

      - name: Let the SCM container settle
        # The build completes inside the deploy command, but site-packages is
        # written by the SCM container; give the file system a moment before
        # probing it over VFS. On the Ops API a management operation restarting
        # the SCM container mid-build was the actual cause of a dead site, so the
        # gap between "the command returned" and "the site is readable" is not
        # theoretical.
        run: sleep 30

      - name: Verify Kudu reports the deployment succeeded
        # `az ... config-zip` exiting 0 is not the same as Kudu classifying the
        # deployment as Success. Read the deployment record and say which it is,
        # dumping the deployment log when it is not.
        run: bash deploy/trakt-function-app/verify_remote_build.sh deployed trakt trakt-blob-trigger-v2

      - name: Verify the dependencies were installed on the Function App
        # The observed production failure was NOT a broken host: the trigger
        # fired and then died on `import yaml` inside
        # operations_control/engine.py. The module-level closure of the deployed
        # function_app.py needs only azure.functions, which the Python worker
        # image provides, so the host starts and the trigger registers with zero
        # packages installed from requirements.txt. Nothing downstream of the
        # deploy command checked, so a successful-looking deployment shipped an
        # unusable site. This step is that missing check.
        run: bash deploy/trakt-function-app/verify_remote_build.sh installed trakt trakt-blob-trigger-v2

      - name: Verify the OCC intake import chain works on the deployed site
        # The last gate: run the real import chain against the real
        # /home/site/wwwroot with the worker's site-packages on PYTHONPATH, so
        # the exact failing statement (engine.py:25 `import yaml`) is executed
        # and the installed binary wheels are actually loaded — which a directory
        # listing cannot prove.
        #
        # This is not an Event Grid invocation, and deliberately so: a synthetic
        # invocation cannot be side-effect-free, because
        # occ_intake.handle_arrival calls engine.create_batch(...) BEFORE it
        # downloads anything, so a probe event would write a real OCC input batch
        # and audit entries. A deployment gate must not mutate governance state.
        run: bash deploy/trakt-function-app/verify_remote_build.sh imports trakt trakt-blob-trigger-v2
