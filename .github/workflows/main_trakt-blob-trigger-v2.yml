# Sole deployment workflow for the Function App trakt-blob-trigger-v2
# (Flex Consumption plan).
#
# main_trakt.yml previously deployed this SAME app on every push to main. The two
# raced, and the loser reported:
#   "ERROR: Deployment was cancelled and another deployment is in progress."
# The winner was consistently this workflow, which ran with remote-build
# defaulting to false — so Azure installed nothing from requirements.txt and the
# Event Grid trigger died on its first lazy import with
# `ModuleNotFoundError: No module named 'yaml'`. main_trakt.yml has been retired;
# verify_flex_workflow.py now fails the build if a second deploying workflow
# reappears.
#
# Docs for the Azure Functions Deploy action: https://github.com/azure/functions-action
name: Build and deploy Python project to Azure Function App - trakt-blob-trigger-v2

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment of this app at a time. Each Flex Consumption deployment
# overwrites the current package, and overlapping runs cancel each other.
concurrency:
  group: deploy-trakt-blob-trigger-v2
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for requesting the OIDC JWT
      contents: read  # required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # No venv, no `pip install -r requirements.txt`, no .python_packages: with
      # remote-build: true the platform resolves dependencies. The previous
      # attempt at a local build did not work anyway — `source venv/bin/activate`
      # ran in its own step (each `run:` is a separate shell), so pip installed
      # into the runner's system Python rather than
      # ./.python_packages/lib/site-packages where the worker looks.

      - name: Assert exactly one workflow deploys this app, with Flex-correct inputs
        # The architecture fault, encoded. Static: no Azure, no network.
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python deploy/trakt-function-app/verify_flex_workflow.py workflow

      - name: Create deployment package
        # A curated archive, not `zip release.zip ./* -r`. That glob silently
        # dropped every dotfile — including .funcignore, so nothing was excluded —
        # while shipping the entire repository and a useless venv/. Package size
        # matters here: remote build has a 60-second timeout.
        #
        # operations_control/ is required by the OCC intake path:
        #   function_app.py:107        from apps.blob_trigger_app import occ_intake
        #   occ_intake.py:30-31        from operations_control.engine import OpsEngine
        # Both imports are INSIDE functions, so the host starts and the trigger
        # registers without them — the omission only surfaces on the first blob.
        #
        # trakt_notifications/ and trakt_core/ are the SAME shape of omission for
        # the Teams delivery worker:
        #   function_app.py            from trakt_notifications.delivery import run_once
        #   trakt_notifications/sources.py -> mi_agent_api.insight_engine -> trakt_core.perf
        # The first hop is lazy AND inside `except Exception`, so without them the
        # timer registers, fires every five minutes, logs a failure and delivers
        # nothing — which reads as "no notifications yet" rather than as a broken
        # deployment. verify_package.py now probes this chain too.
        run: |
          zip -r deploy.zip \
            function_app.py \
            host.json \
            requirements.txt \
            apps/ \
            engine/ \
            operations_control/ \
            mi_agent/ \
            mi_agent_api/ \
            mi_agent_pptx/ \
            analytics_lib/ \
            trakt_notifications/ \
            trakt_core/ \
            config/ \
            -x "*.pyc" "*/__pycache__/*" "*/tests/*" "*/test_*"

      - name: Show package size
        run: ls -lh deploy.zip

      - name: Verify the package
        # Remote build installs exactly what requirements.txt DECLARES, so both
        # halves are checked against the real artefact: the lazily imported
        # packages are in the archive, and every third-party module that closure
        # needs is declared. The import probe then walks the whole lazy chain
        # rather than stopping at `import function_app`, which succeeds even when
        # operations_control is absent. See deploy/trakt-function-app/README.md.
        #
        # The pip install here is for CI's import probe only; nothing installed
        # on the runner is shipped.
        run: |
          set -euo pipefail
          python deploy/trakt-function-app/verify_flex_workflow.py package deploy.zip
          python deploy/trakt-function-app/verify_package.py deploy.zip \
            --skip-imports --emit-requirements _check_reqs.txt
          python -m pip install --quiet -r _check_reqs.txt
          python deploy/trakt-function-app/verify_package.py deploy.zip

      - name: Test the deployment verification scripts
        run: |
          set -euo pipefail
          python deploy/trakt-function-app/tests/test_verify_flex_workflow.py
          python deploy/trakt-function-app/tests/test_verify_package.py
          bash deploy/trakt-function-app/tests/test_verify_flex_app.sh

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3DF000424F5847619F0F6B0FCAA4C55B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3C63C5B751A04788894B7099C6C581AB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_18370BCB59144E92901AC8C175A66691 }}

      - name: Verify the app is on a Flex Consumption plan
        # remote-build is the FLEX control. If this app were moved to Dedicated or
        # Elastic Premium the parameter would stop having any effect and the
        # deployment would install nothing — silently, exactly as before.
        run: bash deploy/trakt-function-app/verify_flex_app.sh plan trakt trakt-blob-trigger-v2

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'trakt-blob-trigger-v2'
          package: 'deploy.zip'
          # THE FIX. Without this the action defaults to false, meaning "the
          # packages were resolved in the workflow" — and the platform installs
          # nothing. On Flex Consumption an Oryx build is always performed during
          # a remote build, so a failed dependency install fails this step.
          remote-build: true
          # Deliberately NOT set:
          #   slot-name                      — not supported in Flex Consumption
          #   sku                            — only needed with publish-profile;
          #                                    the action resolves it from RBAC
          #   scm-do-build-during-deployment — Dedicated/Elastic-Premium controls;
          #   enable-oryx-build                Microsoft's Flex guidance is
          #                                    explicitly not to set them

      - name: Verify the deployed package was loaded and the trigger registered
        # The deploy step succeeding with remote-build: true is what proves the
        # dependencies installed. This proves the resulting package is what the
        # host is actually running.
        run: |
          set -euo pipefail
          sleep 30
          bash deploy/trakt-function-app/verify_flex_app.sh indexed trakt trakt-blob-trigger-v2
