name: Deploy OCC frontend (Static Web App)

# Builds and deploys the Operations Control Centre React app
# (frontend/operations-control-ui) to its OWN Azure Static Web App.
#
# This is a SEPARATE Static Web App from the MI dashboard. The existing workflow
# azure-static-web-apps-nice-smoke-067ac7603.yml deploys frontend/mi-agent-ui
# with VITE_AGENT_API_URL and is not touched here — the two apps have different
# API base URLs, different authentication models and independent release
# cadences.
#
# It also touches no backend: trakt-ops-api, trakt-mi-api, the blob trigger and
# the ops-api OIDC deployment identity are all unchanged. Static Web Apps deploy
# with their own deployment token, which is that service's mechanism.
#
# The OCC calls the API CROSS-ORIGIN with an absolute base URL, so two settings
# must agree:
#   * this build's VITE_OPS_API_URL  -> where the browser sends requests
#   * the API's TRAKT_OPS_CORS_ORIGINS -> which origins the API answers
# The smoke test fails loudly if either is wrong.

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/operations-control-ui/**'
      - '.github/workflows/deploy-occ-frontend.yml'
      - 'deploy/trakt-occ-frontend/**'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]
    paths:
      - 'frontend/operations-control-ui/**'
      - '.github/workflows/deploy-occ-frontend.yml'
      - 'deploy/trakt-occ-frontend/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write   # the SWA action posts the preview URL on PRs

concurrency:
  group: deploy-occ-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  # DO NOT name this APP_LOCATION. The Azure/static-web-apps-deploy action reads
  # APP_LOCATION from the ENVIRONMENT, and the environment value overrides the
  # `app_location:` input. A job-level `env: APP_LOCATION` added purely as a YAML
  # convenience therefore silently won over `app_location: …/dist`, and the action
  # uploaded the project directory — serving the unbuilt index.html that
  # references /src/main.tsx. Any name the action does not read is safe; this one
  # is prefixed to make the collision impossible.
  OCC_APP_DIR: frontend/operations-control-ui
  # The deployed trakt-ops-api. This belongs to the FRONTEND BUILD — Vite inlines
  # it into the bundle at build time. It is deliberately NOT an App Service
  # setting: the API never reads it.
  VITE_OPS_API_URL: https://trakt-ops-api-bveyecbeh6ebarfa.westeurope-01.azurewebsites.net

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy the OCC frontend
    outputs:
      frontend_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/operations-control-ui/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.OCC_APP_DIR }}
        run: npm ci

      - name: Type-check and test
        # The same gates the app already defines: `lint` is tsc --noEmit and
        # `test` is the vitest suite, including the administrator-area coverage.
        working-directory: ${{ env.OCC_APP_DIR }}
        run: |
          npm run lint
          npm run test

      - name: Test the smoke test
        # The post-deployment check runs against a local fixture frontend + API to
        # prove it passes a correct deployment and FAILS each likely
        # misconfiguration — missing CORS origin, wildcard CORS, an auth header the
        # API will not accept, a bundle built without the API URL, and a token
        # embedded in the public bundle. A smoke test that cannot fail is
        # decoration.
        run: bash deploy/trakt-occ-frontend/tests/test_smoke_test.sh

      - name: Build
        working-directory: ${{ env.OCC_APP_DIR }}
        run: npm run build

      - name: Verify the build is wired to the API and carries no secret
        # Vite inlines import.meta.env.VITE_OPS_API_URL at build time
        # (src/api/HttpOpsClient.ts). If it were missing, baseUrl falls back to ""
        # and the app would silently call its own origin — a blank dashboard with
        # no error pointing at the cause. Assert it landed, and assert the bundle
        # ships no token.
        working-directory: ${{ env.OCC_APP_DIR }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "no dist/index.html — the build produced nothing"; exit 1; }

          # The artefact that gets uploaded is dist/, so every check below runs
          # against dist/ — not against the project directory. Deploying the
          # project directory by mistake serves the UNBUILT index.html, which
          # still contains <div id="root"> and so looks healthy to a naive probe.
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "FAIL: dist/index.html references /src/main.tsx — this is the"
            echo "      unbuilt source page, not a build output."
            exit 1
          fi
          if ! grep -qE '/assets/[A-Za-z0-9._-]+\.js' dist/index.html; then
            echo "FAIL: dist/index.html references no hashed /assets/*.js bundle."
            exit 1
          fi
          # staticwebapp.config.json must be INSIDE the uploaded root. It lives in
          # public/ so Vite copies it to dist/; at the project root it would be
          # left behind and SPA deep links would 404.
          test -f dist/staticwebapp.config.json || {
            echo "FAIL: dist/staticwebapp.config.json is missing — SPA deep links"
            echo "      such as /admin/config/system would 404. Keep the file in"
            echo "      public/ so the build copies it into dist/."
            exit 1; }
          if grep -rqF "$VITE_OPS_API_URL" dist/assets/*.js; then
            echo "OK: the bundle is built against $VITE_OPS_API_URL"
          else
            echo "FAIL: VITE_OPS_API_URL was not inlined into the bundle."
            echo "      The app would call its own origin, which serves no API."
            exit 1
          fi
          if grep -rqF "X-Operator-Token" dist/assets/*.js; then
            echo "OK: the bundle sends the X-Operator-Token header"
          else
            echo "FAIL: the bundle does not reference X-Operator-Token."
            exit 1
          fi
          # The operator token is typed in at runtime and held in localStorage;
          # it must never be compiled in. The storage KEY name is expected.
          if [ -n "${OPS_SMOKE_OPERATOR_TOKEN:-}" ] \
             && grep -rqF "${OPS_SMOKE_OPERATOR_TOKEN}" dist/; then
            echo "FAIL: an operator token is embedded in the build output. Rotate it."
            exit 1
          fi
          echo "OK: no operator token in the build output"
        env:
          OPS_SMOKE_OPERATOR_TOKEN: ${{ secrets.OPS_SMOKE_OPERATOR_TOKEN }}

      - name: Show exactly what will be uploaded
        # The deploy action zips its content root silently, so nothing in the log
        # used to reveal WHICH directory shipped. That is how a correct build and a
        # wrong upload coexisted invisibly for two deployments. Print the resolved
        # path and a full listing, and fail if anything in the environment could
        # override the app_location input.
        run: |
          set -euo pipefail
          UPLOAD_DIR="${OCC_APP_DIR}/dist"
          echo "app_location input will be : $UPLOAD_DIR"
          echo "absolute path              : $(cd "$UPLOAD_DIR" && pwd)"
          echo
          echo "--- ls -R of the directory to be uploaded ---"
          ls -R "$UPLOAD_DIR"
          echo
          echo "--- the index.html that will be served ---"
          cat "$UPLOAD_DIR/index.html"
          echo
          echo "--- entry point referenced by that index.html ---"
          grep -oE '/assets/[A-Za-z0-9._-]+\.(js|css)' "$UPLOAD_DIR/index.html" | sort -u

          # Guard against the exact defect this replaced: an environment variable
          # the action reads, silently overriding the input.
          for reserved in APP_LOCATION APP_ARTIFACT_LOCATION OUTPUT_LOCATION \
                          APP_BUILD_COMMAND SKIP_APP_BUILD ROUTES_LOCATION; do
            if [ -n "$(printenv "$reserved" || true)" ]; then
              echo "FAIL: the environment sets $reserved=$(printenv "$reserved")."
              echo "      The Static Web Apps action reads that variable and it"
              echo "      overrides the matching input, so the wrong directory"
              echo "      would be uploaded. Rename it (see OCC_APP_DIR)."
              exit 1
            fi
          done
          echo "OK: no reserved Static Web Apps variable is set in the environment"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_OCC }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # With skip_app_build, the action treats app_location as the ALREADY
          # BUILT content root and IGNORES output_location. Pointing it at the
          # project directory uploaded the source tree instead of the build: the
          # served index.html was the unbuilt one referencing /src/main.tsx, so no
          # /assets/* existed and the app never booted. Point it at dist.
          app_location: ${{ env.OCC_APP_DIR }}/dist
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Report the deployed hostname
        # Taken from the deploy action's own output, so it is the real hostname
        # (including a PR preview environment) rather than an assumed one.
        run: |
          set -euo pipefail
          URL="${{ steps.builddeploy.outputs.static_web_app_url }}"
          if [ -z "$URL" ]; then
            echo "The deploy action did not report a hostname."
            exit 1
          fi
          echo "OCC frontend deployed to: $URL"
          echo "API base URL in the bundle: $VITE_OPS_API_URL"
          echo
          echo "The API must allow this exact origin. On trakt-ops-api set:"
          echo "  TRAKT_OPS_CORS_ORIGINS=$URL"
          {
            echo "### OCC frontend deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Frontend | $URL |"
            echo "| API | $VITE_OPS_API_URL |"
            echo ""
            echo "Required on \`trakt-ops-api\`:"
            echo ""
            echo '```'
            echo "TRAKT_OPS_CORS_ORIGINS=$URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert the deployed page is the compiled build
        # Compares what is SERVED against what was BUILT, which is the check that
        # was missing: the build was verified and the upload was not, so a mismatch
        # between them could not be seen. Runs before the wider smoke test so this
        # specific failure is attributed precisely rather than surfacing as four
        # downstream symptoms.
        run: |
          set -euo pipefail
          URL="${{ steps.builddeploy.outputs.static_web_app_url }}"
          BUILT="${OCC_APP_DIR}/dist/index.html"

          # Static Web Apps serves the new content within seconds of the deploy
          # reporting Succeeded, but not always instantly; retry briefly rather
          # than reporting a propagation lag as a wrong upload.
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 20 "$URL/" -o served.html && break
            echo "attempt $attempt: no response yet"; sleep 10
          done
          test -s served.html || { echo "FAIL: the site did not respond"; exit 1; }

          echo "--- served index.html ---"; cat served.html; echo

          if grep -q '/src/main.tsx' served.html; then
            echo "FAIL: the served page references /src/main.tsx, so the UNBUILT"
            echo "      source index.html was uploaded, not dist/. The app cannot"
            echo "      boot. Check the 'Show exactly what will be uploaded' step"
            echo "      and the app_location the deploy step reported using."
            exit 1
          fi

          # The built page names a content-hashed bundle. Requiring the SERVED page
          # to name the same one proves the deployed artefact is this build — not an
          # older successful deploy left in place after a later failed run.
          BUILT_ENTRY="$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' "$BUILT" | head -1)"
          test -n "$BUILT_ENTRY" || { echo "FAIL: the built page names no bundle"; exit 1; }
          if grep -qF "$BUILT_ENTRY" served.html; then
            echo "OK: the served page references this build's bundle ($BUILT_ENTRY)"
          else
            echo "FAIL: the served page does not reference $BUILT_ENTRY."
            echo "      It is serving different content from the build just made —"
            echo "      most likely a previous deployment that was never replaced."
            exit 1
          fi

          CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$URL$BUILT_ENTRY")"
          if [ "${CODE:-000}" = "200" ]; then
            echo "OK: $BUILT_ENTRY is served (HTTP 200)"
          else
            echo "FAIL: $BUILT_ENTRY -> HTTP ${CODE:-000}; the bundle is not reachable"
            exit 1
          fi
          rm -f served.html

      - name: Post-deployment smoke test
        # Frontend 200, assets load, bundle wired and secret-free, API /health,
        # unauthenticated /ops/me refused, authenticated /ops/me and
        # /ops/dashboard, and CORS for this exact origin.
        env:
          OPS_SMOKE_OPERATOR_TOKEN: ${{ secrets.OPS_SMOKE_OPERATOR_TOKEN }}
        run: |
          bash deploy/trakt-occ-frontend/smoke_test.sh \
            "${{ steps.builddeploy.outputs.static_web_app_url }}" \
            "$VITE_OPS_API_URL"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close the preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_OCC }}
          action: close
