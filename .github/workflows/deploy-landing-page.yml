name: Deploy landing page (App Service)

# Builds, verifies and deploys the Trakt marketing site + public synthetic
# demonstration (`landing-page/`) to an Azure App Service (Linux, Node 22).
#
# Prerequisites (created once, outside this repository):
#   • App Service on a Linux plan, runtime stack Node 22 LTS
#   • Repository secret AZURE_LANDING_PAGE_PUBLISH_PROFILE
#       (App Service → Get publish profile)
#   • Repository variables
#       AZURE_LANDING_PAGE_APP_NAME     the App Service name
#       LANDING_PAGE_SITE_URL           the canonical origin — NEXT_PUBLIC_*
#                                       values are inlined at build time, so
#                                       this must be the production origin
#       LANDING_PAGE_ANALYTICS_PROVIDER optional: none | appinsights | firstparty
#
# Manual by default, matching `deploy-mi-api.yml`. Uncomment the push trigger
# once the App Service exists.

on:
  workflow_dispatch: {}
  # push:
  #   branches: [ main ]
  #   paths: [ 'landing-page/**' ]

permissions:
  contents: read

# One production deployment at a time. `cancel-in-progress: false` so a run
# that is already pushing bits is allowed to finish rather than leaving the
# App Service half-updated.
concurrency:
  group: landing-page-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: landing-page

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing-page/package-lock.json

      - name: Install (lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the Trakt engine
        working-directory: .
        run: pip install --quiet -r requirements.txt

      - name: Install pytest
        working-directory: .
        run: python -m pip install pytest

      # The dataset beneath the pack. The generator is seeded and pure stdlib,
      # so a drift here means the committed extracts were edited by hand.
      - name: Synthetic source extracts are reproducible
        working-directory: .
        run: python synthetic_demo/build_multibook_input.py --check

      # Proves the committed pack is exactly what the deterministic engine
      # produces from the committed synthetic dataset, and that the source
      # identity guards fail closed on every axis. On a mismatch the generator
      # prints the leaf values that differ and the interpreter/pandas versions,
      # so the log is diagnosable without reproducing the environment first.
      - name: Demo-pack reproducibility and source identity
        working-directory: .
        run: python -m pytest landing-page/tests/demo_pack_reproducible_test.py -q

      # A pack that differs from the committed one must never be deployed:
      # the site would publish figures nobody reviewed.
      - name: Refuse a stale demo pack
        run: npm run demo-pack:check

      # Production configuration rules, exercised with placeholder values.
      # No real secret is present in CI.
      - name: Production configuration validation
        run: npm run validate-config

      - name: Production build
        env:
          APPLICATION_ENV: production
          NEXT_PUBLIC_SITE_URL: https://trakt-landing-page-bcgsapgjfmgnedaa.westeurope-01.azurewebsites.net
          NEXT_PUBLIC_DEMO_NAME: Synthetic Demo Lender
          NEXT_PUBLIC_ANALYTICS_PROVIDER: ${{ vars.LANDING_PAGE_ANALYTICS_PROVIDER || 'none' }}
        run: npm run build

      - name: Secret and prohibited-reference scan
        run: npm run scan

      - name: Upload the verified build
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-build
          path: |
            landing-page/.next/standalone
            landing-page/.next/static
            landing-page/public
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: landing-page-build
          path: landing-page-build

      # `output: "standalone"` produces a self-contained server; assemble the
      # tree App Service will run.
      - name: Assemble the deployable bundle
        working-directory: .
        run: |
          mkdir -p deploy
          cp -r landing-page-build/.next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r landing-page-build/.next/static deploy/.next/static
          cp -r landing-page-build/public deploy/public
          # App Service runs `npm start`; point it at the standalone server.
          node -e "require('fs').writeFileSync('deploy/package.json', JSON.stringify({name:'trakt-landing-page',private:true,scripts:{start:'node server.js'}},null,2))"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_LANDING_PAGE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_LANDING_PAGE_PUBLISH_PROFILE }}
          package: deploy

      - name: Smoke-check liveness
        working-directory: .
        run: |
          base="${{ vars.LANDING_PAGE_SITE_URL }}"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/health" || true)
            if [ "$code" = "200" ]; then echo "health: ok"; exit 0; fi
            echo "attempt $i: health returned $code — waiting"; sleep 15
          done
          echo "::error::/api/health did not return 200"; exit 1

      # Readiness is the configuration gate: it fails when lead delivery, the
      # session secret, the canonical origin or the rate-limit store are wrong,
      # which liveness deliberately tolerates.
      - name: Smoke-check readiness
        working-directory: .
        run: |
          base="${{ vars.LANDING_PAGE_SITE_URL }}"
          body=$(curl -s "$base/api/ready" || true)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/ready" || true)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::/api/ready returned $code — the deployment is not correctly configured"
            exit 1
          fi

      # The deployed HTML must carry the portfolio identity this build was
      # pinned to. Catches a deployment that somehow served a different pack.
      - name: Verify the served portfolio identity
        working-directory: .
        run: |
          base="${{ vars.LANDING_PAGE_SITE_URL }}"
          pack=./landing-page/data/demo-pack.json
          expected_marker=$(node -p "const p=require('$pack').source; [p.clientId,p.portfolioId,p.reportingDate].join('/')")
          expected_balance=$(node -p "require('$pack').portfolio.totalBalanceDisplay")

          # --compressed, because the App Service negotiates gzip and a binary
          # body makes every grep miss — which would report a stale deployment
          # when the real problem was the request.
          html=$(curl -sS --compressed "$base/")

          # The marker is published deliberately as <meta name="trakt:pack">
          # (see landing-page/src/app/layout.tsx). It is asserted rather than
          # the raw portfolio id, which only ever appeared in the served HTML as
          # an unrendered prop inside Next's RSC payload.
          served_marker=$(printf '%s' "$html" \
            | grep -o 'name="trakt:pack" content="[^"]*"' \
            | head -1 | sed 's/.*content="//; s/"$//')

          if [ -z "$served_marker" ]; then
            echo "::error::the served page carries no trakt:pack marker."
            echo "Either the deployment did not take (App Service is still serving"
            echo "an older bundle), or the marker was removed from layout.tsx."
            echo "Served <title>: $(printf '%s' "$html" | grep -o '<title>[^<]*</title>' | head -1)"
            exit 1
          fi

          if [ "$served_marker" != "$expected_marker" ]; then
            echo "::error::the served page was built from a different demo pack."
            echo "  expected: $expected_marker"
            echo "  served:   $served_marker"
            echo "This is a stale or mismatched deployment, not a build problem —"
            echo "the committed pack passed reproducibility in the verify job."
            exit 1
          fi

          if ! printf '%s' "$html" | grep -qF -- "$expected_balance"; then
            echo "::error::the served page does not show the pinned total '$expected_balance'"
            exit 1
          fi

          echo "served pack confirmed: $expected_marker ($expected_balance)"
