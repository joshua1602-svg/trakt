name: Certify trakt-mi-api (live)

# Certifies the ALREADY-DEPLOYED MI Query Agent against the PUBLIC production
# route a real client uses — https://app.traktinfra.io/api — which is what makes
# this a certification of the system rather than of the code: it exercises
# public routing, the auth boundary, request and response serialization,
# portfolio selection and the deployed D4 path, none of which an in-process run
# can see.
#
# THIS WORKFLOW DEPLOYS NOTHING. It is read-only against production. The
# deployed application commit is whatever `deploy-mi-api.yml` last shipped;
# running this must never be a reason to redeploy.
#
# The token is read from a SECRET into the environment, never onto a command
# line — an argv value lands in process listings and run logs, and a bearer
# token that outlives its run is the one credential leak this whole file could
# cause. `MI_BEARER` is the variable `migration_phase0/replay_probe.py` already
# uses, so the two live clients share one convention.
#
# Required repository secret:  MI_BEARER            the dashboard / MI token
# Optional repository variable: TRAKT_PORTFOLIO_ID  default portfolioId
#
# Two verdicts are reported, and they answer different questions. CORE is the
# release smoke gate. BROAD is the scored sweep across the capability surface —
# semantic equivalence, filter algebra, grouping reconciliation, output
# completeness and a once-only holdout — and it is scored on RELATIONS, never on
# how many questions came back with ok: true. A refusal is not a failure there:
# a book that does not carry a field must be free to say so.
#
# Exit codes from the client are the verdict: 0 certified, 1 not certified,
# 2 not executable (never reached and authorised — no question was asked).
# A 2 fails the job deliberately: "we could not run it" must not read as a pass.
#
# A THIRD SUITE, `geography`, is the release acceptance gate for the
# ERE-client / ERM-asset configuration ownership model. It is deliberately ten
# questions rather than the broad sweep's ~150: it asks whether the deployed
# service resolves the geography basis from the configuration we shipped, and
# nothing else. It reports TIME_X_DIMENSION_READY.
#
# THIS WORKFLOW IS ALSO CALLABLE (`workflow_call`), which is how
# `hardening-smoke.yml` runs the live acceptance after its deterministic job
# passes. It is called rather than copied so there stays ONE live transport,
# ONE MI_BEARER convention, ONE reachability/auth classifier and ONE
# deployed-SHA provenance check in this repository.

on:
  workflow_call:
    inputs:
      base_url:
        type: string
        default: https://app.traktinfra.io/api
        required: false
      path:
        type: string
        default: /mi/query
        required: false
      portfolio_id:
        type: string
        default: ERE/2026-06-30
        required: false
      ref:
        type: string
        default: ''
        required: false
      expect_commit:
        type: string
        default: ''
        required: false
      suite:
        type: string
        default: geography
        required: false
      banks:
        type: string
        default: ''
        required: false
    secrets:
      MI_BEARER:
        required: false
    outputs:
      ready:
        description: TIME_X_DIMENSION_READY, for the geography suite.
        value: ${{ jobs.certify.outputs.ready }}
  workflow_dispatch:
    inputs:
      base_url:
        description: Public API base URL
        default: https://app.traktinfra.io/api
        required: true
      path:
        description: MI endpoint path appended to the base URL
        default: /mi/query
        required: true
      portfolio_id:
        description: portfolioId as {client_id}/{run_id}
        default: ERE/2026-06-30
        required: true
      ref:
        description: Repo ref to take the certification harness from
        default: main
        required: true
      expect_commit:
        description: >-
          The Git SHA this deployment is supposed to be serving. Leave blank to
          use the SHA of the checked-out ref. The run FAILS if the deployed
          commit cannot be established or differs — an application version
          string ("1.0.0") is identical across every deploy and cannot tell one
          build from another, so it is not accepted as provenance.
        default: ''
        required: false
      suite:
        description: >-
          core        = the release smoke gate only (a few dozen requests).
          core+broad  = the smoke gate plus the BROAD SCORED sweep from
          broad_cases.json — ~150 distinct production requests scored on
          relations and identities, not on how many came back ok.
          geography   = the GEOGRAPHY / CONFIG-OWNERSHIP release acceptance
          only — ten questions scored on configuration provenance, explicit
          basis semantics and numerical identity. Reports
          TIME_X_DIMENSION_READY.
        type: choice
        options: [core+broad, core, geography]
        default: core+broad
        required: true
      banks:
        description: >-
          Optional space-separated paths to frozen question banks, relative to
          the checkout. Only the QUESTIONS are read from them.
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: certify-trakt-mi-api
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.acceptance.outputs.ready }}
    # 30 minutes covers the core suite comfortably. The broad sweep adds ~150
    # distinct live requests; the client prints a timed line per request to the
    # job log as it goes, so if this limit is ever hit the log says at which
    # request and at what latency — which is the measurement that would justify
    # raising it, rather than raising it on a guess.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Called from another workflow, an empty ref means "the commit that
          # called us" — the caller has already decided which tree is being
          # released, and taking `main` instead would certify a different one.
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Refuse to run without a token
        env:
          MI_BEARER: ${{ secrets.MI_BEARER }}
        run: |
          set -euo pipefail
          # Checked here rather than left to the client, so the failure names
          # the missing SECRET instead of surfacing as a 401 that looks like a
          # production auth defect.
          if [ -z "${MI_BEARER:-}" ]; then
            echo "::error::repository secret MI_BEARER is not set — the live"
            echo "::error::certification cannot authenticate. Set it in"
            echo "::error::Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "MI_BEARER is present (${#MI_BEARER} characters)."

      - name: Geography release acceptance
        id: acceptance
        if: ${{ inputs.suite == 'geography' }}
        env:
          MI_BEARER: ${{ secrets.MI_BEARER }}
        run: |
          set -euo pipefail
          EXPECT="${{ inputs.expect_commit }}"
          if [ -z "${EXPECT}" ]; then
            EXPECT="$(git rev-parse HEAD)"
          fi
          echo "expecting the deployed service to be serving ${EXPECT}"

          # `set -e` would abort on the client's non-zero verdict before the
          # summary is written, and a gate that fails without saying why is a
          # gate nobody can act on. The exit code is captured and re-raised
          # after the report exists.
          set +e
          python -m due_diligence.evidence.mi_api_certification.certify_mi_api \
            --base-url "${{ inputs.base_url }}" \
            --path "${{ inputs.path }}" \
            --portfolio-id "${{ inputs.portfolio_id }}" \
            --expect-commit "${EXPECT}" \
            --geography-acceptance \
            --report certification-report.txt \
            --acceptance-json geography-acceptance.json \
            --summary-markdown geography-acceptance.md
          status=$?
          set -e

          if [ -f geography-acceptance.md ]; then
            cat geography-acceptance.md >> "$GITHUB_STEP_SUMMARY"
          fi
          READY="NO"
          if [ -f geography-acceptance.json ]; then
            READY="$(python -c "import json;print(json.load(open('geography-acceptance.json'))['TIME_X_DIMENSION_READY'])")"
          fi
          echo "ready=${READY}" >> "$GITHUB_OUTPUT"
          echo "TIME_X_DIMENSION_READY = ${READY}"
          exit $status

      - name: Certify the deployed service
        if: ${{ inputs.suite != 'geography' }}
        env:
          MI_BEARER: ${{ secrets.MI_BEARER }}
        run: |
          set -euo pipefail
          BANKS=""
          for bank in ${{ inputs.banks }}; do
            if [ ! -f "$bank" ]; then
              echo "::error::bank file not found in the checkout: $bank"
              exit 1
            fi
            BANKS="$BANKS --bank $bank"
          done

          SUITE=""
          if [ "${{ inputs.suite }}" = "core" ]; then
            SUITE="--no-broad"
          fi

          EXPECT="${{ inputs.expect_commit }}"
          if [ -z "${EXPECT}" ]; then
            EXPECT="$(git rev-parse HEAD)"
          fi
          echo "expecting the deployed service to be serving ${EXPECT}"

          python -m due_diligence.evidence.mi_api_certification.certify_mi_api \
            --base-url "${{ inputs.base_url }}" \
            --path "${{ inputs.path }}" \
            --portfolio-id "${{ inputs.portfolio_id || vars.TRAKT_PORTFOLIO_ID }}" \
            --report certification-report.txt \
            --expect-commit "${EXPECT}" \
            $SUITE $BANKS

      - name: Keep the report whatever the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mi-api-certification-report
          path: |
            certification-report.txt
            geography-acceptance.json
            geography-acceptance.md
          if-no-files-found: warn
