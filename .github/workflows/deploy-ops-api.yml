name: Deploy trakt-ops-api (App Service)

# Builds, tests and deploys the standalone Operations Control Centre API
# (operations_control.api.app:app) to the Azure App Service `trakt-ops-api`.
#
# This workflow touches ONE App Service: trakt-ops-api. It never deploys,
# configures or restarts trakt-mi-api — that service keeps serving
# mi_agent_api.app:app via the repo-root startup.sh, and the OCC application is
# not mounted into it.
#
# Authentication is OIDC (federated credential) via azure/login@v2 — no publish
# profile, no long-lived secret in the repo. See deploy/trakt-ops-api/README.md
# for the one-time federated-credential setup.

on:
  push:
    branches: [ main ]
    paths:
      - 'operations_control/**'
      - 'engine/**'
      - 'apps/**'
      - 'trakt_core/**'
      - 'config/**'
      - 'requirements.txt'
      - 'deploy/trakt-ops-api/**'
      - '.github/workflows/deploy-ops-api.yml'
  workflow_dispatch: {}

# Least privilege: id-token to mint the OIDC assertion, contents to check out.
permissions:
  id-token: write
  contents: read

concurrency:
  # Never let two deploys of this service overlap — the OCC reconciles
  # interrupted workflows on startup, so overlapping restarts are avoidable noise.
  group: deploy-ops-api
  cancel-in-progress: false

env:
  APP_NAME: trakt-ops-api
  PYTHON_VERSION: '3.11'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run targeted OCC tests
        # The Operations Control Centre suite: workflow transitions and restart
        # recovery, tenancy isolation, rule scoping, publication gating, the
        # effective-configuration contract, and the administrator configuration
        # API this service exposes.
        #
        # Two real-component Annex 2 golden tests are deselected BY NAME. They
        # assert the XML builder's output validates against the vendored draft
        # ESMA XSD, and they are already failing on main (verified against a
        # clean tree) — the generated file does not pass the format check. They
        # are deselected here so this deployment gate reflects THIS service's
        # health rather than a pre-existing product failure. They are not
        # skipped in the suite itself, and they must be fixed separately.
        run: |
          python -m pytest tests/operations_control/ -q \
            --deselect "tests/operations_control/test_annex2_delivery.py::TestRealComponentsMiniGolden::test_normaliser_and_builder_pass_xsd" \
            --deselect "tests/operations_control/test_annex2_delivery.py::TestRealComponentsMiniGolden::test_builder_interventions_are_captured"

      - name: Test the deployment scripts
        # All three suites run with stubbed `az`/`curl` and need no Azure access.
        #
        #  * host discovery — the legacy form (app.scm.azurewebsites.net), the
        #    secure-unique form (app-hash.scm.westeurope-01.azurewebsites.net),
        #    the rejection cases that protect the URL a bearer token is sent to,
        #    and a guard that no script assembles a hostname from the app name
        #    (that defect produced "Could not resolve host" / HTTP 000).
        #  * Kudu status — the DeployStatus enum pinned to the codes observed in a
        #    real run (0=Pending, 1=Building, 2=Deploying, 3=Failed, 4=Success).
        #    An off-by-one here reported a SUCCESSFUL deployment as a failure.
        #  * replay — drives the real deploy script through that run's status
        #    sequence end to end, plus a genuine failure and a never-completing
        #    build, so the classifier AND its wiring are both covered.
        #  * health probe — the gate's retry loop under the gate's own shell
        #    options. Its inline predecessor aborted on the FIRST curl timeout
        #    because `set -e` propagates a failing command substitution, so the
        #    eight retries written above it never ran and a successful
        #    deployment failed with a bare "exit code 28" and no diagnostics.
        run: |
          bash deploy/trakt-ops-api/tests/test_host_discovery.sh
          bash deploy/trakt-ops-api/tests/test_kudu_status.sh
          bash deploy/trakt-ops-api/tests/test_deploy_async_replay.sh
          bash deploy/trakt-ops-api/tests/test_oryx_manifest.sh
          bash deploy/trakt-ops-api/tests/test_health_probe.sh
          bash deploy/trakt-ops-api/tests/test_container_log.sh

      - name: Build deployment package
        # The runtime closure of operations_control.api.app, established by
        # import trace rather than assumption:
        #   operations_control/  the API, engine, stores, config packages
        #   engine/              orchestrator_agent (imported) + the gate_4b /
        #                        gate_5 Annex 2 scripts, executed as SUBPROCESSES
        #                        with cwd = the package root
        #   apps/                blob_trigger_app storage / layout / persistence
        #   trakt_core/          governed context, errors, tenancy, policy
        #   mi_agent/            now a HARD dependency: api/app.py imports
        #                        concentration_routes at module level, which
        #                        reaches mi_agent.concentration_tests for the
        #                        governed metric registry. Importing any
        #                        mi_agent submodule executes mi_agent/__init__,
        #                        which loads the MI query executor — hence
        #                        analytics_lib below. Still also reached through
        #                        the guarded onboarding imports.
        #   analytics_lib/       pulled in by mi_agent/__init__ (numeric/date
        #                        coercion). Absent, the app cannot import at all
        #                        and every worker dies at start.
        #   config/              every governed YAML the packages are seeded from,
        #                        plus the Annex 2 XSD under config/system/
        #   the repo-root Annex 2 mapping workbook, passed to the XML builder as
        #                        --mapping-workbook
        #   requirements.txt     Oryx build input
        #   deploy/trakt-ops-api/startup-ops.sh  the startup command
        #
        # The React frontend is deliberately EXCLUDED: nothing in the API's
        # import graph reaches frontend/, and the built UI is deployed separately.
        run: |
          set -euo pipefail
          zip -r -q ops-api.zip \
            operations_control/ \
            engine/ \
            apps/ \
            trakt_core/ \
            mi_agent/ \
            analytics_lib/ \
            config/ \
            requirements.txt \
            deploy/trakt-ops-api/startup-ops.sh \
            "DRAFT1auth.099.001.04_non-ABCP Underlying Exposure Report_Version_1.3.1.xlsx" \
            -x "*.pyc" "*/__pycache__/*" "*/tests/*" "*/test_*"
          ls -lh ops-api.zip

      - name: Verify the package is complete and frontend-free
        # Unpack the ACTUAL artefact into a clean directory and import the app the
        # way gunicorn will, then assert the runtime files it resolves by path and
        # the scripts it runs as subprocesses are present. An incomplete package
        # fails here rather than as a dead worker in production.
        # See deploy/trakt-ops-api/verify_package.py for what is checked and why.
        run: |
          set -euo pipefail
          unzip -l ops-api.zip | grep -q 'deploy/trakt-ops-api/startup-ops.sh' || {
            echo "DEPLOY PACKAGE INCOMPLETE: missing the startup script"; exit 1; }
          unzip -l ops-api.zip | grep -q 'config/system/DRAFT1auth.099.001.04_1.3.0.xsd' || {
            echo "DEPLOY PACKAGE INCOMPLETE: missing the Annex 2 schema"; exit 1; }
          rm -rf _pkgcheck && mkdir _pkgcheck
          unzip -q ops-api.zip -d _pkgcheck
          ( cd _pkgcheck && python "$GITHUB_WORKSPACE/deploy/trakt-ops-api/verify_package.py" )

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_OPS_API_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_OPS_API_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_OPS_API_SUBSCRIPTION_ID }}

      - name: Discover the App Service hostnames
        # Hostnames are NEVER constructed from the app name. With secure unique
        # default hostnames a site is reachable only at
        #   <app>-<hash>.<region>.azurewebsites.net           (public)
        #   <app>-<hash>.scm.<region>.azurewebsites.net       (SCM / Kudu)
        # and the legacy <app>.scm.azurewebsites.net guess does not resolve —
        # which is exactly the "curl: (6) Could not resolve host" / HTTP 000
        # submission failure seen previously. Both are read from the site
        # resource and exported for the later steps.
        run: |
          set -euo pipefail
          . deploy/trakt-ops-api/azure_hosts.sh
          SCM_HOST="$(discover_scm_host "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" "$APP_NAME")"
          APP_HOST="$(discover_app_host "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" "$APP_NAME")"
          echo "SCM (Kudu) hostname : $SCM_HOST"
          echo "public hostname     : $APP_HOST"
          echo "all enabled hostnames on the site:"
          az webapp show -g "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" -n "$APP_NAME" \
            --query "enabledHostNames" -o tsv | sed 's/^/  /'
          echo "OPS_SCM_HOST=$SCM_HOST" >> "$GITHUB_ENV"
          echo "OPS_APP_HOST=$APP_HOST" >> "$GITHUB_ENV"

      - name: Pre-flight — artefact listing and live App Service configuration
        # Runs AFTER login and BEFORE upload, so a failure can be attributed to
        # packaging or configuration without re-running anything. Prints the full
        # `unzip -l`, proves requirements.txt is at the ARCHIVE ROOT (not nested),
        # reports .deployment presence, and queries the live values of
        # SCM_DO_BUILD_DURING_DEPLOYMENT / ENABLE_ORYX_BUILD /
        # WEBSITE_RUN_FROM_PACKAGE / linuxFxVersion / appCommandLine.
        # Fails fast only on combinations known to break a build-on-deploy.
        run: |
          bash deploy/trakt-ops-api/preflight_checks.sh \
            ops-api.zip \
            "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" \
            "$APP_NAME"

      - name: Settle after the ARM calls, before deploying
        # A HISTORICAL incident, not a description of current deployments. On one
        # occasion Azure stopped a 1052-second Oryx build and said exactly why:
        #
        #   status=3 (failed) "Deployment has been stopped due to SCM container
        #   restart. The restart can happen due to a management operation on site.
        #   Do not perform a management operation and a deployment operation in
        #   quick succession. Adding a small delay can help avoid any conflicts."
        #
        # Oryx publishes into /home/site/wwwroot (PreDeployment:
        # context.OutputPath /home/site/wwwroot, CleanOutputPath False), so a build
        # stopped part-way leaves the application files in place with no
        # oryx-manifest.toml — and the worker then dies with
        # "ModuleNotFoundError: No module named 'uvicorn'". Restarting only replays
        # that broken startup; only a completed build fixes it.
        #
        # Note this is about a build that did NOT complete. A build that reports
        # complete=true / status=4 (Success) has completed, whatever layout it
        # published — do not read a later verification failure as evidence of an
        # interrupted build.
        #
        # The steps above only READ from ARM (webapp show / config show /
        # appsettings list), but they are still control-plane calls against this
        # site immediately before a deployment, which is precisely the pattern the
        # message warns about. Wait before submitting the zip.
        env:
          OPS_SETTLE_SECONDS: '60'
        run: |
          set -euo pipefail
          echo "Waiting ${OPS_SETTLE_SECONDS}s so the SCM container is not restarted"
          echo "by a management operation while the Oryx build is running."
          sleep "${OPS_SETTLE_SECONDS}"
          echo "Settled. Submitting the deployment."

      - name: Deploy to trakt-ops-api (asynchronous, polled)
        # Scoped by name to this service only. No other App Service is deployed,
        # configured or restarted by this workflow.
        #
        # ASYNCHRONOUS ON PURPOSE. A synchronous `az webapp deploy` holds one HTTP
        # request open to the SCM front end for the whole Oryx build. App Service's
        # front end enforces a fixed ~230-second idle timeout that cannot be raised,
        # so a build that outlives it returns 502/504 to the caller even when the
        # build is still running or ultimately succeeds — which is exactly the
        # "HTTP_504 GatewayTimeout after ~4 minutes" signature. Submitting with
        # isAsync=true returns 202 in seconds; the script then polls
        # /api/deployments/latest and streams the log until the record completes,
        # and classifies the terminal status via
        # deploy/trakt-ops-api/kudu_status.sh — Kudu's DeployStatus is
        # Pending=0, Building=1, Deploying=2, Failed=3, Success=4.
        env:
          POLL_SECONDS: '15'
        run: |
          bash deploy/trakt-ops-api/deploy_async.sh \
            ops-api.zip \
            "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" \
            "$APP_NAME" \
            1800

      - name: Inspect the Oryx build output (evidence, not the gate)
        # NOT the deployment gate — the runtime check below is. This step makes a
        # startup failure attributable, and asserts only what the manifest itself
        # declares.
        #
        # The previous version of this step required `antenv/` or
        # `__oryx_packages__/` to be readable over Kudu VFS and failed the job
        # when neither was. That assumes the uncompressed layout. This service
        # builds with --compress-destination-dir:
        #
        #     Copied the compressed output to '/home/site/wwwroot'
        #     Direct compression with zstd done
        #     Manifest file created
        #
        # In that mode wwwroot holds one compressed artefact plus
        # oryx-manifest.toml and the runtime extracts it at startup, so no
        # expanded directory is published. The assertion therefore reported a
        # successful build — 91 packages installed including pyyaml==6.0.3,
        # complete=true, status=4 (Success) — as a hard failure.
        #
        # Read-only VFS reads against Kudu. See
        # deploy/trakt-ops-api/verify_oryx_output.sh.
        run: bash deploy/trakt-ops-api/verify_oryx_output.sh "$OPS_SCM_HOST"

      - name: Verify the deployed service answers (THE DEPLOYMENT GATE)
        # This is the definitive gate. Build artefacts on the site are evidence;
        # this is the thing that actually matters — whether the deployed service
        # serves. It supersedes any filesystem-layout assertion: if the app answers
        # on /health, its dependencies imported, whatever layout Oryx published.
        #
        # /health needs no token, so it is a clean post-deploy probe. It also
        # reports auth_configured, which catches the most likely misconfiguration
        # (TRAKT_OPS_OPERATORS unset leaves every route 503).
        #
        # Uses the DISCOVERED public hostname from the earlier step. Building
        # <app>.azurewebsites.net here would fail DNS on a site with secure unique
        # default hostnames and be misreported as "the service did not start".
        #
        # The job must not pass unless this returns exactly 200: assert the status
        # code explicitly rather than inferring success from a non-empty body.
        run: |
          set -euo pipefail
          echo "probing https://${OPS_APP_HOST}/health"
          . deploy/trakt-ops-api/probe_health.sh
          CODE="$(probe_health "$OPS_APP_HOST")"

          if [ "$CODE" != "200" ]; then
            echo "FAIL: /health returned HTTP $CODE, not 200. The service is not"
            echo "      serving after this deployment."
            # `if`, not `[ … ] && …`: an && list that evaluates false is itself a
            # failing command, so under `set -e` an empty body file would end the
            # step here — losing the container log printed below, which is the
            # whole reason this block exists.
            if [ -s health.json ]; then sed 's/^/      /' health.json; fi
            echo
            echo "--- application startup log (most recent container output) ---"
            # Read the startup log HERE, next to the failure, rather than leaving
            # it to the diagnostics step: the import error that explains a
            # non-serving worker is in this stream.
            #
            # via container_log.sh, because /api/logs/docker returns an INDEX of
            # log files rather than their contents — tailing it printed
            # filenames and byte counts where the error was supposed to be.
            TOKEN="$(az account get-access-token --resource https://management.azure.com/ \
                      --query accessToken -o tsv 2>/dev/null || true)"
            . deploy/trakt-ops-api/container_log.sh
            fetch_container_log "$OPS_SCM_HOST" "${TOKEN:-}" container.log 200 \
              | sed 's/^/      /'
            echo
            echo "      Full diagnostics follow in the next step."
            exit 1
          fi

          cat health.json; echo
          grep -q '"service":"operations-control"' health.json || {
            echo "FAIL: /health did not identify as operations-control."; exit 1; }
          grep -q '"auth_configured":true' health.json \
            || echo "WARNING: TRAKT_OPS_OPERATORS is not set — every route will answer 503"
          echo "OK: /health returned 200 and the service identifies correctly"
          rm -f health.json

      - name: Verify an authenticated route answers
        # Optional by design: it needs a real operator token, so it only runs when
        # one is configured as a secret. /ops/me is the lightest authenticated
        # route — it reads the principal and touches no configuration state.
        #
        # This proves the auth path works end to end, which /health cannot: /health
        # only reports whether TRAKT_OPS_OPERATORS is set, not whether a token in it
        # is accepted.
        #
        # The token is passed via env and never echoed; only status codes are
        # printed.
        env:
          OPS_SMOKE_TOKEN: ${{ secrets.OPS_SMOKE_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_SMOKE_TOKEN:-}" ]; then
            echo "SKIPPED: no OPS_SMOKE_OPERATOR_TOKEN secret is configured, so the"
            echo "         authenticated probe cannot run. /health already gated this"
            echo "         deployment. Add the secret to enable this check."
            exit 0
          fi
          # `|| true` is load-bearing, for the same reason as in the /health
          # probe: a standalone assignment adopts its command substitution's
          # exit status, so without it a curl timeout would kill this step
          # before the case below could explain the status it got.
          CODE="$(curl -sS -o me.json -w '%{http_code}' --max-time 60 \
                   -H "X-Operator-Token: ${OPS_SMOKE_TOKEN}" \
                   "https://${OPS_APP_HOST}/ops/me" 2>/dev/null || true)"
          echo "GET /ops/me -> HTTP ${CODE:-000}"
          case "${CODE:-000}" in
            # One line on purpose: an un-indented multi-line script inside a YAML
            # block scalar terminates the scalar and breaks the workflow file.
            # Prints the role only — nothing token-shaped is echoed.
            200) python3 -c "import json; d=json.load(open('me.json')); p=d.get('principal',{}); print('  authenticated as role:', p.get('role'), '| admin:', p.get('is_admin')); assert d.get('ok') is True, 'ops/me did not return ok'"
                 echo "OK: the authenticated route answers"
                 ;;
            401|403) echo "FAIL: the token in OPS_SMOKE_OPERATOR_TOKEN was rejected"
                     echo "      (HTTP $CODE). It is not present in TRAKT_OPS_OPERATORS"
                     echo "      on the App Service, or its role is insufficient."
                     exit 1 ;;
            503) echo "FAIL: HTTP 503 — TRAKT_OPS_OPERATORS is not set on the App"
                 echo "      Service, so every authenticated route refuses."
                 exit 1 ;;
            000) echo "FAIL: no response within 60s. /health answered moments ago,"
                 echo "      so this is a slow or hanging authenticated path, not a"
                 echo "      service that failed to start."
                 exit 1 ;;
            *) echo "FAIL: unexpected status $CODE from /ops/me"
               if [ -s me.json ]; then sed 's/^/      /' me.json; fi
               exit 1 ;;
          esac
          rm -f me.json

      # ------------------------------------------------------------------ #
      # Self-diagnosis. Runs on ANY failure above, including a deploy that
      # timed out, so the job never ends with only an opaque HTTP status.
      # ------------------------------------------------------------------ #
      - name: Collect deployment diagnostics
        if: failure()
        # Prints: az webapp log deployment show / list, the latest Kudu deployment
        # record (the decisive "did it fail, or did my call just time out?"), the
        # Kudu deployment log INCLUDING the nested details that carry the Oryx build
        # output, the Oryx build log from the site filesystem, the container/runtime
        # docker log, the downloaded runtime log bundle, the current site config and
        # deployment-relevant app settings, and a live /health probe. Best-effort
        # per source and never masks the failure it is reporting on.
        continue-on-error: true
        run: |
          bash deploy/trakt-ops-api/collect_diagnostics.sh \
            "${{ secrets.AZURE_OPS_API_RESOURCE_GROUP }}" \
            "$APP_NAME"

      - name: Upload diagnostics artefact
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ops-api-deployment-diagnostics
          path: |
            _diagnostics/
          retention-days: 14
          if-no-files-found: warn
