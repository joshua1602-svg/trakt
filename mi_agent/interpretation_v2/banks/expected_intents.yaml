  # ---- pipeline stage movement ------------------------------------------ #
  #
  # `temporal` is deliberately UNSTATED for all nine. The window a stage
  # movement spans is owned by the pipeline_stage_movement capability, not
  # named by the question: "How many cases moved from KFI to Application?" is
  # complete as it stands. These entries originally expected `relative_pair`,
  # under a compiler rule that demanded the intent name two periods — a rule
  # the first live run showed to be wrong, because it asked the interpreter to
  # specify a methodology detail it is deliberately never shown. The rule was
  # corrected; these expectations follow it. Scoring a period the question does
  # not determine would be marking the interpreter against the fixture's
  # assumption rather than against the question.
  SM01:
    derivation: 'Source subtype: transition. Cases counted moving between two
      named stages, period on period.'
    expected:
      capability: pipeline_stage_movement
      operation: transition
      population: [pipeline, all, any]
      comparison: none

  SM02:
    derivation: 'Source subtype: transition, measured in value rather than
      count.'
    expected:
      capability: pipeline_stage_movement
      operation: transition
      population: [pipeline, all, any]
      comparison: none

  SM03:
    derivation: 'Source subtype: transition.'
    expected:
      capability: pipeline_stage_movement
      operation: transition
      population: [pipeline, all, any]
      comparison: none

  SM04:
    derivation: 'Source subtype: transition, measured in value.'
    expected:
      capability: pipeline_stage_movement
      operation: transition
      population: [pipeline, all, any]
      comparison: none

  SM05:
    derivation: 'Source subtype: new_arrival — cases entering a stage from
      outside the pipeline.'
    expected:
      capability: pipeline_stage_movement
      operation: arrivals
      population: [pipeline, all, any]
      comparison: none

  SM06:
    derivation: 'Source subtype: stayer — cases present at a stage in both
      periods.'
    expected:
      capability: pipeline_stage_movement
      operation: stayers
      population: [pipeline, all, any]
      comparison: none

  SM07:
    derivation: 'Source subtype: stayer_amount_change — the VALUE change on the
      stayers, not their count.'
    expected:
      capability: pipeline_stage_movement
      operation: stayers
      population: [pipeline, all, any]
      comparison: none

  SM08:
    derivation: 'Source subtype: departure — where leavers went, so the answer
      is broken down by destination.'
    expected:
      capability: pipeline_stage_movement
      operation: departures
      population: [pipeline, all, any]
      comparison: none

  SM09:
    derivation: 'Source subtype: reconciliation — opening, arrivals, departures
      and closing for one stage.'
    expected:
      capability: pipeline_stage_movement
      operation: reconciliation
      population: [pipeline, all, any]
      comparison: none

  # ---- analytical-intent NL bank ---------------------------------------- #
  NL1:
    derivation: >-
      Independent truth Q1.1/Q1.2 classify this as MIX_PROFILE + MOVEMENT_TREND
      with a CHANGE operation over two snapshots.
    expected:
      comparison: none
    human_review: true
    note: >-
      expected_semantics.yaml records an unresolved TENSION on the population:
      "our new lending" maps to the governed NEW window (months_on_book <= 1)
      under one reading and to RECENT (<= 3) under another, and the two
      variations of this question in that file are given DIFFERENT populations
      for that reason. This sprint has no authority to settle it, so population
      and operation are left unstated.

  NL2:
    derivation: >-
      A threshold reached at a future date under the current trajectory — the
      same forward-milestone shape the frozen BANK75 gives Q23/Q24.
    expected:
      capability: forecast
      operation: forecast_milestone
      temporal: forward_looking
      comparison: none

  NL3:
    derivation: >-
      Independent truth Q3.1: families PIPELINE + FORECAST_PROJECTION,
      operations STOCK + EXPECTED_COMPLETION, population pipeline_stage ==
      OFFER.
    expected:
      population: [pipeline, all, any]
    human_review: true
    note: >-
      The question asks for a stock AND a projection AND a timing, spanning two
      capabilities. Whether that is one intent with several outputs or two
      intents is a target-architecture ruling this sprint deliberately does not
      make; capability, operation and output_structure are left unstated and the
      observed reading is reported.

  NL4:
    derivation: >-
      Independent truth Q4.2: family PIPELINE, operations MOVEMENT + RUN_RATE,
      population "completions per unit time — a flow, not a stock", period "a
      rate, therefore two or more observations".
    expected:
      comparison: none
    human_review: true
    note: >-
      A run rate is a flow over a window. Neither the generic operations nor the
      specialist capabilities in this vocabulary carry a RUN_RATE operation, so
      any capability/operation reading would be scored against a slot that does
      not exist. Recorded as a genuine vocabulary gap rather than a model error.

  NL5:
    derivation: >-
      Limits assessed forward over a named horizon — the same shape BANK75 gives
      Q25, and independent truth classifies the family as LIMITS_CONCENTRATION.
    expected:
      capability: limit_assessment
      operation: forecast_projection
      temporal: forward_looking
      comparison: none

  NL6:
    derivation: >-
      Independent truth Q6.2: family LIMITS_CONCENTRATION, operations HEADROOM +
      RANKING + STATUS, population "the governed limit schedule", period "point
      in time, latest reporting date".
    expected:
      capability: limit_assessment
      operation: rank
      temporal: current
      comparison: none

  NL7:
    derivation: >-
      Independent truth Q7.2: families MIX_PROFILE + VINTAGE_COHORT, operations
      COMPARISON + DIVERGENCE, population "seasoning_segment == Back Book
      AGAINST months_on_book <= 3", period point in time.
    expected:
      operation: compare
      comparison: population_pair
      temporal: current
    human_review: true
    note: >-
      expected_semantics.yaml records that the two sides of this comparison are
      NOT complementary — back book is >12 months and recent is <=3, so loans
      originated 4-12 months ago fall in neither. The pair is therefore
      expected, but which populations bound it is left unstated.

  NL8:
    derivation: >-
      Independent truth Q8.3/provenance: family MOVEMENT_TREND, operations DELTA
      + TREND + COMPARISON, population "source_portfolio_type == direct AGAINST
      == acquired", period "two or more governed snapshots".
    expected:
      comparison: population_pair
      temporal: relative_pair
    human_review: true
    note: >-
      The independent truth gives two or more snapshots without fixing whether
      that is a pair or a series, so temporal is expected as relative_pair but a
      `series` reading is recorded rather than failed; capability is left
      unstated because MOVEMENT_TREND spans period_movement and
      generic_analysis in this vocabulary.

  NL9:
    derivation: >-
      Independent truth Q9.3: families PIPELINE + FORECAST_PROJECTION,
      operations PROJECT_VALUE + EXPECTED_COMPLETION, population "the OPEN
      pipeline", period "funded balance at the latest reporting date, plus
      expected completions".
    expected:
      capability: forecast
      operation: forecast_projection
      temporal: forward_looking
      comparison: none

  # ---- borrowing base ---------------------------------------------------- #
  BB01:
    derivation: >-
      Source bank gives these three questions the measure
      `borrowing_base_headroom` on the `borrowing_base` route, family "current".
      The specialist owns the arithmetic; the question only names it.
    expected:
      capability: borrowing_base
      operation: headroom
      temporal: current
      comparison: none
      output_structure: 1

  BB02:
    derivation: >-
      Source bank family "bridge": the borrowing-base movement decomposed by the
      specialist. "Why did the borrowing base change?" and "show it as a
      waterfall" are the same request for the same artefact.
    expected:
      capability: borrowing_base
      operation: bridge
      comparison: none
    human_review: true
    note: >-
      temporal is left unstated: a bridge needs two periods, but none of the
      three frozen variants names which two, so relative_pair and
      explicit_period are both defensible readings.
