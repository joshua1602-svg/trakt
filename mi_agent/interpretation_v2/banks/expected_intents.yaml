# =========================================================================
# Expected semantic intent for the 135-question interpretation benchmark.
# =========================================================================
#
# HOW THIS FILE WAS WRITTEN — AND HOW IT WAS NOT
# ----------------------------------------------
# Each expectation is derived from TWO sources only:
#
#   1. the canonical question text, and
#   2. independent semantic truth that already existed in this repository
#      before this sprint —
#        migration_phase0/MI_FINAL_ACCEPTANCE_75.yaml       (shape, family)
#        tests/fixtures/.../STAGE_MOVEMENT_BANK.yaml        (subtype)
#        migration_phase0/BORROWING_BASE_MI_BANK.yaml       (intent, measures)
#        due_diligence/evidence/analytical_intent_v1/
#            expected_semantics.yaml                        (family, operation,
#                                                            population, period)
#
# It is NOT derived from what the deterministic parser resolves, from
# QueryInterpretation, from the recogniser cascade, or from any run of the new
# interpreter. Scoring a new interpreter by agreement with a known-flawed parser
# measures agreement, not correctness.
#
# WHAT AN ABSENT KEY MEANS
# ------------------------
# A dimension that is not stated here is scored UNSCOREABLE, not correct. Where
# the question genuinely supports more than one reading, the entry says so under
# `human_review` and leaves the contested dimension out rather than inventing a
# ruling this sprint has no authority to make. Ten of the forty-five canonicals
# are marked that way; that count is a finding, not a gap to be filled by
# guessing.
#
# `filters` values are the question's own literals. `population` is
# (base, lens, seasoning). `output_structure` is how many distinct figures or
# tables the question asks for.

version: 1
expectations:

  # ---- BANK75 · multi-filter facts -------------------------------------- #
  Q01:
    derivation: >-
      "How many loans" is a count of the row population. Two numeric predicates
      qualify it. Source shape: "two numeric filters / COUNT".
    expected:
      capability: generic_analysis
      operation: point_in_time
      measures: [loan]
      statistic: [count]
      weight: []
      population: [funded, all, any]
      filters:
        - {concept: borrower_age, comparator: gt, value: 55}
        - {concept: current_ltv, comparator: gt, value: 50}
      dimensions: []
      geography_basis: null
      geography_level: null
      temporal: current
      comparison: none
      output_structure: 1

  Q02:
    derivation: >-
      "the balance of loans ..." is the aggregate exposure of a filtered
      population; the registry's governed statistic for balance is a sum.
      Source shape: "two numeric filters / BALANCE".
    expected:
      capability: generic_analysis
      operation: point_in_time
      measures: [balance]
      statistic: [sum]
      weight: []
      population: [funded, all, any]
      filters:
        - {concept: borrower_age, comparator: gt, value: 75}
        - {concept: current_ltv, comparator: gt, value: 40}
      dimensions: []
      temporal: current
      comparison: none
      output_structure: 1

  Q03:
    derivation: >-
      "drawdown loans" is a categorical predicate on product type; "how many"
      is a count. Source shape: "categorical + numeric filter".
    expected:
      capability: generic_analysis
      operation: point_in_time
      measures: [loan]
      statistic: [count]
      weight: []
      population: [funded, all, any]
      filters:
        - {concept: current_ltv, comparator: gt, value: 50}
        - {concept: product_type, comparator: eq, value: drawdown}
      dimensions: []
      temporal: current
      comparison: none
      output_structure: 1

  Q04:
    derivation: >-
      "Direct-book" is the provenance lens, "in London" restricts geography to a
      named place, "borrowers over 75" is a row predicate. Source shape:
      "scope + geography + numeric filter".
    expected:
      capability: generic_analysis
      operation: point_in_time
      measures: [balance]
      statistic: [sum]
      weight: []
      population: [funded, direct, any]
      filters:
        - {concept: borrower_age, comparator: gt, value: 75}
      dimensions: []
      temporal: current
      comparison: none
      output_structure: 1
    human_review: false
    note: >-
      geography is a RESTRICTION here (values ['London']), not a grouping, so
      geography_basis/level are left unstated: the question names a place, not
      a basis.

  Q05:
    derivation: >-
      "weighted-average LTV" names the statistic explicitly; the registry's
      governed weight for LTV is exposure. "lump sum" is a product predicate,
      "Direct book" the lens. Source shape: "aggregation + category + scope".
    expected:
      capability: generic_analysis
      operation: point_in_time
      measures: [current_ltv]
      statistic: [weighted_average]
      weight: [balance]
      population: [funded, direct, any]
      filters:
        - {concept: product_type, comparator: eq, value: lump sum}
      dimensions: []
      temporal: current
      comparison: none
      output_structure: 1

  # ---- BANK75 · synthesis ----------------------------------------------- #
