      concentrations") reads as a SUMMARY. Both readings are defensible from
      the wording, so operation is left unstated and the paraphrase-invariance
      result for Q08 is reported rather than judged.

  Q09:
    derivation: >-
      "concentration limits ... breached or close to breach" is the limit
      schedule assessed at the latest reporting date. Source shape: "current
