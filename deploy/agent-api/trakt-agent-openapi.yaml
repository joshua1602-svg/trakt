                  description: Restrict to named categories — exposure, collateral, delinquency, prepayment,
                    loss, pricing, cashflow, history, data_quality.
                  default: null
                status:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Restrict to named availability states. Asking for AVAILABLE alone gives
                    the working set; asking for everything else gives the reasons.
                  default: null
                include_definition:
                  type: boolean
                  description: Include each capability's methodology, calculation source, unit and basis
                    alongside its status.
                  default: false
                filters:
                  type:
                  - object
                  - 'null'
                  default: null
              additionalProperties: false
              required:
