    post:
      operationId: invoke_portfolio_capabilities
      summary: 'What analytical capabilities Trakt can produce for this portfolio, and for each one it
        cannot, the reason: UNAVAILABLE (an input is missing), NOT_APPLICABLE (economically meaningless
        here), ASSUMPTION_REQUIRED (needs an unknown future rate), MODEL_REQUIRED (needs behavioural modelling)
        or METHODOLOGY_NOT_APPROVED (the data exists and the definition is unsettled)'
      description: 'What analytical capabilities Trakt can produce for this portfolio, and for each one
        it cannot, the reason: UNAVAILABLE (an input is missing), NOT_APPLICABLE (economically meaningless
        here), ASSUMPTION_REQUIRED (needs an unknown future rate), MODEL_REQUIRED (needs behavioural modelling)
        or METHODOLOGY_NOT_APPROVED (the data exists and the definition is unsettled).


        Call this FIRST. It tells you what is worth asking for before you ask, and it does not compute
        anything, so surveying a portfolio is cheap. The five refusal states are not interchangeable:
        UNAVAILABLE means a field could be requested from the client, NOT_APPLICABLE means no field would
        help because the metric does not apply to this product, ASSUMPTION_REQUIRED means Trakt will not
        guess a rate path, MODEL_REQUIRED means Trakt does not model behaviour, and METHODOLOGY_NOT_APPROVED
        means Trakt has the data and has not settled the definition — report it as an open decision, not
        as a gap. Every refusal carries missing_inputs or an explanation you can quote.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The analytical capabilities Trakt can produce for this portfolio, and the reason
                for each one it cannot. Resolved from the governed data without computing any of the metrics.
              properties:
                resource:
                  type: string
                  description: The portfolio resource, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                categories:
