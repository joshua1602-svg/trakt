              type: object
              description: Break a portfolio down by ONE dimension and return balance and count per category.
                Use this instead of retrieving loans and grouping them yourself.
              properties:
                resource: *id002
                dimension:
                  type: string
                  description: The canonical field to group by, e.g. 'geographic_region_collateral', 'account_status'.
                weighted_metrics:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Canonical fields to report as balance-weighted averages per category, e.g.
                    ['current_loan_to_value'].
                  default: null
                filters: *id008
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: Maximum categories to return (at most 200).
                  default: 50
              additionalProperties: false
              required:
              - resource
              - dimension
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/transition_analysis:
    post:
      operationId: invoke_transition_analysis
      summary: 'How loans moved between states across two governed snapshots: deterioration, cures, entries
        and exits'
      description: 'How loans moved between states across two governed snapshots: deterioration, cures,
        entries and exits. Wraps the Risk Monitor''s existing migration matrix.


        Use this to tell a rising arrears figure caused by NEW delinquency from one caused by existing
        cases worsening — they call for different responses. Cures appear as improving transitions. A
        loan absent from one snapshot is an entry or an exit, not a state change.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'How loans moved between states across two governed snapshots: DPD deterioration,
                cures, entries and exits.'
              properties:
                resource: *id001
                dimension:
                  type: string
                  description: The state to track, e.g. 'account_status' or 'ifrs9_stage'.
                  default: account_status
                from_period:
                  type:
                  - string
                  - 'null'
                  description: Baseline snapshot. Omit for the earliest.
                  default: null
                to_period:
                  type:
                  - string
                  - 'null'
                  description: Current snapshot. Omit for the latest.
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/valuation_age_profile:
    post:
      operationId: invoke_valuation_age_profile
      summary: 'How old and how good the collateral evidence is: balance-weighted valuation age distribution,
        physical/indexed method mix, and the share of balance with no usable valuation'
      description: 'How old and how good the collateral evidence is: balance-weighted valuation age distribution,
        physical/indexed method mix, and the share of balance with no usable valuation.


        Every LTV in the book rests on these observations, so read this before quoting any LTV metric.
        A stale valuation makes the reported LTV unreliable rather than making the loan bad — that is
        a data-quality finding, and it calls for different remediation from a credit one. Loans with no
        valuation are silently absent from every LTV figure.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'How old and how good the collateral evidence is: valuation age distribution,
                method mix and missing-valuation share, all balance-weighted.'
              properties:
                resource: *id009
                stale_after_months:
                  type: integer
                  minimum: 1
                  maximum: 600
                  description: Months at or beyond which a valuation counts as stale. Defaults to the
                    governed selection policy's own limit.
                  default: 24
                filters:
                  type:
                  - object
                  - 'null'
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra client-credentials token. The calling application's service principal
        must be assigned the Trakt agent app role, and its directory must be registered as a Trakt organisation.
  schemas:
    GovernedResult:
      type: object
      description: The stable envelope every tool returns. `result` carries the tool's own output; everything
        else is the governance context needed to trust it.
      properties:
        capability:
          type: string
          example: tool.evaluate_covenants
        schema_version:
          type: string
          example: 1.1.0
        status:
          type: string
          enum:
          - success
          - partial_success
          - blocked
          - error
          description: '`blocked` means governance refused (permission or policy). `error` means the capability
            could not produce an answer. The two are different situations for an autonomous caller: do
            not retry a `blocked` call.'
        request_id:
          type: string
        correlation_id:
          type:
          - string
          - 'null'
          description: Echoes the inbound X-Correlation-Id.
        tenant_id:
          type: string
        portfolio_id:
          type:
          - string
          - 'null'
          description: The resource reference this call named.
        snapshot:
          type:
          - object
          - 'null'
          description: 'Which governed dataset answered: label, snapshot id, content hash, reporting date.'
        result:
          type:
          - object
          - 'null'
        warnings:
          type: array
          items:
            type: string
        policy:
          type: object
          description: What governance decided.
        provenance:
          type:
          - object
          - 'null'
        audit:
          type:
          - object
          - 'null'
        error:
          oneOf:
          - &id010
            type: object
            description: A governed failure. Branch on `code`, never on `message`.
            properties:
              code:
                type: string
                description: Stable machine-readable error code.
              message:
                type: string
              category:
                type: string
                enum:
                - authentication
                - authorisation
                - input
                - policy
                - data
                - capability
                - infrastructure
              retryable:
                type: boolean
                description: Whether waiting and retrying could help.
              request_id:
                type: string
              details:
                type: object
            required:
            - code
            - message
            - category
            - retryable
          - type: 'null'
      required:
      - capability
      - schema_version
      - status
      - request_id
      - tenant_id
    TraktError: *id010
    ToolDeclaration:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        agent_guidance:
          type: string
        required_capability:
          type: string
        resource_argument:
          type: string
        input_schema:
          type: object
        output_schema:
          type: object
      required:
      - name
      - version
      - description
      - required_capability
      - input_schema
  responses:
    InvalidArguments:
      description: TOOL_INPUT_INVALID — `error.details.violations` names the failing arguments.
      content: &id011
        application/json:
          schema:
            $ref: '#/components/schemas/GovernedResult'
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      content: *id011
    Forbidden:
      description: SCOPE_MISSING, RESOURCE_NOT_AUTHORISED, CAPABILITY_NOT_GRANTED, TENANT_MISMATCH or
        RESOURCE_NOT_PARTITIONABLE. A permission decision — do not retry.
      content: *id011
    UnknownTool:
      description: TOOL_NOT_FOUND — `error.details.available_tools` lists what this deployment serves.
      content: *id011
    Unavailable:
      description: The agent API or the governed data source is not available. Retryable.
      content: *id011
