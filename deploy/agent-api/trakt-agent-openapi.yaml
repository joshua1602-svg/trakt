# GENERATED FILE — do not edit by hand.
#
# Built from the Trakt agent tool registry by
# scripts/build_agent_openapi.py. Add or change a tool in
# trakt_tools/handlers/, then regenerate.
#
# tests/test_agent_openapi_document.py fails when this file is stale.
#
# Set servers[0].url to the deployment base URL before handing this to a
# client.
openapi: 3.0.3
info:
  title: Trakt Agent Tools
  version: 1.0.0
  description: 'Governed, deterministic credit capabilities for an external AI agent.


    Every figure these tools return is computed by Trakt from governed data under an operator-approved
    definition, and carries the snapshot and configuration provenance needed to trust it. Never compute
    a portfolio figure yourself — call a tool.


    Authorisation is per resource. An agent holds capabilities against named resources and nothing else;
    a resource it is not granted is refused identically to one that does not exist.'
servers:
- url: https://trakt-mi-api.example.azurewebsites.net
  description: Set to your deployment URL before use.
security:
- entraBearer: []
paths:
  /v1/agent/tools:
    get:
      operationId: listTraktTools
      summary: List the Trakt tools this identity may call
      description: 'Returns the tool catalogue narrowed to the capabilities this agent''s grants confer,
        each with its JSON Schema, plus the closed set of resource references it may name. Call this first:
        it removes any need to guess an identifier.'
      responses:
        '200':
          description: The authorised tool catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      $ref: '#/components/schemas/ToolDeclaration'
                  tool_count:
                    type: integer
                  resources:
                    type: object
                    description: capability -> the resource references this agent may use it against.
                  organisation_id:
                    type:
                    - string
                    - 'null'
                  tenant_id:
                    type: string
                  request_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/cohort_comparison:
    post:
      operationId: invoke_cohort_comparison
      summary: One cohort against the REST of the portfolio on the same measures — by vintage, region,
        LTV band or any canonical field
      description: 'One cohort against the REST of the portfolio on the same measures — by vintage, region,
        LTV band or any canonical field. Bounded to two groups.


        This is how a flagged cohort becomes a finding. ''The high-LTV cohort has 4% arrears'' is a number;
        ''4.0% against 1.2% for the rest of the book'' is something a reviewer can act on. Always compare
        before concluding, and never retrieve loans to do it yourself.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Compare a cohort against the REST of the portfolio on the same measures. Optionally
                across periods.
              properties:
                resource: &id001
                  type: string
                  description: The portfolio resource, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                cohort_field:
                  type: string
                  description: The canonical field defining the cohort, e.g. 'portfolio_cohort' for vintage
                    or 'geographic_region_collateral' for region.
                cohort_value:
                  type:
                  - string
                  - 'null'
                  description: The value identifying the cohort. Omit with 'above'/'below' to define a
                    numeric cohort.
                  default: null
                above:
                  type:
                  - number
                  - 'null'
                  description: 'Numeric cohort: values strictly above this.'
                  default: null
                below:
                  type:
                  - number
                  - 'null'
                  description: 'Numeric cohort: values strictly below this.'
                  default: null
                measures:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  default: null
                period:
                  type:
                  - string
                  - 'null'
                  description: Which snapshot. Omit for the most recent.
                  default: null
              additionalProperties: false
              required:
              - resource
              - cohort_field
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/concentration:
    post:
      operationId: invoke_concentration
      summary: 'How concentrated a portfolio is in one dimension: the combined balance and count share
        of the top-N groups, with the contributing groups'
      description: 'How concentrated a portfolio is in one dimension: the combined balance and count share
        of the top-N groups, with the contributing groups.


        This reports the measured SHARE, not a pass or fail. Whether a share breaches a limit is an operator-approved
        covenant test — call evaluate_covenants for that, which carries the approved threshold, its approver
        and its configuration version.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'How concentrated a portfolio is in one dimension: the top-N groups'' combined
                share of balance and count.'
              properties:
                resource: &id002
                  type: string
                  description: The portfolio resource to analyse, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                dimension:
                  type: string
                  description: What to measure concentration in, e.g. 'borrower_identifier', 'geographic_region_collateral'.
                top_n:
                  type: integer
                  minimum: 1
                  maximum: 200
                  description: How many leading groups to combine.
                  default: 10
                filters: &id008
                  type:
                  - object
                  - 'null'
                  description: 'Optional equality filters as {canonical_field: value} or {canonical_field:
                    [values]}. Applied before aggregation.'
                  default: null
              additionalProperties: false
              required:
              - resource
              - dimension
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/contractual_analytics:
    post:
      operationId: invoke_contractual_analytics
      summary: Contractual weighted average life and periodic yield, derived only from terms the contract
        fixes — amortisation type (RREL35), rate type (RREL42), frequency, maturity, balloon and price
        (RREL34)
      description: 'Contractual weighted average life and periodic yield, derived only from terms the
        contract fixes — amortisation type (RREL35), rate type (RREL42), frequency, maturity, balloon
        and price (RREL34). One schedule pass serves both metrics.


        CONTRACTUAL, not observed: this is what the contract says will happen, not what borrowers do.
        Read the status before the number. NOT_APPLICABLE on a lifetime mortgage is the correct answer
        and not a gap — repayment is contingent on death or sale, so no contractual WAL exists and the
        legal maturity must not be substituted for one. ASSUMPTION_REQUIRED means a floating rate makes
        the answer unknowable, not that Trakt failed. Note that a bullet or fixed-amortisation loan keeps
        its WAL even when floating, because its principal series does not depend on the rate.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Contractual weighted average life and yield, derived only from terms the contract
                fixes. Nothing here forecasts: floating-rate exposures report ASSUMPTION_REQUIRED and
                lifetime mortgages report NOT_APPLICABLE rather than producing a number from a legal maturity.'
              properties:
                resource:
                  type: string
                  description: The portfolio resource, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                metrics:
                  type: array
                  items:
                    type: string
                    enum:
                    - contractual_wal
                    - contractual_ytm_periodic
                  description: Which metrics to return. Both are built from one schedule pass, so asking
                    for both costs no more than asking for one.
                  default:
                  - contractual_wal
                price_percent_of_par:
                  type:
                  - number
                  - 'null'
                  description: Override the price for yield, as a percentage of par on the RREL34 scale
                    (100 = par). Omitted, each loan's own purchase_price is used and a loan without one
                    reports FIELD_GAP rather than assuming par.
                  default: null
                explain_loan_id:
                  type:
                  - string
                  - 'null'
                  description: Return the full cash-flow schedule and methodology explanation for one
                    named exposure.
                  default: null
                filters:
                  type:
                  - object
                  - 'null'
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/covenant_drillthrough:
    post:
      operationId: invoke_covenant_drillthrough
      summary: The loans contributing to one covenant or concentration test's numerator, with the numerator
        and denominator they reconcile to
      description: 'The loans contributing to one covenant or concentration test''s numerator, with the
        numerator and denominator they reconcile to.


        Call this after evaluate_covenants reports a breach, using the same test_id and the same as_of_run_id.
        Check ''reconciles'': when it is false, the population and the reported figure disagree and you
        must not attribute the figure to these loans. Do not reconstruct a covenant''s population yourself
        — it is defined by a registered metric, not by a field comparison.


        Tool version 1.0.0. Requires the `loan:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The loans contributing to ONE covenant or concentration test's numerator. Use
                this after evaluate_covenants tells you a test is breached or close to its limit.
              properties:
                resource: &id007
                  type: string
                  description: The resource the test was evaluated against, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                test_id:
                  type: string
                  description: The test to drill into, as returned in evaluate_covenants' tests[].test_id.
                as_of_run_id:
                  type:
                  - string
                  - 'null'
                  description: Optional governed run. Omit for the current approved reporting position.
                    Use the SAME value you passed to evaluate_covenants, or the two will not reconcile.
                  default: null
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  description: Rows to return, at most 500.
                  default: 100
              additionalProperties: false
              required:
              - resource
              - test_id
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/cure_analysis:
    post:
      operationId: invoke_cure_analysis
      summary: 'Observed cure rate: delinquent balance returning to CURRENT over the delinquent balance
        able to cure at the opening'
      description: 'Observed cure rate: delinquent balance returning to CURRENT over the delinquent balance
        able to cure at the opening. Improvement within delinquency is reported separately and is not
        a cure.


        Read improved_not_cured_balance alongside the rate. A book whose loans move from 90+ to 30 days
        has improved without curing, and reporting that as a cure would overstate the recovery. Unlike
        the default rate this convention is Trakt''s own — ESMA defines no loan-level cure concept — so
        say so when quoting it externally.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id003
              type: object
              description: Observed losses and recoveries, reported on every defensible denominator rather
                than one chosen for you.
              properties:
                resource: *id001
                months:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
                  maximum: 60
                  default: null
                from_period:
                  type:
                  - string
                  - 'null'
                  default: null
                to_period:
                  type:
                  - string
                  - 'null'
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/data_completeness:
    post:
      operationId: invoke_data_completeness
      summary: 'How populated each canonical field is across a portfolio: populated count, missing count
        and completeness percentage, worst first'
      description: 'How populated each canonical field is across a portfolio: populated count, missing
        count and completeness percentage, worst first.


        The first diligence question about any tape: what is actually there. Use ''max_completeness_pct''
        to see only the gaps. A field being absent from the tape is different from being present and empty
        — this distinguishes them.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'How populated the canonical fields are across a portfolio. The first diligence
                question about any tape: what is actually there.'
              properties:
                resource: *id002
                fields:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Canonical fields to report on. Omit for every field the tape carries.
                  default: null
                max_completeness_pct:
                  type:
                  - number
                  - 'null'
                  description: Report only fields populated at or below this percentage — the gaps, rather
                    than the whole tape.
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/default_analysis:
    post:
      operationId: invoke_default_analysis
      summary: 'Observed default rate across governed snapshots: balance classified as defaulted DURING
        the period over non-defaulted opening balance, annualised — ESMA''s own CDR definition — plus
        the default stock, reported separately because it is a level and not a rate'
      description: 'Observed default rate across governed snapshots: balance classified as defaulted DURING
        the period over non-defaulted opening balance, annualised — ESMA''s own CDR definition — plus
        the default stock, reported separately because it is a level and not a rate.


        OBSERVED, not a probability of default: this is what happened. The rate and the stock are different
        questions — a book can carry a large stock of legacy defaults and have a default rate of zero
        — so say which you are quoting. Default is read from default_date or account_status, never inferred
        from days past due or from a loan disappearing from the tape.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id003
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/evaluate_covenants:
    post:
      operationId: invoke_evaluate_covenants
      summary: Evaluate the operator-approved concentration and covenant tests for a portfolio resource
      description: 'Evaluate the operator-approved concentration and covenant tests for a portfolio resource.
        Returns each test''s current value, threshold, operator, utilisation, headroom, breach amount,
        status and movement against the prior governed reporting period, plus the configuration version
        and approver that produced them.


        Use this to find out whether a book is within its concentration limits and covenants, and by how
        much. Every number is computed by Trakt from governed data under an operator-approved definition
        — never estimate or recompute one yourself. Check ''source'': only ''approved_configuration''
        is operator-approved.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Evaluate the operator-approved concentration and covenant tests for one authorised
                resource.
              properties:
                resource:
                  type: string
                  description: The resource to evaluate, as '{tenant}/{kind}/{resource_id}' — for example
                    'ERE/source_portfolio/direct_001'. Call GET /v1/agent/tools to see the resources you
                    may name.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                as_of_run_id:
                  type:
                  - string
                  - 'null'
                  description: Optional governed run to evaluate as at. Omit for the current approved
                    reporting position.
                  default: null
                category:
                  type:
                  - string
                  - 'null'
                  description: Optional category filter, e.g. 'geographic'. Omit for every active test.
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/evaluate_rule_packs:
    post:
      operationId: invoke_evaluate_rule_packs
      summary: 'Apply every configured rulebook to the SAME measured facts: warehouse criteria, Trakt''s
        internal screening thresholds, and any supplied securitisation criteria'
      description: 'Apply every configured rulebook to the SAME measured facts: warehouse criteria, Trakt''s
        internal screening thresholds, and any supplied securitisation criteria. Each fact is computed
        once and every pack reads it.


        Check ''authority'' on every result before reporting it. An external pack returns pass/breach
        and is a real requirement; Trakt''s screening pack returns clear/flag and means only ''worth investigating''.
        NEVER describe a screening flag as a breach, and never add the two counts together. If no securitisation
        criteria pack is configured, the assessment cannot conclude the book meets them — say so.


        Tool version 1.0.0. Requires the `risk:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Apply every configured rulebook to the same measured facts: warehouse criteria,
                Trakt''s internal screening thresholds, and any supplied securitisation criteria.'
              properties:
                resource: &id009
                  type: string
                  description: The portfolio resource to assess, as '{tenant}/{kind}/{resource_id}'.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                packs:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Pack ids to evaluate. Omit for every configured pack.
                  default: null
                filters:
                  type:
                  - object
                  - 'null'
                  default: null
              additionalProperties: false
              required:
              - resource
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/explain_value:
    post:
      operationId: invoke_explain_value
      summary: Return the evidence behind ONE value
      description: 'Return the evidence behind ONE value. A convenience wrapper over explain_values.


        Use only for a single figure. To evidence several, call explain_values once instead.


        Tool version 1.0.0. Requires the `loan:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Return the evidence behind ONE value. For several values call explain_values
                once instead.
              properties:
                resource: &id004
                  type: string
                  description: The resource the values were read from.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                loan_id:
                  type: string
                canonical_field:
                  type: string
              additionalProperties: false
              required:
              - resource
              - loan_id
              - canonical_field
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/explain_values:
    post:
      operationId: invoke_explain_values
      summary: 'Return the evidence behind several values: the source dataset and field, snapshot identity
        and content hash, mapping method and version, any derivation rule, validation status, and the
        calculation method where the value is calculated'
      description: 'Return the evidence behind several values: the source dataset and field, snapshot
        identity and content hash, mapping method and version, any derivation rule, validation status,
        and the calculation method where the value is calculated. At most 500 per call.


        Use this to justify the figures you report. It is the primitive: to evidence several values call
        it ONCE with a list. Provenance is bound to the snapshot the value was read from, so an answer
        always states which dataset it came from.


        Tool version 1.0.0. Requires the `loan:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Return the evidence behind SEVERAL values in one call. This is the primitive:
                to justify more than one figure, call this once rather than explain_value repeatedly.'
              properties:
                resource: *id004
                requests:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                  description: Objects of {loan_id, canonical_field}, at most 500 per call. Answers are
                    returned in the order requested.
              additionalProperties: false
              required:
              - resource
              - requests
      responses:
        '200':
          description: The governed result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedResult'
        '400':
          $ref: '#/components/responses/InvalidArguments'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownTool'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/agent/tools/get_loan:
    post:
      operationId: invoke_get_loan
      summary: Retrieve ONE loan
      description: 'Retrieve ONE loan. A convenience wrapper over get_loans — same implementation, same
        governed frame.


        Use only for a single loan you are already investigating. For several loans call get_loans once
        instead.


        Tool version 1.0.0. Requires the `loan:read` capability against the named resource.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Retrieve ONE loan you are already investigating. For several loans call get_loans
                once instead — it is the same work in one request.
              properties:
                resource: &id005
                  type: string
                  description: The resource holding the loans, as '{tenant}/{kind}/{resource_id}'. Call
                    GET /v1/agent/tools to see the resources you may name.
                  pattern: ^[^/]+/[^/]+/[^/]+$
                loan_id:
                  type: string
                  description: The loan identifier.
                fields: &id006
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: Canonical field names to return. Omit for a curated default projection;
                    ask for only what you need — a canonical tape carries over a hundred columns.
                  default: null
                shape:
                  type: string
                  enum:
                  - flat
                  - structured
                  description: See get_loans.
                  default: flat
                include:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
