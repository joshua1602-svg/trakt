# OpenAPI contract for the Trakt Microsoft 365 Copilot agent — EXACTLY the three
# v1 actions, nothing else. Hand-authored at OpenAPI 3.0.3 (the version Copilot
# API plugins consume; FastAPI's auto-generated spec is 3.1 and covers the whole
# internal API, which must not be exposed to the plugin).
#
# Before packaging, set servers[0].url to the deployed Trakt MI API base URL.
# tests/mi_agent_api/tests/test_copilot_package.py asserts this file stays in
# lock-step with the implemented routes and operation ids.
openapi: 3.0.3
info:
  title: Trakt Copilot Actions
  description: >-
    Trakt portfolio MI and artefact retrieval for Microsoft 365 Copilot.
    Answers come from Trakt's deterministic MI engine and published pipeline
    outputs — never from model estimation.
  version: 2.0.0
servers:
  - url: https://trakt-mi-api.azurewebsites.net
    description: Trakt MI API (set to your deployment URL before packaging)
security:
  - entraBearer: []
paths:
  /v1/copilot/mi/query:
    post:
      operationId: askTraktMi
      summary: Ask the Trakt MI Agent a portfolio question
      description: >-
        Use for ANY question about portfolio data, performance, balances, loan
        counts, LTV and LTV distribution, regional concentration and other
        geographic views, top-N loans, filtered metrics, originations,
        comparisons between reporting periods, cohorts, forecasts, risk limits,
        data quality, or other management-information queries. Returns the
        answer and the supporting values it was computed from. Omit portfolioId
        unless the user explicitly names a historical run — point-in-time
        questions are answered from the current active governed dataset. Never
        compute portfolio figures yourself — always call this action.
      parameters:
        - $ref: '#/components/parameters/PackageVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopilotMiQueryRequest'
      responses:
        '200':
          description: The MI Agent's answer (ok=false carries a controlled error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotMiAnswer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/MalformedRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/copilot/artifacts/latest:
    get:
      operationId: getArtifact
      summary: Get the latest generated artifact of a given type
      description: >-
        Use when the user asks for a downloadable Trakt artifact — investor
        deck, canonical loan tape, mapping report, validation report, or ESMA
        Annex 2 XML. Pass the artifactType that matches the request. Returns
        file metadata and a short-lived download link to present to the user.
        Trakt validates the type server-side and returns a 404 listing the
        available types if it does not recognise one; new artifact types become
        available without any package change. Do not use for data questions.
      parameters:
        - $ref: '#/components/parameters/PackageVersion'
        - name: artifactType
          in: query
          required: true
          description: >-
            The kind of artifact to retrieve. Known types include
            investor_deck, canonical_tape, mapping_report, validation_report and
            esma_xml; Trakt may add more, validated server-side. This is an open
            string, not a fixed enumeration, so new artifact types need no
            package update.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Metadata and a short-lived download link for the artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopilotArtifactInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    PackageVersion:
      name: X-Trakt-Package-Version
      in: header
      required: false
      description: >-
        The Trakt Copilot package version this tenant is running. Sent on every
        request so backend logs can detect tenants on a stale package. Defaults
        to the version this package was built from.
      schema:
        type: string
        default: "2.0.0"
  securitySchemes:
    entraBearer:
      type: oauth2
      description: Microsoft Entra ID (OAuth 2.0 authorization code flow).
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/common/oauth2/v2.0/token
          scopes:
            api://TRAKT-COPILOT-APP-ID/Trakt.Copilot: Call Trakt Copilot actions
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CopilotError'
    NotFound:
      description: The requested artefact has not been generated yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CopilotError'
    Unavailable:
      description: >-
        The service is not ready (authentication not configured, no governed
        live data source, or the artefact store is unreachable).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CopilotError'
    MalformedRequest:
      description: The request body failed validation.
      content:
        application/json:
          schema:
            type: object
  schemas:
    CopilotMiQueryRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          description: The portfolio MI question, in natural language. Rewrite
            follow-up questions into standalone questions before calling.
        portfolioId:
          type: string
          nullable: true
          description: Optional portfolio/run selector '{client_id}/{run_id}'.
            Omit to query the current active reporting dataset.
        asOfDate:
          type: string
          nullable: true
          description: Optional as-of date label (YYYY-MM-DD).
    CopilotSupportingArtifact:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: kpi | table | chart
        title:
          type: string
          nullable: true
        kpis:
          type: array
          nullable: true
          items:
            type: object
          description: 'For kind=kpi: [{label, value}] as formatted by the MI Agent.'
        columns:
          type: array
          nullable: true
          items:
            type: string
        rows:
          type: array
          nullable: true
          items:
            type: object
          description: Result rows (capped; see truncated).
        truncated:
          type: boolean
          default: false
        totalRows:
          type: integer
          nullable: true
          description: Total rows the MI engine produced before any cap.
    CopilotMiAnswer:
      type: object
      required: [ok, question, answer, dataSourceKind, dataSourceLabel]
      properties:
        ok:
          type: boolean
        question:
          type: string
        answer:
          type: string
          description: The MI Agent's answer text. Compose any narrative ONLY
            from this and supportingValues.
        error:
          type: string
          nullable: true
        interpreted:
          type: string
          nullable: true
          description: How the deterministic parser interpreted the question.
        querySpec:
          type: object
          nullable: true
          description: The parsed governed query specification (metric,
            aggregation, dimensions, filters, top-N, ordering).
        reportingDate:
          type: string
          nullable: true
        datasetContext:
          type: string
          nullable: true
          description: funded | pipeline | forecast
        portfolioId:
          type: string
          nullable: true
        selectedClient:
          type: string
          nullable: true
          description: Governed client the answer is scoped to.
        selectedPortfolio:
          type: string
          nullable: true
        selectedRun:
          type: string
          nullable: true
          description: Set ONLY when the analytical intent genuinely required a
            specific historical run; null for point-in-time questions.
        dataSourceKind:
          type: string
        dataSourceLabel:
          type: string
        supportingValues:
          type: array
          items:
            $ref: '#/components/schemas/CopilotSupportingArtifact'
        validation:
          type: object
          nullable: true
          description: Deterministic validation result from the MI engine.
        reconciliation:
          type: object
          nullable: true
          description: Coverage / reconciliation footer for the result.
        sourceNotes:
          type: array
          items: {}
        warnings:
          type: array
          items:
            type: string
        diagnostics:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        truncated:
          type: boolean
          default: false
          description: True when supporting rows were capped for the Copilot
            response limit. The underlying totals are unaffected.
        truncationNote:
          type: string
          nullable: true
        classification:
          type: string
          description: >-
            fully-served-simple | fully-served-complex | unmet. Indicates
            whether the richer React MI Workspace would materially help.
        workspaceUrl:
          type: string
          nullable: true
          description: >-
            Deep link that restores this query's context (client, run, question,
            filters) in the React MI Workspace. Present ONLY for
            fully-served-complex and unmet answers, and only when configured.
            Surface it to the user when present.
        packageVersion:
          type: string
          description: The Copilot package version the backend expects (telemetry).
    CopilotArtifactInfo:
      type: object
      required: [ok, artifactType, fileName, contentType, clientId, downloadUrl, downloadExpiresAt]
      properties:
        ok:
          type: boolean
        artifactType:
          type: string
          description: investor_deck | canonical_tape
        fileName:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          nullable: true
        clientId:
          type: string
        reportingPeriod:
          type: string
          nullable: true
        generatedAt:
          type: string
          nullable: true
        downloadUrl:
          type: string
          description: Short-lived signed URL for the file. Present this link
            to the user.
        downloadExpiresAt:
          type: string
    CopilotError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          type: string
