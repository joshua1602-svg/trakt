# =========================================================================
# Standing (onboarding) field specification, per reporting product.
# =========================================================================
#
# WHY THIS FILE EXISTS
# --------------------
# Everything here already exists somewhere in Trakt: the Annex 2 fields are
# entries in config/regime/annex2_field_universe.yaml and
# config/regime/annex2_delivery_rules.yaml; the Annex 12 fields are the
# `annex12.deal` block of config/regime/annex12_template.yaml; the client
# identity fields are the `client:` / `portfolio:` / `defaults:` blocks of
# config/client/config_client_*.yaml.
#
# What did NOT exist anywhere is the DECLARATION of which of those fields are
# STANDING (true until the client changes them) versus DELIVERY-SPECIFIC (true
# only for one reporting period). Onboarding needs exactly that distinction —
# only standing information belongs in a client's profile — and the delivery
# rules do not carry it. So this file adds the classification, and nothing else:
# it defines no new fields and overrides no existing behaviour.
#
# It is governed as part of the REGIME package (see
# operations_control/configuration/packages.py::LAYER_FILES), so adding a future
# regime is a configuration change, not a code change. The onboarding wizard
# renders whatever it finds here.
#
# `writes_to` names the legacy artefact and key path the onboarding wizard
# generates the answer into, so nothing is stored twice:
#
#   client_config:<dotted.path>    config/client/config_client_{CLIENT}.yaml
#   annex12_config:<dotted.path>   config/client/config_client_annex12.yaml
#
# A field with no `writes_to` is captured and audited but has no artefact to
# land in yet — those are listed under `unrepresented` at the foot of each
# product so the gap is visible rather than silently dropped.

version: 1

products:

  # -----------------------------------------------------------------------
  # Management information. Derived, not chosen: every delivery produces MI.
  # -----------------------------------------------------------------------
  mi:
    label: Management Information
    always_applies: true
    derived_from: >-
      Every governed delivery produces MI. The workflow outcome vocabulary
      (operations_control.contracts.OUTCOMES) has no MI-less option.
    fields: []

  # -----------------------------------------------------------------------
  # ESMA Annex 2 — non-ABCP underlying exposure report.
  # Standing fields are the three `defaults:` entries the projector injects
  # into every row (config/client/config_client_ERM_UK.yaml) plus the two
  # original-lender defaults the delivery rules permit.
  # -----------------------------------------------------------------------
  esma_annex2:
    label: ESMA Annex 2
    requires_dataset: funded
    supported_by_assets_declaring: ESMA_Annex2
    fields:
      - key: originator_name
        label: Originator name
        regime_code: RREL82
        classification: standing_client
        source: derived
        derives_from: the entity holding the originator role
        required: false
        format: text
        max_length: 100
        help: >-
          The full legal name of the originator. Must match the name held
          against the LEI in the GLEIF database.
        writes_to: client_config:defaults.originator_name

      - key: originator_legal_entity_identifier
        label: Originator LEI
        regime_code: RREL83
        classification: standing_client
        source: derived
        derives_from: the entity holding the originator role
        required: false
        format: lei
        help: The originator's 20-character Legal Entity Identifier.
        writes_to: client_config:defaults.originator_legal_entity_identifier

      - key: originator_establishment_country
        label: Originator country of establishment
        regime_code: RREL84
        classification: standing_client
        source: derived
        derives_from: the entity holding the originator role
        required: false
        format: country
        writes_to: client_config:defaults.originator_establishment_country

      - key: original_lender_legal_entity_identifier
        label: Original lender LEI
        regime_code: RREL80
        classification: standing_client
        source: derived
        derives_from: the entity holding the original lender role
        required: false
        format: lei
        help: >-
          Only where the original lender differs from the originator and is the
          same for the whole book. Left blank, the delivery rules apply ND5.
        writes_to: client_config:defaults.original_lender_legal_entity_identifier

      - key: original_lender_establishment_country
        label: Original lender country of establishment
        regime_code: RREL81
        classification: standing_client
        source: derived
        derives_from: the entity holding the original lender role
        required: false
        format: country
        writes_to: client_config:defaults.original_lender_establishment_country

      - key: nuts_classification_year
        label: NUTS classification year
        classification: standing_portfolio
        source: trakt_default
        derives_from: the governed default vintage
        required: false
        format: enum
        default: "2021"
        options: ["2021", "2024"]
        help: >-
          The NUTS vintage used for the regulatory geographic region fields.
        writes_to: client_config:nuts_classification_year

      - key: uk_geography_override
        label: Report UK geography as GBZZZ
        classification: standing_portfolio
        source: inferred
        derives_from: the client's jurisdiction
        required: false
        format: boolean
        help: >-
          Delivers GBZZZ for UK obligor and collateral region (RREL11 / RREC6)
          while retaining granular ITL3 in canonical for MI. Applies to UK
          jurisdictions only.
        writes_to: client_config:regime_overrides.ESMA_Annex2.uk_geography.enabled

    # Standing information the regime asks for that the current Annex 2 model
    # has nowhere to hold. Captured in the profile, reported in the review, NOT
    # written to an artefact — because inventing a home for them would be
    # inventing configuration.
    unrepresented:
      - key: sponsor_name
        label: Sponsor
        reason: >-
          Annex 2 is the underlying-exposure report; it carries no sponsor
          field. Sponsor appears only as a risk-retention holder value in
          Annex 12 (IVSS9 = SPON).
      - key: sspe_name
        label: SSPE
        reason: >-
          No SSPE field exists in the Annex 2 field universe. The securitisation
          entity is named in Annex 12 (IVSS3 / IVSS4).
      - key: national_competent_authority
        label: National competent authority
        reason: >-
          Trakt produces the report; it does not file it. No NCA field exists in
          the field universe or the delivery rules.
      - key: sts_status
        label: STS status and notification identifier
        reason: >-
          No STS fields exist in the current Annex 2 model. Adding them means
          extending the field universe, which is an administrator change.
      - key: servicer_name
        label: Servicer
        reason: >-
          `source_system` on a source registration records who supplies the
          data. There is no regulatory servicer field in the Annex 2 model.
      - key: calculation_conventions
        label: Calculation conventions
        reason: >-
          Day-count and payment-frequency conventions exist under `loan_engine:`
          in the client configuration and are captured in onboarding as static
          reporting information, but they are not Annex 2 fields.

  # -----------------------------------------------------------------------
  # ESMA Annex 12 — investor report. Standing fields are the `annex12.deal`
  # entries of config/regime/annex12_template.yaml that the client instance
  # config supplies (config/client/config_client_annex12.yaml).
  # -----------------------------------------------------------------------
  investor_reporting:
    label: Investor Reporting
    regime_id: ESMA_Annex12
    fields:
      - key: IVSS1
        label: Securitisation unique identifier
        classification: standing_client
        source: derived
        derives_from: the reporting entity's identifier
        required: false
        format: text
        help: >-
          Left blank, the projector resolves this from the originator LEI in the
          client configuration.
        writes_to: annex12_config:annex12.deal.IVSS1

      - key: IVSS3
        label: Securitisation name
        classification: standing_client
        source: derived
        derives_from: the reporting entity's legal name
        required: false
        format: text
        writes_to: annex12_config:annex12.deal.IVSS3

      - key: IVSS4
        label: Reporting entity name
        classification: standing_client
        source: derived
        derives_from: the reporting entity's legal name
        required: false
        format: text
        writes_to: annex12_config:annex12.deal.IVSS4

      - key: IVSS5
        label: Reporting entity contact person
        classification: standing_client
        source: derived
        derives_from: the reporting contact
        required: false
        format: text
        writes_to: annex12_config:annex12.deal.IVSS5

      - key: IVSS6
        label: Reporting entity contact telephone
        classification: standing_client
        source: derived
        derives_from: the reporting contact
        required: false
        format: text
        writes_to: annex12_config:annex12.deal.IVSS6

      - key: IVSS7
        label: Reporting entity contact email
        classification: standing_client
        source: derived
        derives_from: the reporting contact
        required: false
        format: email
        writes_to: annex12_config:annex12.deal.IVSS7

      - key: IVSS8
        label: Risk retention method
        classification: standing_client
        required: true
        format: enum
        options_from: annex12_template:annex12.enums.IVSS8
        writes_to: annex12_config:annex12.deal.IVSS8

      - key: IVSS9
        label: Risk retention holder
        classification: standing_client
        source: derived
        derives_from: the role of the entity holding the retention
        required: false
        format: enum
        options_from: annex12_template:annex12.enums.IVSS9
        writes_to: annex12_config:annex12.deal.IVSS9

      - key: IVSS10
        label: Underlying exposure type
        classification: standing_portfolio
        source: derived
        derives_from: the portfolio's asset class
        required: false
        format: enum
        options_from: annex12_template:annex12.enums.IVSS10
        writes_to: annex12_config:annex12.deal.IVSS10

      - key: IVSS11
        label: Risk transfer method applied
        classification: standing_client
        required: false
        format: yes_no
        writes_to: annex12_config:annex12.deal.IVSS11

      - key: IVSS12
        label: Trigger measurements or ratios reported
        classification: standing_client
        required: false
        format: yes_no
        writes_to: annex12_config:annex12.deal.IVSS12

      - key: IVSS13
        label: Revolving / ramp-up end date
        classification: standing_client
        required: false
        format: date_or_nd
        help: A date where one applies, otherwise ND5.
        writes_to: annex12_config:annex12.deal.IVSS13

      - key: IVSS20
        label: Excess spread trapping mechanism
        classification: standing_client
        required: false
        format: yes_no
        writes_to: annex12_config:annex12.deal.IVSS20

      - key: IVSS30
        label: Risk weight approach
        classification: standing_client
        required: false
        format: enum
        options_from: annex12_template:annex12.enums.IVSS30
        writes_to: annex12_config:annex12.deal.IVSS30

    unrepresented:
      - key: trustee_name
        label: Trustee
        reason: >-
          Captured as static reporting information in the onboarding profile
          (it appears on investor report covers), but Annex 12 has no trustee
          field, so it is not written into the regime configuration.
      - key: IVSR_triggers
        label: Trigger definitions (IVSR1-IVSR10)
        reason: >-
          Currently hard-coded per deal in config/client/config_client_annex12.yaml
          as forced XML-structure values. They are deal-structure information,
          not client standing information, and are left where they are until a
          governed trigger model exists.
      - key: IVSF_cashflows
        label: Cashflow items (IVSF1-IVSF6)
        reason: >-
          Period cashflow values. Delivery-specific by definition.

  # -----------------------------------------------------------------------
  # Static pools. Cohort analysis over the funded book; the chart set is asset
  # configuration (config/asset/static_pools_config_erm.yaml), so onboarding
  # captures only whether the client receives it.
  # -----------------------------------------------------------------------
  static_pools:
    label: Static Pools
    requires_dataset: funded
    fields: []
    unrepresented:
      - key: cohort_definition
        label: Cohort definition
        reason: >-
          Held as asset configuration (static_pools_config_erm.yaml) and
          administered through the governed asset package, not per client.
