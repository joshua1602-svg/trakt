# Workflow input requirements — administrator-governed (system package layer).
#
# Readiness is based on RECOGNISED SEMANTIC INPUT ROLES (the file_roles
# classifier vocabulary), never on hard-coded filenames and never on a
# _READY.json sentinel. The Operations Control Centre evaluates these
# requirements after every file registration or recognition result.
version: 1
# Four things a client sends, named the way a client says them. Every label
# here is what appears on the onboarding checklist, so it is written for the
# person filling it in rather than for the classifier reading it.
role_labels:
  loan_extract: "Loan tape"
  collateral_extract: "Collateral tape"
  # The generic name wins. "Funder principal & interest tape" is the SAME FILE
  # under a more technical name, and asking for both invited a client to wonder
  # which they had, or to send one and think the other still outstanding. One
  # question, in the words more people recognise.
  cashflow_extract: "Cash-flow tape"
  # The ROLE key stays `pipeline_report` deliberately: `pipeline` already names
  # a BOOK in this platform — the forward-looking stream, registered and
  # cadenced separately from the funded book — and a role sharing that word
  # would read as the book rather than the file. The LABEL is what the client
  # sees, and to a client it is a tape like the others.
  pipeline_report: "Pipeline tape"
  # Still recognised by the classifier so an existing delivery keeps its role,
  # but no longer asked for separately. Both are captured by a tape above:
  # property and valuation detail under the collateral tape, funder principal
  # and interest under the cash-flow tape.
  property_extract: "Property / valuation tape"
  funder_pi_extract: "Funder principal & interest tape"
workflows:
  mi:
    required_roles:
      - loan_extract
    optional_roles:
      - collateral_extract
      - cashflow_extract
      - pipeline_report
  mi_annex2:
    required_roles:
      - loan_extract
    optional_roles:
      - collateral_extract
      - cashflow_extract
      - pipeline_report
# What a PIPELINE pack needs, whichever workflow it runs. The workflows above
# describe a funded delivery — a loan tape plus supporting tapes — and a
# pipeline pack has no loan tape, so it waited for one that never comes.
datasets:
  pipeline:
    required_roles:
      - pipeline_report
    optional_roles: []
# Minimum recognition confidence for a file to SATISFY a required role without
# operator confirmation. Below this, readiness parks as review_required.
min_required_role_confidence: 0.4
# Optional quiet period (seconds) before auto-start for automated sources —
# readiness is still reassessed on every arrival; this only delays the start.
auto_start_quiet_seconds: 0
