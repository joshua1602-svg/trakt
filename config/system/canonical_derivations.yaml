# canonical_derivations.yaml
# ==========================
#
# Declarative, deterministic canonical field derivations applied by the
# Transformation Agent AFTER type normalisation and BEFORE the field contract is
# finalised.
#
# These are NOT projection rules and NOT LLM inferences. Each entry names one
# canonical target field, the canonical field it is computed from, and a rule
# from the fixed rule library in
# ``engine.transformation_agent.canonical_derivations``. Nothing here can invent
# a value: every rule maps null to null.
#
# A derived field must never also be mapped directly from source — the onboarding
# coverage layer enforces that (see target_coverage._apply_derived_source_guard),
# and lineage records the derivation so the value is never mistaken for sourced
# data.
#
# Rule library (see canonical_derivations.RULES):
#   positive_number_to_flag
#       null            -> null
#       value <= 0      -> "N"
#       value > 0       -> "Y"
#       unparseable     -> null + a controlled derivation issue
#   presence_to_flag
#       null / blank    -> "N"
#       any value       -> "Y"
#   ratio_percentage  (two sources: numerator, denominator)
#       either null     -> null
#       denominator<=0  -> null
#       otherwise       -> numerator / denominator * 100, to 4 decimal places

version: 1

derivations:

  # Protected equity: the SOURCE carries the percentage (e.g. "20.00%"), which is
  # valuable MI in its own right and is mapped to protected_equity_percentage.
  # The boolean flag is a view OF that percentage, so it is derived from the
  # parsed canonical number rather than parsed from the percentage text — feeding
  # "20.00%" to a Y/N parser is what produced boolean_parse_failed.
  protected_equity_flag:
    from: protected_equity_percentage
    rule: positive_number_to_flag
    description: >-
      Y when the loan carries a protected-equity percentage greater than zero,
      N when the percentage is present and zero, null when the source is blank.
    preserve_source: true

  # Loan-to-value. The regulator requires both the current and the original LTV
  # on every record (RREC12 / RREC16) and permits a no-data code — but a no-data
  # code would be untrue for a lender that supplies the balance and the
  # valuation, which is the whole ratio. So it is calculated from governed
  # canonical values, and only where the lender does not state it: a supplied
  # LTV always wins (`fill_blank_only`).
  #
  # The canonical LTV is a PERCENTAGE, which is what the estate already assumes
  # — Gate 3's business rules bound it to 0–500 and reconcile it against balance
  # and valuation within 1%.
  current_loan_to_value:
    from: [current_outstanding_balance, current_valuation_amount]
    rule: ratio_percentage
    fill_blank_only: true
    description: >-
      Current outstanding balance as a percentage of the current valuation.
      Calculated only where the lender does not supply the ratio itself.

  original_loan_to_value:
    from: [original_principal_balance, original_valuation_amount]
    rule: ratio_percentage
    fill_blank_only: true
    description: >-
      Original advance as a percentage of the valuation at origination.
      Calculated only where the lender does not supply the ratio itself.

  # Youngest borrower age. An acquired back book is delivered with dates of
  # birth and no age column: the seller's system stored the DOB and computed the
  # age on demand. The canonical field is what MI and every age-band question
  # read, so it is calculated from the governed canonical dates rather than left
  # absent for two thirds of the platform.
  #
  # Full calendar age (completed years) at the GOVERNED cut-off date, never at
  # today: an answer about the June book must not change because it was asked in
  # September. Both borrowers are considered and the YOUNGER one's age is taken;
  # one borrower is enough. A lender-supplied age always wins (`fill_blank_only`).
  # Where no date of birth is usable the result is null and the row is counted
  # for operator review — it is a question about the data, not a failure of the
  # rule, so it never blocks the portfolio.
  youngest_borrower_age:
    from: [borrower_1_DOB, borrower_2_DOB]
    at: data_cut_off_date
    rule: youngest_full_age_at
    fill_blank_only: true
    unresolved_reason: >-
      No usable borrower date of birth at the governed cut-off date; the
      youngest-borrower age cannot be calculated for these loans.
    description: >-
      Completed years lived by the younger borrower at the governed data cut-off
      date, calculated only where the lender does not supply an age.
