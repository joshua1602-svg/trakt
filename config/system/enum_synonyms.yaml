# ---------------------------------------------------------------------------
# Relocated from the Annex 2 delivery rules (contract migration)
# ---------------------------------------------------------------------------
# SOURCE VOCABULARY: a lender's word for a value the regulator names with a
# code. These sat in the regime rules beside 167 identity pass-throughs of
# codes the XSD already enumerates. The pass-throughs are the schema's own
# business and are gone; the part that is genuinely a translation belongs
# here, where every other source-word mapping lives.
#
# Nothing here can widen the regulator's vocabulary: a target the schema's own
# enumeration does not contain is dropped when the contract is built.

