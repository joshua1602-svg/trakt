      approved external index source, series, geography mapping and base date
      have been configured. It is never simulated and never defaults.
    asset_classes: [cross_asset]
    evaluator: external_index_ratio
    unit: percent
    output_precision: 2
    supported_operators: [max, min]
    aggregation: ratio
    numerator: Index value at the reporting date.
    denominator_options: [reference_index_value]
    required_roles: []
    parameters:
      index_source:
        type: string
        required: true
        description: Approved external index source identifier.
      index_series:
        type: string
        required: true
        description: Series within the source (e.g. UK all-property NSA).
      geography_mapping:
        type: string
        required: false
        description: How portfolio geography maps to index geography.
      reference_date:
        type: date
        required: true
        description: The base / closing date the ratio is measured against.
    aliases: [house price index, hpi, index ratio, hpi decline, index change,
              current hpi divided by]
    composable: false
    implementation_status: interface_only
    version: "1.0"

  # ------------------------------------------------------------- J. Primitives
  # The generic reusable primitives are the evaluators themselves
  # (share_of_balance, share_of_balance_numeric, weighted_average, field_average,
  # field_maximum, field_minimum, top_n_share, largest_group_share,
  # distinct_group_count, max_count_per_group, multi_loan_borrower_share,
  # dimension_share). Composition happens by parameterising a registered
  # metric — combined categories through list parameters, filtered populations
  # through segment_filters — and stays governed: there is deliberately no
  # metric whose parameters accept an expression or formula.
  - metric_id: primitive_filtered_share
    canonical_name: filtered_balance_share
    display_name: Filtered exposure share
    category: primitive
    description: >-
      Governed composition primitive: balance share of loans matching a set of
      approved field filters (categorical values and/or numeric ranges). Used
      by the review workflow to compose tests that have no narrower metric;
      every filter names a governed field role — arbitrary expressions are
      rejected at validation.
    asset_classes: [cross_asset]
    evaluator: filtered_share
    unit: percent
    output_precision: 2
    supported_operators: [max, min]
    aggregation: sum
    numerator: Sum of balance for loans matching every filter.
    denominator_options: *denominators
    required_roles: [balance_current]
    parameters:
      filters:
        type: filter_list
        required: true
        description: >-
          List of {role, values} or {role, min, max} filters over governed
          field roles.
      denominator:
        type: enum
        values: [current_balance, original_balance]
        default: current_balance
    aliases: []
    composable: true
    implementation_status: implemented
    version: "1.0"
