# config_client_ERE.yaml
# LAYER 3: MASTER CLIENT CONFIG
#
# WHO THIS FILE IS FOR, AND WHY IT IS NAMED WHAT IT IS NAMED.
#
# ERE is a CLIENT — ERE Funding, the lender. ERM is an ASSET — equity release
# mortgages, the product. They are different layers of the configuration
# hierarchy (system < regime < asset < client < portfolio < approved run
# decisions), and this file is the client one.
#
# It used to be called `config_client_ERM_UK.yaml`, which named it after the
# asset, and the consequences were not cosmetic. `mi_agent_api.currency`
# locates a client's governed configuration at
# `config/client/config_client_{client_id}.yaml`; the live portfolio
# `ERE/2026-06-30` therefore looked under `ERE`, found nothing, and every
# client-layer fact — base currency, asset class, and with it the MI geography
# basis — came back "unconfigured" for the one client the platform actually
# runs. Nothing was wrong with the lookup. The file was misnamed, so it is
# renamed rather than aliased: an alias would have left two names for one
# client and taught the estate that either would do.
#
# WHAT BELONGS HERE, AND WHAT DOES NOT. Facts about the LENDER: its identity
# and LEI, the currency it reports in, the regimes it is in scope for, its
# branding. Facts about the PRODUCT belong to the asset configuration
# (`config/asset/product_defaults_ERM.yaml`, which this client selects below by
# declaring its asset class) and are composed underneath this file by the
# effective-configuration resolver. A product fact restated here would be a
# second source able to drift from the pack.

client:
  client_id: ere_funding_uk
  display_name: "ERE Funding - Equity Release Mortgages"   # Used for UI/Reports only
  environment: production

portfolio:
  # WHICH ASSET CONFIGURATION THIS CLIENT RUNS ON. `equity_release` selects the
  # ERM pack (`config/asset/product_defaults_ERM.yaml`, which declares
  # `asset_class: equity_release`), and the effective-configuration resolver
  # composes that pack UNDER this file: the asset says what the product does by
  # default, the client overrides only what is genuinely its own.
  #
  # This one key is the whole declaration. The class is deliberately not
  # restated anywhere else in this file, and the pack is deliberately not named
  # here by path: `operations_control.configuration.packages.ASSET_MODEL` maps
  # the class onto its pack, so a book changing asset class changes one value.
  #
  # It is an OCC standing field (`config/onboarding/field_catalogue.yaml`
  # writes it to `client_config:portfolio.asset_class`), operator-confirmed at
  # onboarding, which is why it is the fact the rest of the estate reads.
  asset_class: equity_release
  country: GB
  base_currency: GBP
  static_reporting_date: "2025-11-30"

# default_regime = client default preference for regulatory output.
default_regime: ESMA_Annex2
# supported_regimes = client capability set.
supported_regimes:
  - ESMA_Annex2
  - ESMA_Annex12
# Legacy field retained for backward compatibility.
regime: ESMA_Annex2

# ESMA Annex 2 geography policy: deliver GBZZZ for UK obligor/collateral
# (RREL11/RREC6); granular ITL3 is retained in canonical geographic_region_*_itl3
# fields for FCA/UK reporting + MI drilldown. RREL12 (classification year) is
# protected from this override.
regime_overrides:
  ESMA_Annex2:
    uk_geography:
      enabled: true
      override_value: GBZZZ
      target_fields:
        - geographic_region_obligor
        - geographic_region_collateral

pipeline:
  loan_engine_enabled: false
  mi_enabled: true
  esma_enabled: true


pipeline_persistence:
  enabled: true
  local_output_dir: out_pipeline
  blob_subfolder: pipeline/latest
  write_manifest: true
  upload_to_blob: true
  require_blob_upload: false
  blob_container: outbound
  pipeline_input_path: null
  expected_funding_config_path: config/client/pipeline_expected_funding.yaml

loan_engine:
  day_count_convention: ACT365
  interest_payment_frequency: QUARTERLY
  prepayment_lockout_period_quarters: 2
  legal_maturity_months: 24
  penalty_interest_rate: 0.15
  reporting_date: "2025-11-30"
  ledger_db: "out/loan_ledger.db"
  payments_file: "input/payments.csv"

# --- DEFAULTS (CRITICAL CHANGE) ---
# These are moved here so the Projector injects them into the CSV rows.
defaults:
  # RREL83. The LEI itself — 20 characters, ISO 17442, and the shape auth.099
  # enforces. The value here used to carry the securitisation identifier's
  # "N<year><seq>" suffix, which the schema rejects; the regime rules then
  # mapped it back to the bare LEI to hide that. RREL1 still derives the
  # securitisation identifier from this LEI, so nothing else changes.
  originator_legal_entity_identifier: "213800ABCDE123456701"
  originator_name: "ERE Funding Limited"                            # RREL82
  originator_establishment_country: "GB"                            # RREL84

# --- TRANSFORMATIONS (Client Specific) ---
transformations:
  copy_if_missing:
    current_principal_balance: current_outstanding_balance

# --- ENRICHMENT (Client Specific) ---
enrichment:
  enable:
    uk_nuts3: true
  uk_nuts3:
    nuts_csv_path: "reference_data/uk_itl_master_lookup_v2.csv"
    postcode_columns: [postcode, property_postcode, property_post_code]
    # NUTS3 codes derived from postcode are COLLATERAL (property) geography,
    # not a classification year. (Previously mis-targeted classification.)
    target_field: geographic_region_collateral
    classification_year: 2021
    fill_only_if_blank: true
# NUTS classification YEAR used for the regulatory geographic region fields.
nuts_classification_year: 2021

# --- MI & DISPLAY ---
mi:
  branding:
    app_title: "Portfolio MI Dashboard"
    theme:
      primary_color: "#0B1F3B"
