# config_ERM_UK.yaml
# LAYER 3: MASTER CLIENT CONFIG

client:
  client_id: ere_funding_uk
  display_name: "ERE Funding - Equity Release Mortgages"   # Used for UI/Reports only
  environment: production

portfolio:
  asset_class: equity_release
  country: GB
  base_currency: GBP
  static_reporting_date: "2025-11-30"

# default_regime = client default preference for regulatory output.
default_regime: ESMA_Annex2
# supported_regimes = client capability set.
supported_regimes:
  - ESMA_Annex2
  - ESMA_Annex12
# Legacy field retained for backward compatibility.
regime: ESMA_Annex2

# ESMA Annex 2 geography policy: deliver GBZZZ for UK obligor/collateral
# (RREL11/RREC6); granular ITL3 is retained in canonical geographic_region_*_itl3
# fields for FCA/UK reporting + MI drilldown. RREL12 (classification year) is
# protected from this override.
regime_overrides:
  ESMA_Annex2:
    uk_geography:
      enabled: true
      override_value: GBZZZ
      target_fields:
        - geographic_region_obligor
        - geographic_region_collateral

pipeline:
  loan_engine_enabled: false
  mi_enabled: true
  esma_enabled: true


pipeline_persistence:
  enabled: true
  local_output_dir: out_pipeline
  blob_subfolder: pipeline/latest
  write_manifest: true
  upload_to_blob: true
  require_blob_upload: false
  blob_container: outbound
  pipeline_input_path: null
  expected_funding_config_path: config/client/pipeline_expected_funding.yaml

loan_engine:
  day_count_convention: ACT365
  interest_payment_frequency: QUARTERLY
  prepayment_lockout_period_quarters: 2
  legal_maturity_months: 24
  penalty_interest_rate: 0.15
  reporting_date: "2025-11-30"
  ledger_db: "out/loan_ledger.db"
  payments_file: "input/payments.csv"

# --- DEFAULTS (CRITICAL CHANGE) ---
# These are moved here so the Projector injects them into the CSV rows.
defaults:
  # RREL83. The LEI itself — 20 characters, ISO 17442, and the shape auth.099
  # enforces. The value here used to carry the securitisation identifier's
  # "N<year><seq>" suffix, which the schema rejects; the regime rules then
  # mapped it back to the bare LEI to hide that. RREL1 still derives the
  # securitisation identifier from this LEI, so nothing else changes.
  originator_legal_entity_identifier: "213800ABCDE123456701"
  originator_name: "ERE Funding Limited"                            # RREL82
  originator_establishment_country: "GB"                            # RREL84

# --- APPROVED MAPPING CONTRACT (Client Specific) ---
# Which source column means which canonical field is decided ONCE, during
# onboarding, by the mapping model and a human operator, and recorded by the
# Operations Control Centre as 12_approved_mapping_overrides.yaml. For the books
# below that decision is the mapping authority: a run without it is refused
# rather than falling back to alias and fuzzy header matching, because falling
# back is what silently remapped four separate product concepts onto two
# canonical fields.
#
# Other clients are unaffected: with no `mapping` block, nothing is required and
# Gate 1 behaves exactly as before.
mapping:
  require_approved_contract: true
  # Scope the requirement to the books that have been through OCC approval.
  # Remove the list to require an approved contract for every portfolio.
  approved_contract_portfolios:
    - direct_001
    - acquired_001

# --- PORTFOLIO DEFAULTS (fill-if-missing, per source portfolio) ---
# A fact about ONE book, not about the client. The acquired portfolio was bought
# as a whole and the seller's extract carries no origination-channel column: the
# channel for every loan in it is the portfolio itself. Stated here so the value
# is a governed configuration decision with its own provenance
# (value_origin: portfolio_default), never a literal in code and never confused
# with a channel the lender actually reported.
#
# A mapped source value ALWAYS wins; this only fills blanks. Onboarding
# acquired_002 is one more entry here and no code change.
portfolio_defaults:
  acquired_001:
    broker_channel: Acquired_001

# --- TRANSFORMATIONS (Client Specific) ---
transformations:
  copy_if_missing:
    current_principal_balance: current_outstanding_balance

  # Source VALUE normalisation — not a header-mapping decision. This client's
  # policy administration system writes "Inforce" for a live policy; the
  # canonical account status for an active loan is "A". Recorded here, scoped to
  # this client, rather than in the shared enum library where it would speak for
  # every lender.
  #
  # "D" is deliberately absent: its meaning on this book has not been confirmed,
  # and a status is not a field to guess at. It stays unnormalised and visible.
  canonical_enum_normalization:
    account_status:
      Inforce: A
      A: A

# --- ENRICHMENT (Client Specific) ---
enrichment:
  enable:
    uk_nuts3: true
  uk_nuts3:
    nuts_csv_path: "reference_data/uk_itl_master_lookup_v2.csv"
    postcode_columns: [postcode, property_postcode, property_post_code]
    # NUTS3 codes derived from postcode are COLLATERAL (property) geography,
    # not a classification year. (Previously mis-targeted classification.)
    target_field: geographic_region_collateral
    classification_year: 2021
    fill_only_if_blank: true
# NUTS classification YEAR used for the regulatory geographic region fields.
nuts_classification_year: 2021

# --- MI & DISPLAY ---
mi:
  branding:
    app_title: "Portfolio MI Dashboard"
    theme:
      primary_color: "#0B1F3B"
