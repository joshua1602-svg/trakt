static_pools:
  charts:
    - title: "Origination Quality: LTV by Cohort"
      metric: "current_ltv"
      agg: "mean"
      y_axis_label: "Weighted Avg LTV (%)"
    - title: "Pricing Discipline: Yield by Cohort"
      metric: "interest_rate"
      agg: "mean"
      y_axis_label: "Coupon (%)"
    # Sprint 2.5C: was titled "Prepayment Speed (CPR)". The spec below sums an
    # AMOUNT in pounds; CPR is an annualised rate. The title claimed a
    # methodology that did not exist behind it. Renamed to what it actually
    # shows. Genuine SMM/CPR is analytics_lib.history.prepayment_rate, exposed
    # by the prepayment_analysis tool.
    - title: "Cumulative Redemptions by Cohort"
      metric: "prepayment_amount"
      agg: "sum"
      y_axis_label: "Cumulative Redemptions (£)"