# product_defaults_ERM.yaml
# LAYER 2: ASSET CLASS STANDARD
# Universal defaults for UK Equity Release Mortgages.
# These apply to ALL clients unless specifically overridden in Layer 3.

# Asset class key — used to select the asset-specific registry applicability
# layer (e.g. fields_registry maturity_date.applicability.equity_release).
asset_class: equity_release

defaults:
  # --- 1. Core Product Structure ---
  amortisation_type: Bullet           # ERMs roll up; they do not amortise
  repayment_type: Bullet              # Repayment occurs at death/sale
  interest_rate_type: Fixed           # Vast majority of ERM back-books are Fixed
  payment_frequency: ND2              # Borrower makes NO payments
  recourse: N                         # NNEG (No Negative Equity Guarantee) is standard
  loan_seniority: Senior              # Always 1st Lien
  
  # --- 2. Property & Borrower Characteristics ---
  property_occupancy_type: Owner-occupied
  original_valuation_method: FIEI    # Standard full appraial for origination

  # RREC8. A UK lifetime mortgage is advanced against a FIRST legal charge on
  # the borrower's own home — the no-negative-equity guarantee and the FCA's
  # MCOB rules for lifetime mortgages both assume it, and a second-charge
  # lifetime mortgage is not a product that exists in this market. The highest
  # lien position held by the originator is therefore always 1. Relocated here
  # from the regime layer, where it applied to every residential portfolio of
  # any product.
  lien: 1

  # RREC5. The primary asset securing a lifetime mortgage is the borrower's
  # residential dwelling; that is what the product IS. A lender that supplies a
  # collateral type still wins — this only fills a blank.
  collateral_type: RBLD
  
  # --- 3. Currency ---
  exposure_currency_denomination: GBP
  currency_of_financials: GBP

nd_defaults:
# --- 4. Income & Affordability (ND1) ---
  # NEW: Explicitly stating these are not required for ERM underwriting
  employment_status: ND1                  # RREL13
  primary_income: ND1                     # RREL16
  primary_income_type: ND1                # RREL17
  primary_income_currency: ND1            # RREL18
  primary_income_verification: ND1        # RREL19
  # RREL20/RREL21. Equity-release loans commonly have JOINT BORROWERS, so a
  # secondary obligor usually exists — the code is NOT about borrower absence.
  # Borrower income is simply not part of equity-release underwriting (age,
  # property value and LTV are), so the data is not collected because the
  # underwriting criteria do not require it: exactly ND1. Matches the whole
  # income family above, and RREL20/RREL21 permit ND1 in the field universe.
  secondary_income: ND1                   # RREL20
  secondary_income_verification: ND1      # RREL21
  debt_to_income_ratio: ND5               # RREL40 — DTI not captured for ERM (see reporting_policy.nd_policy)

  # --- 5. The "Not Applicable" Safety Net (ND2) ---
  # These fields exist in ESMA but are irrelevant for ERM
  maturity_date: ND5                         # No fixed term
  # RREL25. "Original contractual term (number of months) at the origination
  # date." A lifetime mortgage has none: it runs until death or the sale of the
  # home. The same product truth as the maturity date above, and the reason the
  # regime's months-between-dates derivation cannot answer it — there is no end
  # date to count to.
  original_term: ND5
  scheduled_principal_payment_frequency: ND5 # No payments
  scheduled_interest_payment_frequency: ND5  # No payments
  current_interest_rate_margin: ND5          # Fixed rate, no margin
  interest_rate_reset_interval: ND5          # Fixed rate

  # --- 5b. Relocated from client configuration (ownership refactor) ---
  # These follow from what a lifetime mortgage IS, not from who originated it or
  # which system the tape came out of, so they belong to the asset class and are
  # declared once here instead of by every client. Previously each of these sat
  # in a client config, where a second lender writing the same product would
  # have had to restate them — and could have restated them differently.
  principal_grace_period_end_date: ND5       # Interest capitalises; no grace period
  current_interest_rate_index: ND5           # Fixed for life; no reference index
  current_interest_rate_index_tenor: ND5     # No index, therefore no tenor
  interest_rate_cap: ND5                     # Fixed rate; no cap
  interest_rate_floor: ND5                   # Fixed rate; no floor
  deposit_amount: ND5                        # No deposit is taken on a lifetime mortgage
  next_interest_rate_reset_date: ND5         # Fixed rate

  # --- 5c. The interest-revision family (relocated from the regime layer) ---
  # A lifetime mortgage is fixed for life: there is no contractual revision of
  # the margin or the reference index, so none of the revision fields applies.
  # This is the same product truth already stated above for the current index,
  # its tenor, the cap, the floor and the reset date — the revision fields were
  # simply left behind in the regime rules, where they were asserted for every
  # residential portfolio regardless of product, and inconsistently (ND1 for the
  # first two revisions, ND5 for the third).
  revision_margin_1: ND5                     # RREL50
  interest_revision_date_1: ND5              # RREL51
  revision_margin_2: ND5                     # RREL52
  interest_revision_date_2: ND5              # RREL53
  revision_margin_3: ND5                     # RREL54
  interest_revision_date_3: ND5              # RREL55
  revised_interest_rate_index: ND5           # RREL56
  revised_interest_rate_index_tenor: ND5     # RREL57
  
  # --- 5. Data Gaps (ND5) ---
  # Safe defaults for optional fields likely missing from older tapes
  energy_performance_certificate_value: ND5
  syndicated_portion: ND5

# --------------------------------------------------------------------------- #
# ASSET REPORTING POLICY LAYER (consumed by the Onboarding target-field
# disposition / completion checklist). This is the ASSET-specific policy — it is
# NOT generic Annex 2 regime logic and must not be hard-coded into the engine.
# A client/lender policy file (e.g. config/client/client_001_reporting_policy.yaml)
# may override these with the same structure under `reporting_policy:`.
# --------------------------------------------------------------------------- #
reporting_policy:
  # Formal regulatory identifiers that are NOT expected in an ordinary loan tape
  # and must be obtained during formal client onboarding (canonical field names).
  formal_client_onboarding_required:
    - unique_identifier                        # RREL1 ScrtstnIdr
    - original_underlying_exposure_identifier  # RREL2 OrgnlUndrlygXpsrIdr

  # ND/default reporting policy explicitly SELECTED for this asset class. These
  # express "ND selected", not merely "ND allowed". For UK equity release the
  # borrower income / DTI is not captured and is not a relevant metric.
  nd_policy:
    debt_to_income_ratio: ND5                  # RREL40 — DTI not captured for ERM
    maturity_date: ND5                         # RREL24 — lifetime mortgage, no fixed term

  # Fields explicitly not applicable to this asset class (excluded from delivery).
  not_applicable: []

  # ASSET-SPECIFIC ENUM OVERRIDES. These take precedence over the GENERIC Annex 2
  # enum map — which the effective contract derives from the auth.099 schema's own
  # enumeration plus config/system/enum_mapping.yaml and enum_synonyms.yaml — for
  # THIS asset class only.
  # Keyed by canonical field; each maps a source label -> the ESMA code that this
  # asset class must report. This is a deliberate, documented policy decision —
  # not a global synonym — applied by the Projection Agent as a config-driven
  # override (no enum value is hard-coded in Python).
  #
  # Rationale (amortisation_type): a UK equity release / lifetime mortgage rolls
  # up interest and repays at death/sale. The internal tape labels this "Bullet",
  # but it is NOT a scheduled bullet amortisation under the Annex 2 definition
  # (RREL35 BLLT = "full principal repaid in the LAST instalment" of a schedule).
  # The correct regulatory reporting value for this product is therefore OTHR.
  # Generic (non-ERM) portfolios still map Bullet -> BLLT via the generic enum map.
  # If product/legal review later confirms a genuine scheduled bullet, change the
  # target here to BLLT (or remove the override).
  enum_overrides:
    amortisation_type:
      Bullet: OTHR
      "Interest roll-up": OTHR
# ---------------------------------------------------------------------------
# EQUIVALENT-FIELD FILL (transformations.copy_if_missing)
# ---------------------------------------------------------------------------
# {target: source} — a target canonical field is filled from the named source
# field where the target is blank and the source is populated. Applied by the
# Transformation Agent (Gate 2) AFTER typing and defaults; a real source value
# for the target always wins, and nothing is copied when the source column is
# itself absent, so the core_canonical contract still catches a tape carrying
# neither field.
#
# Rationale (current_principal_balance): a UK equity release / lifetime mortgage
# rolls interest up and repays at death or sale. The lender therefore reports a
# SINGLE balance — the current outstanding balance, inclusive of rolled-up
# interest — and no principal-only split exists to report. That outstanding
# balance IS the principal exposure for this product, so the registry's
# core_canonical `current_principal_balance` is satisfied from it rather than
# being reported absent. MI weights exposure by current_outstanding_balance,
# which is unaffected: this fills the regulatory concept, it does not redefine
# the analytic one.
#
# This key has been declared in the estate's client configuration layer since
# inception (config/client/config_client_*.yaml) but had no implementation, so
# the relationship it states was never actually applied. It is declared HERE
# because it is an asset-class truth, not a per-client preference.
transformations:
  copy_if_missing:
    current_principal_balance: current_outstanding_balance
