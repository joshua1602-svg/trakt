# Business-semantic MI question bank.
#
# These are deliberately NOT direct field lookups ("what is LTV in London").
# Each one asks a question a credit / treasury / IC audience actually asks: it
# names a business CONCEPT (concentration, headroom, credit quality, run-rate,
# mix shift, diversification, stress, eligibility, vintage performance) and
# leaves the agent to decide which governed measure, dimension, period and
# route express it.
#
# `observed` records what the agent actually returned when this bank was run
# against the synthetic demo_platform book (11,035 loans, £1.96bn, three
# month-end snapshots 2026-04 / 2026-05 / 2026-06) through the SAME governed
# entrypoint React and Copilot use — mi_service.execute_governed_mi_query —
# with the deterministic parser (no ANTHROPIC_API_KEY configured).
#
# Reproduce with:
#     python -m demo_platform.run_demo --generate --orchestrate
#     python scripts/run_mi_capability_review.py --out out/mi_capability_review
#
# grade values:
#   correct              — answered the question asked, with the right numbers
#   partial              — right machinery, but a stated facet was dropped or
#                          re-interpreted without saying so
#   silently_wrong       — ok=true and a confident answer to a DIFFERENT question
#   controlled_refusal   — ok=false with an honest, specific reason (the target
#                          behaviour when a concept is not in the dataset)
#   unhelpful_failure    — ok=false but the reason given does not identify what
#                          could not be resolved

version: 1
dataset: demo_platform (synthetic — Alderbridge Lending Platform)
parser: deterministic (MI_AGENT_LLM_PARSER unset, no ANTHROPIC_API_KEY)
entrypoint: mi_agent_api.mi_service.execute_governed_mi_query

# --------------------------------------------------------------------------- #
# Group A — the questions submitted for review
# --------------------------------------------------------------------------- #
submitted:
  - id: A1
    question: What is the average LTV, the average borrower age, the average borrower type in London?
    concept: multi-measure KPI within a named geographic scope
    expected: >-
      Three measures for the London segment only, or a controlled statement that
      "average borrower type" is not a measure. Loan count must be London's, not
      the whole book's.
    observed:
      ok: true
      answer: single KPI, average youngest-borrower age 71, loan count 11,035
      defects: [scope_filter_dropped, extra_measures_dropped, no_disclosure]
    grade: silently_wrong

  - id: A2a
    question: Which region has grown the most in the last month?
    concept: period-over-period growth ranked by dimension
    expected: regions ranked by balance movement between the two latest snapshots
    observed:
      ok: true
      route: geo_exposure
      answer: point-in-time largest concentration (Westminster & City of London, £83.4m)
      defects: [growth_intent_replaced_with_concentration]
    grade: silently_wrong

  - id: A2b
    question: Which broker has grown the most in the last quarter?
    concept: period-over-period growth ranked by dimension
    expected: >-
      controlled refusal — broker_channel is not carried in this book — or a
      broker ranking where it is
    observed:
      ok: true
      route: period_change_analysis
      answer: generic metric-movement list; no broker dimension; "last quarter" compared as May->June
      defects: [dimension_dropped, period_reinterpreted]
    grade: silently_wrong

  - id: A2c
    question: Which product has grown the most in the last quarter?
    concept: period-over-period growth ranked by dimension
    observed:
      ok: true
      route: period_change_analysis
      defects: [dimension_dropped, period_reinterpreted]
    grade: silently_wrong

  - id: A2d
    question: Which borrower type has grown the most in the last month?
    concept: period-over-period growth ranked by dimension
    observed:
      ok: true
      route: period_change_analysis
      answer: balance movement +£18.1m for the whole book; no borrower-type split
      defects: [dimension_dropped]
    grade: partial

  - id: A3
    question: Show me balance by LTV by borrower type
    concept: two-dimensional stratification (cross-tab)
    expected: heatmap / cross-tab of balance over ltv_bucket x borrower_type
    observed:
      ok: true
      answer: single bar on amortisation_type — one row, "Interest roll-up", 100%
      defects: [both_requested_dimensions_dropped, unrelated_dimension_substituted]
    grade: silently_wrong

  - id: A4
    question: Show me balance by region by borrower type
    concept: two-dimensional stratification (cross-tab)
    observed:
      ok: true
      answer: single bar on collateral_geography; borrower type absent and not reported as rejected
      defects: [dimension_silently_dropped]
    grade: partial

  - id: A5
    question: Show me balance by borrower type by product
    concept: two-dimensional stratification (cross-tab)
    observed:
      ok: false
      answer: "The proposed query failed validation."
      defects: [reason_not_surfaced]
    grade: unhelpful_failure

  - id: A6
    question: Am I close to breaching any concentration limits?
    concept: headroom against the governing document's covenants
    observed:
      ok: true
      route: risk_limits
      answer: >-
        8 passed / 1 breach / 3 unavailable; nearest to limit named; 12-row table of
        test / actual / limit / headroom / status / movement, sourced from the
        Schedule 8 document
    grade: correct

  - id: A7
    question: Based on current origination, when will funded loans be £100MM?
    concept: run-rate extrapolation to a stated target
    expected: >-
      "£100m was passed at <date>" (the book is already £1.96bn) — the target value
      itself parses correctly
    observed:
      ok: false
      answer: "I couldn't map this question to a governed analytic"
      defects: [forecast_route_not_triggered]
    grade: unhelpful_failure

  - id: A8
    question: What is the average LTV of the direct book vs the acquired book?
    concept: cohort comparison across origination provenance
    observed:
      ok: true
      route: portfolio_risk_comparison
      answer: "Direct has higher observed Current Loan To Value than Acquired."
      artifact: Direct 43.35 vs Acquired 42.68
      defects: [numbers_absent_from_narrative]
    grade: partial

  - id: A9
    question: How has the average collateral value of the book changed since inception?
    concept: metric evolution across the full retained history
    expected: average current_valuation_amount at each of the three snapshots
    observed:
      ok: false
      route: period_change_analysis
      answer: "No governed field tagged for period-change analysis is available in both snapshots"
      defects: [inception_reduced_to_latest_pair, average_treated_as_sum_on_the_variant_phrasing]
    grade: unhelpful_failure

# --------------------------------------------------------------------------- #
# Group B — additional business-semantic questions
# --------------------------------------------------------------------------- #
