# HELD-OUT VARIANTS of the production bank (owner direction 2026-09-30:
# "you must not make local / tactical fixes just to pass the 135 bank. These
# MUST be supportive of other natural language variants"). P0 design §25.
#
# Each question asks for EXACTLY what the bank question it is a variant of
# asks, in other words: other verbs and nouns, other word order, instruction
# for question and question for instruction, contractions, synonyms a
# reader uses. So each has the same right answer as its bank question, and
# the same D13 bucket (`bucket`), and a variant that answers differently
# from its bank question is a finding against whatever the bank question
# was fixed with.
#
# RULES FOR THIS FILE
#   - Written 2026-09-30 after vocabulary 2.14.0 and normal form 1.1, and
#     not consulted while building either. Nothing in production may be
#     tuned against a row of it. `test_no_bank_question_is_in_the_models_
#     view.py` fails if any of these sentences reaches what the model sees.
#   - Once a finding from this file has been FIXED, the file has been used
#     to build with and is spent: the next proof needs variants written
#     after that fix (the same discipline as mi_agent/tests/
#     test_a_fresh_blind_holdout.py).
#   - Categories: `holdout_recent` = variants of the questions a definition,
#     rule or runtime change was made for since 2026-09-29 (the ones most at
#     risk of having been fitted); `holdout_must` / `holdout_nice` /
#     `holdout_decline` = the rest, by bucket.
#
# Run (the bank runner, with the canary's principal):
#   python -m mi_agent_api.question_bank \
#     --bank config/mi/golden_questions/holdout_variants_20260930.yaml \
#     --categories all --principal <allow-listed principal>
# Compare with the bank questions' answers from the same deploy:
#   python due_diligence/evidence/qb_plan_readback/score_variants.py \
#     --variants <variants.jsonl> --bank <bank.jsonl>
