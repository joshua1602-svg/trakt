# CONVERSATION BANK, FIRST SET (P0 design §34, D24). Drafted 2026-10-01,
# before the conversational agent is built: it is the build's specification
# and, once built, its proof — as D13's buckets are for single questions.
#
# 40 conversations, 98 follow-ups (every turn after the first). Groups:
#   A  one change per follow-up              14 conversations, 42 follow-ups
#   B  chains where changes pile up           5 conversations, 20 follow-ups
#   C  the agent asks back, the reply fills   6 conversations,  8 follow-ups
#   D  unclear follow-ups: ask, never guess   4 conversations,  6 follow-ups
#   E  must start fresh, not carry            5 conversations, 10 follow-ups
#   F  must refuse or not carry               6 conversations, 12 follow-ups
# 123 turns the model reads (run: live), 15 enforced in code (run: code).
# 27 twins are new (no bank_id): run them on their own first. cv_F04 was
# revised 2026-10-01 after fix 4 answered its twin ("Just the Offers" now
# carries; the refusal it tested moved to a closed stage).
#
# HOW A TURN IS SCORED — THE STAND-ALONE TWIN. Every follow-up that is
# answered has a twin: the same question asked in full, on its own. The
# follow-up passes when its governed plan and its figures are the twin's, and
# its answer states what it carried over. Nothing is scored by hand, and no
# golden figure is needed. A twin the agent declines on its own is declined
# the same way as a follow-up: a follow-up never answers something broader
# than its twin.
#
#   expect: answer    an opening question, answered as on its own
#           carry     read against the previous answer; matches its twin
#           ask_back  asks for the one missing detail; no figure
#           fill      the reply to an ask-back; matches its twin
#           fresh     carries nothing; matches its own stand-alone reading.
#                     notice: lapsed — the answer says earlier context lapsed
#           decline   declines in words with the reason; no figure
#
#   run:    live      the model reads it (costs a model call)
#           code      memory mechanics, enforced in code: tested without the
#                     model on every build; must pass 100%
#
#   twin.bank_id      the twin IS that production-bank question, word for
#                     word, so its stand-alone outcome is already measured.
#                     A twin with no bank_id is new: run the twins on their
#                     own first (one cheap pass) to record their outcomes.
#
# PASS MARK (D25): no wrong answer — every follow-up matches its twin or asks
# back — and every E (start fresh) and F (refuse) case passes. An unnecessary
# ask-back is a miss to fix, not a failure.
#
# READING CONVENTIONS THE TWINS ASSUME (settled: D24, D25):
#   * Memory is the previous answer only, plus an open ask-back, for 5
#     minutes idle counted from delivery of the agent's last answer or
#     question; it ends on a change of book or a cleared chat (D24).
#   * A complete question never inherits: only a message that cannot stand
#     alone is read against the previous answer (D24, owner 2026-10-01).
#   * A follow-up keeps everything from the previous answer except what it
#     changes. A new grouping ("by broker?", "and by stage?") REPLACES the
#     previous one; "split that further by" adds a second axis (D25).
#   * Narrowing to one value of the current grouping ("just the 75-80
#     band") filters to it, and the grouping on that same axis falls away.
#   * A declined follow-up does not replace the memory: the next follow-up
#     is read against the last answered plan (D25).
#   * D23 applies to follow-ups as to questions: "how many" is the count,
#     "how much" the amount.
#
# The rules every bank keeps: nothing may be tuned against a row; a fixed
# finding spends the file; `test_no_bank_question_is_in_the_models_view.py`
# keeps every sentence here out of what the model sees.
version: 1
client: ERE
memory_minutes: 5
conversations:

