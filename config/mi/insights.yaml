# =========================================================================
# Weekly Portfolio Brief — materiality thresholds (Phase 3A).
# =========================================================================
#
# The insight engine is deterministic: these thresholds are the ONLY thing that
# decides whether a change is worth telling someone about. They live here, not
# in the calculation layer, so a portfolio can be tuned without a code change
# and so the reason an insight did or did not appear is auditable.
#
# Every threshold is RELATIVE (a percentage, a percentage-point move, or a share
# of the book). None is an absolute currency amount: a £5m move is the whole
# story on a £50m book and noise on a £5bn one, so an absolute floor would make
# the brief useless at one end of the range and deafening at the other.
#
# Values are read through mi_agent_api/insight_config.py, which falls back to
# the same defaults if this file is missing or a key is absent — so a partial
# override is safe and the engine never fails closed on configuration.

version: 1

insights:

  # ---- Pipeline movement --------------------------------------------------
  # Two gates, EITHER of which qualifies. The percentage gate catches a large
  # relative move on a small book; the share gate catches a move that is large
  # against the book as a whole even when the percentage looks modest.
  pipeline_movement:
    min_change_pct: 2.0
    min_change_share_of_pipeline_pct: 2.0

  # ---- Ticket size --------------------------------------------------------
  # Mean and median are reported together and gated independently: a mean that
  # moves while the median does not is a tail effect, which is worth surfacing
  # precisely because the two disagree.
  ticket_size:
    min_average_change_pct: 5.0
    min_median_change_pct: 5.0
    # Below this many cases the mean and median are both unstable week to week.
    min_case_count: 20

  # ---- Weighted-average LTV ----------------------------------------------
  # Balance-weighted, never a straight average. Suppressed entirely when
  # coverage is thin, because a WA LTV over 60% of the book is not the book's.
  weighted_ltv:
    min_change_pp: 1.0
    min_coverage_pct: 90.0

  # ---- Mix shift ----------------------------------------------------------
  # Only the single most material band move per family is reported; a list of
  # every band that twitched is noise, not an insight.
  ticket_mix:
    min_share_change_pp: 5.0
  ltv_mix:
    min_share_change_pp: 5.0

  # ---- Completions --------------------------------------------------------
  # Weekly completion flow is far more volatile than pipeline stock, so the
  # gate is correspondingly higher.
  completions:
    min_change_pct: 10.0

  # ---- Conversion ---------------------------------------------------------
  # No prior-period comparison rate is published, so conversion cannot be
  # gated on movement. It is reported when the governed data itself says
  # something: a rate under a configured floor, or an insufficient window.
  # `minimum_acceptable_rate: null` disables the floor test.
  # `enabled: false` also skips resolving the origination funnel, which is 63%
  # of the brief's cold cost (measured: 3.5s of 5.6s on a 26-week root) and
  # exists solely to supply this one insight. Left on by default — the saving
  # is a deployment's decision, not a silent default.
  conversion:
    enabled: true
    minimum_acceptable_rate: null
    require_sufficient: true

  # ---- Concentration ------------------------------------------------------
  concentration:
    amber_utilisation_pct: 90.0
    red_utilisation_pct: 100.0
    forecast_horizon_weeks: 12

  # ---- Data quality -------------------------------------------------------
  # These gate the CREDIBILITY of everything above. A high dimension
  # reassignment rate means the contributor attribution in the pipeline and
  # completion insights cannot be trusted, which is why it ranks near the top.
  data_quality:
    max_dimension_reassignment_pct: 5.0
    max_unknown_share_pct: 5.0
    max_unusable_id_share_pct: 1.0
    max_duplicate_id_share_pct: 1.0
    # When true, a clean week produces one explicit "no material issues"
    # object instead of silence, so the absence of a warning is a statement.
    emit_when_clean: false

  # =======================================================================
  # FUNDED (monthly)
  # =======================================================================
  # The monthly review had no materiality layer at all: the funded card stated
  # its figures unconditionally, so a £4k month and a £24m month produced the
  # same bullets. These are the gates that make a quiet month readable AS a
  # quiet month.
  #
  # Deliberately LOWER than the weekly gates. A funded book is a stock reported
  # monthly and moves less than a pipeline does in a week; reusing the weekly
  # numbers here would suppress months that are worth reading.

  # ---- Headline funded movement ------------------------------------------
  # One gate, not the pipeline's two. The pipeline's second gate measures the
  # change against the STOCK because the change is a flow into it; for a book
  # measured against its own opening balance the two gates are one number.
  funded_movement:
    min_change_pct: 1.0

  # ---- Composition -------------------------------------------------------
  # `min_component_share_of_gross_pct` decides which components are worth
  # NAMING; the full decomposition is always carried and always reconciles, so
  # this suppresses a sentence, never a number.
  #
  # `dominant_addition_share_pct` is the share of the MOVEMENT an added
  # portfolio must account for before the review leads with it. Share of the
  # movement rather than of the book, because the question is whether the
  # period is explained by the addition — not whether the addition is large.
  funded_composition:
    min_component_share_of_gross_pct: 5.0
    dominant_addition_share_pct: 50.0

  # ---- Portfolio mix -----------------------------------------------------
  # One gate for every governed dimension — product, geography, LTV band,
  # borrower age band, borrower structure, vintage, source portfolio. They are
  # the same question asked of different columns and a threshold each would be
  # six numbers nobody could keep consistent.
  funded_mix:
    min_share_change_pp: 3.0

  # ---- Weighted-average LTV ----------------------------------------------
  # Tighter than the weekly pipeline gate (1.0pp): a funded book's WA LTV moves
  # with amortisation and valuation rather than with which cases arrived, so a
  # half-point month-on-month move is already a real change in the book.
  funded_ltv:
    min_change_pp: 0.5

  # ---- Risk-limit transitions --------------------------------------------
  # NOT a threshold, and deliberately the only key here. The statuses, the
  # limits and the transitions between them belong to the operator-approved
  # concentration configuration; a threshold in this file would be a second
  # risk framework quietly disagreeing with the first. All this decides is
  # whether an IMPROVEMENT earns a card — and it does, because a review that
  # only ever delivers bad news teaches its reader that silence means nothing
  # happened.
  risk_limit_transition:
    report_improvements: true

# ---- Brief-level limits ---------------------------------------------------
brief:
  max_insights: 8
  max_per_type:
    CONCENTRATION_PROXIMITY: 2
    DATA_QUALITY: 1
    TICKET_SIZE: 1
    WEIGHTED_LTV: 1
    TICKET_MIX_SHIFT: 1
    LTV_MIX_SHIFT: 1
    PIPELINE_MOVEMENT: 1
    COMPLETIONS_MOVEMENT: 1
    CONVERSION_CONTEXT: 1

# ---- Monthly brief limits -------------------------------------------------
# Richer than the weekly brief because the month is. More risk transitions
# above all: a month can cross several limits, and reporting three of four
# would be the omission a reader most needs not to have.
funded_brief:
  max_insights: 12
  max_per_type:
    RISK_LIMIT_TRANSITION: 4
    CONCENTRATION_PROXIMITY: 2
    FUNDED_COMPOSITION: 1
    FUNDED_MOVEMENT: 1
    UNDERLYING_BOOK_MOVEMENT: 1
    FUNDED_LTV_MOVEMENT: 1
    FUNDED_MIX_SHIFT: 3
