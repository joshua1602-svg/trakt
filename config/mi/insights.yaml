# =========================================================================
# Weekly Portfolio Brief — materiality thresholds (Phase 3A).
# =========================================================================
#
# The insight engine is deterministic: these thresholds are the ONLY thing that
# decides whether a change is worth telling someone about. They live here, not
# in the calculation layer, so a portfolio can be tuned without a code change
# and so the reason an insight did or did not appear is auditable.
#
# Every threshold is RELATIVE (a percentage, a percentage-point move, or a share
# of the book). None is an absolute currency amount: a £5m move is the whole
# story on a £50m book and noise on a £5bn one, so an absolute floor would make
# the brief useless at one end of the range and deafening at the other.
#
# Values are read through mi_agent_api/insight_config.py, which falls back to
# the same defaults if this file is missing or a key is absent — so a partial
# override is safe and the engine never fails closed on configuration.

version: 1

insights:

  # ---- Pipeline movement --------------------------------------------------
  # Two gates, EITHER of which qualifies. The percentage gate catches a large
  # relative move on a small book; the share gate catches a move that is large
  # against the book as a whole even when the percentage looks modest.
  pipeline_movement:
    min_change_pct: 2.0
    min_change_share_of_pipeline_pct: 2.0

  # ---- Ticket size --------------------------------------------------------
  # Mean and median are reported together and gated independently: a mean that
  # moves while the median does not is a tail effect, which is worth surfacing
  # precisely because the two disagree.
  ticket_size:
    min_average_change_pct: 5.0
    min_median_change_pct: 5.0
    # Below this many cases the mean and median are both unstable week to week.
    min_case_count: 20

  # ---- Weighted-average LTV ----------------------------------------------
  # Balance-weighted, never a straight average. Suppressed entirely when
  # coverage is thin, because a WA LTV over 60% of the book is not the book's.
  weighted_ltv:
    min_change_pp: 1.0
    min_coverage_pct: 90.0

  # ---- Mix shift ----------------------------------------------------------
  # Only the single most material band move per family is reported; a list of
  # every band that twitched is noise, not an insight.
  ticket_mix:
    min_share_change_pp: 5.0
  ltv_mix:
    min_share_change_pp: 5.0

  # ---- Completions --------------------------------------------------------
  # Weekly completion flow is far more volatile than pipeline stock, so the
  # gate is correspondingly higher.
  completions:
    min_change_pct: 10.0

  # ---- Conversion ---------------------------------------------------------
  # No prior-period comparison rate is published, so conversion cannot be
  # gated on movement. It is reported when the governed data itself says
  # something: a rate under a configured floor, or an insufficient window.
  # `minimum_acceptable_rate: null` disables the floor test.
  # `enabled: false` also skips resolving the origination funnel, which is 63%
  # of the brief's cold cost (measured: 3.5s of 5.6s on a 26-week root) and
  # exists solely to supply this one insight. Left on by default — the saving
  # is a deployment's decision, not a silent default.
  conversion:
    enabled: true
    minimum_acceptable_rate: null
    require_sufficient: true

  # ---- Concentration ------------------------------------------------------
  concentration:
    amber_utilisation_pct: 90.0
    red_utilisation_pct: 100.0
    forecast_horizon_weeks: 12

  # ---- Data quality -------------------------------------------------------
  # These gate the CREDIBILITY of everything above. A high dimension
  # reassignment rate means the contributor attribution in the pipeline and
  # completion insights cannot be trusted, which is why it ranks near the top.
  data_quality:
    max_dimension_reassignment_pct: 5.0
    max_unknown_share_pct: 5.0
    max_unusable_id_share_pct: 1.0
    max_duplicate_id_share_pct: 1.0
    # When true, a clean week produces one explicit "no material issues"
    # object instead of silence, so the absence of a warning is a statement.
    emit_when_clean: false

  # =======================================================================
  # Funded material change
  # =======================================================================
  # Everything above describes one week of the PIPELINE extract. Everything
  # below describes the movement between two governed FUNDED snapshots.
  #
  # The period-change workflow states, in its own output, that it has no
  # materiality rule: "No governed materiality threshold is configured for this
  # portfolio, so movements are ranked by observed size only ... No movement is
  # described as material, significant, a breach or high risk." The keys below
  # ARE that configured rule. They are the only reason a funded movement is
  # ever called material, and they live here so that reason is auditable and
  # tunable without a code change — exactly as for the pipeline sections.
  #
  # The no-absolute-currency rule above applies here unchanged. A funded book
  # spans a wider range than a pipeline does, not a narrower one, so a currency
  # floor would be worse here, not more defensible.

  # ---- Funded measure movement -------------------------------------------
  # Two gates, chosen by the measure's own unit of measurement rather than by
  # its name. A currency or count measure is gated on its relative move; a
  # percentage-point measure is gated on the points it moved, because 2% of a
  # 62% weighted-average LTV is 1.2 points and reads as a far smaller change
  # than it is.
  funded_metric_movement:
    min_relative_change_pct: 2.0
    min_change_pp: 1.0
    # A movement the governed directionality calls a deterioration is raised
    # from "attention" to "concern" above these. An improvement is never
    # escalated: a book improving quickly is not a concern.
    concern_relative_change_pct: 10.0
    concern_change_pp: 5.0

  # ---- Funded composition -------------------------------------------------
  # Only the categories the workflow itself ranked as the largest increase and
  # the largest decrease are considered; this gate then decides whether either
  # is worth reporting. The ranking is the workflow's, not this file's.
  funded_composition:
    min_share_change_pp: 5.0
    max_categories_reported: 2

  # ---- Funded attribution -------------------------------------------------
  # The balance bridge is an explanation of a movement, so it is reported only
  # where the movement it explains was itself material — there is no separate
  # size gate, because an immaterial movement's decomposition is immaterial by
  # construction.
  funded_attribution:
    # A bridge that does not reconcile to its own closing balance within its
    # documented rounding tolerance is reported as a limitation, never as an
    # explanation.
    require_reconciliation: true

  # ---- Limit and concentration status transitions -------------------------
  # A status transition needs no size gate: the threshold was already applied
  # by the configured test, and the status changing IS the finding.
  funded_limits:
    # A test that recovered is still a governed status change. Reported at
    # "info" so a recovery is visible, not only a deterioration.
    report_improvements: true

  # ---- Funded brief behaviour ---------------------------------------------
  funded_brief:
    # When true, a period in which nothing crossed a threshold produces one
    # explicit statement saying so, naming what was examined and against which
    # thresholds. Silence and "nothing happened" must not look the same.
    emit_quiet_period: true

# ---- Brief-level limits ---------------------------------------------------
brief:
  max_insights: 8
  max_per_type:
    CONCENTRATION_PROXIMITY: 2
    LIMIT_STATUS_TRANSITION: 3
    DATA_QUALITY: 1
    FUNDED_BALANCE_MOVEMENT: 1
    FUNDED_BALANCE_ATTRIBUTION: 1
    FUNDED_METRIC_MOVEMENT: 3
    FUNDED_COMPOSITION_SHIFT: 2
    FUNDED_QUIET_PERIOD: 1
    TICKET_SIZE: 1
    WEIGHTED_LTV: 1
    TICKET_MIX_SHIFT: 1
    LTV_MIX_SHIFT: 1
    PIPELINE_MOVEMENT: 1
    COMPLETIONS_MOVEMENT: 1
    CONVERSION_CONTEXT: 1
