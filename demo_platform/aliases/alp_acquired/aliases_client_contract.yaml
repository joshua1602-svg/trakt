# Approved onboarding contract — client alias overlay
# ---------------------------------------------------
# Portfolio:  ALP_ACQUIRED  (alp_acquired, acquired)
# Client:     Alderbridge Lending Platform  [SYNTHETIC DEMONSTRATION DATA]
#
# This portfolio is an acquired back book serviced by a third-party servicer, so
# the extract arrives in the SERVICER's vocabulary — a genuinely different
# schema from the origination extract. The Onboarding Agent resolved both into
# the same canonical model; this file is the acquired book's half of that
# contract.
#
# Scoped to this portfolio only (`--extra-aliases-dir`); the global mapper is
# untouched.

loan_identifier:
  aliases:
    - Account Number
  note: >-
    The servicer's account number is the stable loan key for this book. Resolved
    here rather than globally because "Account Number" means a KFI/pipeline
    application key in the global onboarding aliases.

current_principal_balance:
  aliases:
    - Principal Outstanding
  note: >-
    Capital plus capitalised roll-up interest at the reporting date. The
    transform derives current_outstanding_balance from this (accrued interest is
    nil on this book — interest is capitalised monthly, not accrued separately).

current_valuation_amount:
  aliases:
    - Indexed Valuation
  note: >-
    Servicer-indexed property valuation at the reporting date (original
    valuation rolled forward on a regional index). Confirmed at onboarding as
    the current valuation basis for current LTV.

original_valuation_amount:
  aliases:
    - Valuation At Origination
  note: The vendor's valuation at completion, used for original LTV.

original_principal_balance:
  aliases:
    - Initial Drawdown
  note: >-
    Initial advance at completion under the servicer's naming. This book has no
    drawdown facilities, so initial drawdown equals the original principal.

origination_date:
  aliases:
    - Origination
  note: Bare "Origination" is the completion date in the servicer's schema.

youngest_borrower_age:
  aliases:
    - Youngest Borrower
  note: >-
    The servicer reports the youngest life's age directly, matching the Trakt
    canonical definition with no transformation required.

collateral_geography:
  aliases:
    - Geographic Classification
  note: >-
    Readable ITL1 region label in the servicer's vocabulary. Mapped to the
    analytics display field; regulatory NUTS codes are derived from the property
    postcode by the transform, exactly as for the origination book.

account_status:
  aliases:
    - Account State
  note: >-
    The servicer names the status column "Account State" where the lender's own
    system says "Loan Status". Resolved to the canonical account_status field;
    the values themselves are already on the canonical enumeration.

data_cut_off_date:
  aliases:
    - Reporting Cut-Off
  note: The servicer's extract date, confirmed as the month-end reporting date.

redemption_date:
  aliases:
    - Closure Date
  note: >-
    Date the account closed. Present only for redeemed accounts; confirmed at
    onboarding as the redemption date, not the maturity date.

interest_rate_type:
  aliases:
    - Rate Basis
  note: >-
    Referred for review at onboarding — "basis" can mean the rate type or the
    day-count basis. Confirmed with the client as the rate TYPE (fixed for life).

occupancy_type:
  aliases:
    - Occupancy
  note: >-
    Referred for review at onboarding (bare "Occupancy" did not resolve above the
    confidence threshold). Confirmed as the canonical occupancy type.

amortisation_type:
  aliases:
    - Repayment Profile
  note: >-
    The servicer describes the repayment mechanics rather than naming the
    amortisation type. Confirmed as interest roll-up (no contractual repayment
    before redemption), which is the canonical amortisation type for this product.

original_underlying_exposure_identifier:
  aliases:
    - Exposure ID
  note: Servicer exposure identifier. ESMA Annex 2 RREL2.

original_obligor_identifier:
  aliases:
    - Customer ID
  note: Servicer customer identifier. ESMA Annex 2 RREL4.

purpose:
  aliases:
    - Use Of Proceeds
  note: >-
    The servicer describes the use of proceeds rather than naming a purpose code.
    Confirmed against the canonical purpose enumeration (equity release, home
    improvement, refinance).

property_type:
  aliases:
    - Dwelling Type
  note: >-
    The servicer says "dwelling" where the canonical model says property. Not a
    global alias, so it needs the client contract. Pinned to property_type
    because that is the field the ESMA Annex 2 property-type code (RREC9) is
    built from, and a blank there blocks the regulatory submission.

# --- Regulatory-reporting block, in the SERVICER's vocabulary --------------
# The same Annex 2 exposure-level fields as the origination book, arriving under
# entirely different headers. Resolving both into one canonical model is what
# lets a single submission span the two portfolios.

maturity_date:
  aliases:
    - Contractual End Date
  note: >-
    The servicer's long-stop date for the account. Referred for review at
    onboarding, since "contractual end" could mean the fixed-rate end date;
    confirmed as the reported maturity (RREL24).

pool_addition_date:
  aliases:
    - Pool Entry Date
  note: >-
    Date the account entered the reported pool. For an acquired book that is the
    acquisition completion date, or the origination date where that is later
    (RREL7).

total_credit_limit:
  aliases:
    - Total Facility Limit
  note: >-
    Initial drawdown plus the reserve facility. On this book the reserve is
    actively drawn, so the limit and the balance move independently (RREL33).

new_collateral_identifier:
  aliases:
    - Collateral Reference
  note: The servicer's current collateral key (RREC4).

collateral_type:
  aliases:
    - Collateral Class
  note: Residential property on every account (RREC5).

origination_channel:
  aliases:
    - Introducer Type
  note: >-
    The servicer records how the account was introduced. This book was written
    through intermediaries (RREL26).

resident:
  aliases:
    - Residency Status
  note: Obligor residency relative to the collateral's country (RREL10).

credit_impaired_obligor:
  aliases:
    - Impaired At Origination
  note: >-
    The servicer's phrasing for the ESMA credit-impaired-obligor test (RREL14).

litigation:
  aliases:
    - Legal Proceedings
  note: Account subject to legal proceedings (RREL75).

payment_due:
  aliases:
    - Amount Due
  note: >-
    Referred for review at onboarding — "amount due" could mean the redemption
    amount. Confirmed as the amount contractually due in the period, which is
    nil on a roll-up product (RREL39).

number_of_days_in_arrears:
  aliases:
    - Arrears Days
  note: Days past due at the cut-off date (RREL68).

default_amount:
  aliases:
    - Defaulted Balance
  note: Balance treated as in default (RREL71).

cumulative_recoveries:
  aliases:
    - Recoveries To Date
  note: Recoveries received to date (RREL74).

prepayment_fee:
  aliases:
    - Exit Fee Charged
  note: >-
    The servicer's naming for the early-repayment charge. Pinned to
    prepayment_fee, the field the Annex 2 code is built from (RREL61).

current_valuation_method:
  aliases:
    - Valuation Method
  note: >-
    How the indexed valuation was established. On this book the servicer indexes
    a completion-date full survey, so the reported method is the same as the
    origination book's (RREC14).

original_collateral_identifier:
  aliases:
    - Vendor Collateral Reference
  note: >-
    The vendor's collateral key before the book transferred. Retained so the
    submission can report the identifier as it stood at securitisation (RREC3).
